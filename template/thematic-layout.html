<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>EnglishExplorer — Placeholder</title>
    <meta
      name="description"
      content="EnglishExplorer — Placeholder"
    />
    <meta name="theme-color" content="#B8860B" />
    <meta property="og:title" content="English Tasks" />
    <meta property="og:description" content="Placeholder" />
    <meta property="og:image" content="https://res.cloudinary.com/dqwm4pdbz/image/upload/v1766700880/my-express-uploads/vii2nhjxitkmcoet6jbg.png" />
    <meta name="twitter:title" content="English Tasks" />
    <meta name="twitter:description" content="Placeholder" />
    <meta name="twitter:image" content="https://res.cloudinary.com/dqwm4pdbz/image/upload/v1766700880/my-express-uploads/vii2nhjxitkmcoet6jbg.png" />
    <link
      rel="icon"
      type="image/png"
      href="https://res.cloudinary.com/dqwm4pdbz/image/upload/v1766700880/my-express-uploads/vii2nhjxitkmcoet6jbg.png"
    />
    <link
      rel="apple-touch-icon"
      href="https://res.cloudinary.com/dqwm4pdbz/image/upload/v1766700880/my-express-uploads/vii2nhjxitkmcoet6jbg.png"
    />
    <style>
      :root {
        --bg: #faf7f2;
        --ink: #14213d;
        --muted: #60708d;
        --accent: #b8860b;
        --accent2: #ffd54f;
        --good: #19a974;
        --bad: #e05252;
        --panel: #fcfcfc;
        --shadow: 0 18px 50px rgba(20, 33, 61, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        touch-action: manipulation;
      }
      button {
        font: inherit;
        border: 0;
        cursor: pointer;
        transition: transform 0.3s ease, filter 0.3s ease;
      }
      #app {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        position: relative;
        overflow: hidden;
      }
      .screen {
        position: absolute;
        inset: 0;
        background: var(--bg);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: clamp(60px, 8.5vh, 80px) clamp(10px, 2vw, 24px)
          clamp(10px, 2vh, 24px);
      }
      .content {
        width: min(1400px, 100%);
        max-height: 100%;
        position: relative;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 1.4em;
        padding-bottom: clamp(60px, 8vh, 80px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        scrollbar-width: none;
      }
      .content::-webkit-scrollbar {
        display: none;
      }
      .ribbon {
        font-size: clamp(1.4rem, 2.8vw, 2.2rem);
        font-weight: 800;
        color: var(--accent);
        margin: 0 0 0.4em 0;
        position: relative;
        display: inline-block;
        padding: 0 0.3em;
      }
      .ribbon::after {
        content: "";
        position: absolute;
        bottom: -4px;
        left: 10%;
        right: 10%;
        height: 3px;
        background: var(--accent2);
        border-radius: 2px;
      }
      .banner {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        padding: 0.15em 0.8em;
        border-radius: 8px;
        font-size: clamp(0.9rem, 1.6vw, 1.3rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 0.1em;
      }
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4em;
        width: 100%;
      }
      .panel {
        position: relative;
        background: var(--accent2);
        border: 3px solid var(--accent2);
        border-radius: 22px;
        padding: clamp(1.2rem, 2.2vw, 2.4rem);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 900px;
        color: var(--ink);
        font-size: clamp(1rem, 1.8vw, 1.3rem);
        line-height: 1.6;
      }
      button:focus-visible {
        outline: 3px solid var(--accent2);
        outline-offset: 3px;
      }
      @media (hover: hover) {
        button:hover {
          transform: translateY(-2px);
        }
      }
      .topbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: clamp(48px, 7vh, 56px);
        padding: 0 clamp(12px, 3vw, 28px);
        background: var(--accent);
        z-index: 20;
        overflow: hidden;
      }
      .topbarTitle {
        font-size: clamp(0.85rem, 2vw, 1.2rem);
        font-weight: 800;
        color: #fff;
        letter-spacing: 0.04em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .topbarRight {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .ctrl {
        min-width: 44px;
        min-height: 44px;
        padding: 0 4px;
        background: transparent;
        border: 0;
        font-size: 0.95rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        -webkit-tap-highlight-color: transparent;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 30px;
        min-width: 34px;
        padding: 0 8px;
        background: var(--accent2);
        color: var(--accent);
        border-radius: 8px;
        filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.22));
        transition: transform 0.3s ease, filter 0.3s ease;
      }
      .ctrl:active .tag {
        transform: scale(0.94);
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.22));
      }
      .ctrl:hover .tag {
        transform: scale(1.06);
        filter: brightness(1.15) drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
      }
      @media (max-width: 480px) {
        .topbar {
          padding: 0 8px;
        }
        .tag {
          height: 28px;
          min-width: 30px;
          padding: 0 8px;
        }
        .topbarTitle {
          font-size: 0.78rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="topbar">
        <span class="topbarTitle">Placeholder</span>
        <div class="topbarRight">
          <button class="ctrl" id="soundBtn" aria-label="Sound">
            <span class="tag">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="1.2em"
                height="1.2em"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="vertical-align: -0.2em"
              >
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
              </svg>
            </span>
          </button>
        </div>
      </div>

      <section class="screen active" id="placeholderScreen">
        <div class="content">
          <span class="banner">Placeholder</span>
          <h1 class="ribbon">Coming Soon</h1>
          <div class="stage">
            <div class="panel">
              <p>
                This page is under construction.
                The full lesson for this theme will appear here shortly.
              </p>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      var iconVolumeOn =
        '<svg xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -0.2em"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';
      var iconVolumeOff =
        '<svg xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -0.2em"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>';
      var soundOn = true;
      var soundTag = document.getElementById("soundBtn").querySelector(".tag");
      document.getElementById("soundBtn").onclick = function () {
        soundOn = !soundOn;
        soundTag.innerHTML = soundOn ? iconVolumeOn : iconVolumeOff;
      };
    </script>
  <script src="../../tracker.js"></script>
  </body>
</html>
