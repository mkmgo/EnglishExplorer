<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>Family Photograph</title>
    <meta name="description" content="Lecture #4" />
    <link
      rel="icon"
      type="image/png"
      href="https://res.cloudinary.com/dp455m4rk/image/upload/q_auto,w_48,h_48,c_fill,g_center,r_max/v1786010302/onza_3davatar_ipbcid.png"
    />
    <link
      rel="apple-touch-icon"
      href="https://res.cloudinary.com/dp455m4rk/image/upload/q_auto,w_180,h_180,c_fill,g_center,r_max/v1786010302/onza_3davatar_ipbcid.png"
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/dp455m4rk/image/upload/q_auto,w_600,h_600,c_fill,g_center,r_max/v1786010302/onza_3davatar_ipbcid.png"
    />
    <style>
      :root {
        --bg: #f5f7fb;
        --ink: #14213d;
        --muted: #60708d;
        --accent: #2878f0;
        --card: #ffffff;
        --shadow: 0 18px 50px rgba(20, 33, 61, 0.14);
        /* SUNDAY SETTING - red accent theme.
           Change these three values to restyle all slides & buttons. */
        --sunday-bg: #ffd6d6;
        --sunday-fill: #ffb3b3;
        --sunday-ink: #8b0000;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        touch-action: manipulation;
      }
      button {
        font: inherit;
        border: 0;
        cursor: pointer;
      }
      #app {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        position: relative;
        overflow: hidden;
      }
      .screen {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: clamp(10px, 2vh, 24px) clamp(10px, 2vw, 24px);
      }
      .screen.active {
        display: flex;
      }
      .content {
        width: min(1400px, 100%);
        height: 100%;
        max-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        text-align: center;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        scrollbar-width: none;
      }
      .content::-webkit-scrollbar {
        display: none;
      }
      h1 {
        font-size: clamp(3rem, 7vw, 7rem);
        margin: 0.1em 0;
        font-weight: 900;
        letter-spacing: -0.03em;
      }
      p {
        font-size: clamp(1.2rem, 2vw, 2.2rem);
      }
      .photo-slide {
        background: var(--sunday-bg);
      }
      .photo,
      .media {
        display: block;
        width: min(68vh, 100%);
        aspect-ratio: 1 / 1;
        margin: auto;
        object-fit: contain;
        object-position: center;
        border-radius: 10px;
        box-shadow: var(--shadow);
      }
      .voice-title {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 150px;
        min-height: 54px;
        border-radius: 10px;
        background: var(--sunday-ink);
        box-shadow: 0 8px 22px rgba(20, 33, 61, 0.14);
        color: #ffffff;
        font-size: clamp(1.2rem, 2.2vw, 2rem);
        font-weight: 600;
        padding: 0.4em 1.1em;
        margin-bottom: 0.5em;
        transition: 0.15s transform;
      }
      .voice-title:active {
        transform: scale(0.96);
      }
      .topbar {
        position: absolute;
        top: 2vh;
        left: 3vw;
        right: 3vw;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 20;
      }
      .progress {
        font-size: 1.1rem;
        color: var(--sunday-ink);
        background: var(--sunday-fill);
        padding: 0.5em 1em;
        border-radius: 999px;
        font-weight: bold;
      }
      .controls {
        display: flex;
        gap: 0.7em;
        align-items: center;
      }
      .ctrl {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: var(--sunday-fill);
        color: var(--sunday-ink);
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
        font-size: 1.3rem;
      }
      .nav {
        position: absolute;
        bottom: 2vh;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 1em;
        z-index: 30;
      }
      .nav button {
        padding: 0.8em 1.5em;
        border-radius: 10px;
        background: white;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
        font-weight: 700;
        font-size: 1.1rem;
      }
      .nav .primary {
        background: var(--sunday-fill);
        color: var(--sunday-ink);
      }
      @media (max-aspect-ratio: 1/1) {
        .screen {
          padding-bottom: 88px;
        }
        .photo {
          max-height: 74vh;
        }
        .nav {
          bottom: calc(2vh + env(safe-area-inset-bottom, 0px));
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="topbar">
        <div class="progress" id="progress">1 / 1</div>
        <div class="controls">
          <button class="ctrl" id="soundBtn" aria-label="Sound">♪</button>
          <button class="ctrl" id="homeBtn" aria-label="Home">⌂</button>
        </div>
      </div>

      <!-- 1: Family photo -->
      <section class="screen photo-slide photo-slide-title active">
        <div class="content">
          <button class="voice-title" onclick="say('My Classroom')">
            My Classroom
          </button>
          <img
            class="photo"
            src="https://res.cloudinary.com/dp455m4rk/image/upload/w_1200,h_1200,c_fill,g_center,q_auto,f_auto/v1786259647/classroom_01_fnsj97.png"
            alt="Classroom"
          />
        </div>
      </section>

      <!-- 2: Family photo (duplicate) -->
      <section class="screen photo-slide photo-slide-title">
        <div class="content">
          <button class="voice-title" onclick="say('Repeat the numbers')">
            Repeat the numbers
          </button>
          <img
            class="photo"
            src="https://res.cloudinary.com/dp455m4rk/image/upload/c_crop,w_469,h_384,x_0,y_0/l_text:Arial_48:One,co_rgb:050505,g_south,y_20/v1786085565/1-6_o6fbzx.png"
            alt="One"
          />
        </div>
      </section>

      <!-- 3: What I need in class -->
      <section class="screen photo-slide photo-slide-title">
        <div class="content">
          <button class="voice-title" onclick="say('What I need in class')">
            What I need in class
          </button>
          <video
            class="media"
            src="https://res.cloudinary.com/dp455m4rk/video/upload/q_auto,w_1400/v1786261067/book_pensil_roxyrw.mp4"
            controls
            playsinline
            preload="auto"
          ></video>
        </div>
      </section>

      <!-- 4: Book -->
      <section class="screen photo-slide photo-slide-title">
        <div class="content">
          <button class="voice-title" onclick="say('Book')">
            Book
          </button>
          <img
            class="photo"
            src="https://res.cloudinary.com/dp455m4rk/image/upload/c_crop,w_424,h_421,x_0,y_0/v1786261038/book_pencil_v8ipxw.png"
            alt="Book"
          />
        </div>
      </section>

      <!-- 5: Pencil -->
      <section class="screen photo-slide photo-slide-title">
        <div class="content">
          <button class="voice-title" onclick="say('Pencil')">
            Pencil
          </button>
          <img
            class="photo"
            src="https://res.cloudinary.com/dp455m4rk/image/upload/c_crop,w_424,h_421,x_424,y_0/v1786261038/book_pencil_v8ipxw.png"
            alt="Pencil"
          />
        </div>
      </section>

      <!-- 6: Table -->
      <section class="screen photo-slide photo-slide-title">
        <div class="content">
          <button class="voice-title" onclick="say('Table')">
            Table
          </button>
          <img
            class="photo"
            src="https://res.cloudinary.com/dp455m4rk/image/upload/c_crop,w_424,h_421,x_0,y_842/v1786261038/book_pencil_v8ipxw.png"
            alt="Table"
          />
        </div>
      </section>

      <!-- Pencil -->
      <section class="screen photo-slide photo-slide-title">
        <div class="content">
          <button class="voice-title" onclick="say('Pencil')">
            Pencil
          </button>
          <img
            class="photo"
            src="https://res.cloudinary.com/dp455m4rk/image/upload/c_crop,w_424,h_421,x_424,y_421/v1786261038/book_pencil_v8ipxw.png"
            alt="Pencil"
          />
        </div>
      </section>

      <!-- 7: Chair -->
      <section class="screen photo-slide photo-slide-title">
        <div class="content">
          <button class="voice-title" onclick="say('Chair')">
            Chair
          </button>
          <img
            class="photo"
            src="https://res.cloudinary.com/dp455m4rk/image/upload/c_crop,w_424,h_421,x_0,y_421/v1786261038/book_pencil_v8ipxw.png"
            alt="Chair"
          />
        </div>
      </section>

      <!-- 8: Door -->
      <section class="screen photo-slide photo-slide-title">
        <div class="content">
          <button class="voice-title" onclick="say('Door')">
            Door
          </button>
          <img
            class="photo"
            src="https://res.cloudinary.com/dp455m4rk/image/upload/c_crop,w_424,h_421,x_424,y_842/v1786261038/book_pencil_v8ipxw.png"
            alt="Door"
          />
        </div>
      </section>

      <div class="nav">
        <button id="prevBtn" onclick="prev()">‹ BACK</button>
        <button class="primary" id="nextBtn" onclick="next()">NEXT ›</button>
      </div>
    </div>

    <script>
      var screens = Array.prototype.slice.call(
        document.querySelectorAll(".screen"),
      );
      var idx = 0;
      var soundOn = true;
      var progress = document.getElementById("progress");
      var synth =
        window.speechSynthesis ||
        window.webkitSpeechSynthesis ||
        window.mozSpeechSynthesis ||
        null;

      function show(i) {
        idx = Math.max(0, Math.min(screens.length - 1, i));
        for (var j = 0; j < screens.length; j++) {
          screens[j].classList.toggle("active", j === idx);
        }
        progress.textContent = idx + 1 + " / " + screens.length;
        document.getElementById("prevBtn").style.visibility =
          idx === 0 ? "hidden" : "visible";
        document.getElementById("nextBtn").textContent =
          idx === screens.length - 1 ? "RESTART ↻" : "NEXT ›";
        var vids = document.querySelectorAll("video");
        for (var v = 0; v < vids.length; v++) vids[v].pause();
        var cur = screens[idx].querySelector("video");
        if (cur) {
          cur.currentTime = 0;
          cur.ontimeupdate = function () {
            if (cur.duration && cur.currentTime >= cur.duration - 0.002) {
              cur.pause();
              cur.ontimeupdate = null;
            }
          };
          setTimeout(function () {
            var p = cur.play();
            if (p && p.catch) p.catch(function () {});
          }, 4);
        }
      }

      function next() {
        if (idx === screens.length - 1) show(0);
        else show(idx + 1);
      }

      function prev() {
        show(idx - 1);
      }

      function say(text) {
        if (!soundOn) return;
        if (window.tizen && window.tizen.tts) {
          try {
            tizen.tts.speak(String(text), {
              locale: "en-US",
              rate: 0.85,
              pitch: 1.0,
              type: "TTS_TYPE_SCREEN_READER",
            });
            return;
          } catch (e) {}
        }
        if (synth && typeof SpeechSynthesisUtterance !== "undefined") {
          if (synth.speaking) synth.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = "en-US";
          u.rate = 0.82;
          u.pitch = 1.08;
          synth.speak(u);
        }
      }

      document.getElementById("soundBtn").onclick = function () {
        soundOn = !soundOn;
        document.getElementById("soundBtn").textContent = soundOn ? "♪" : "✕";
        if (soundOn && synth) synth.cancel();
      };
      document.getElementById("homeBtn").onclick = function () {
        show(0);
      };
      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight" || e.key === " ") {
          if (e.preventDefault) e.preventDefault();
          next();
        }
        if (e.key === "ArrowLeft") prev();
        if (e.key === "Escape") show(0);
        if (e.keyCode === 37) prev();
        if (e.keyCode === 39) next();
      });
      show(0);
    </script>
  </body>
</html>
