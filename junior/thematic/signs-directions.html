<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>EnglishExplorer — Signs &amp; Directions</title>
    <meta name="description" content="EnglishExplorer — Learn signs, symbols and simple directions" />
    <meta name="theme-color" content="#b45309" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dqwm4pdbz/image/upload/v1766700880/my-express-uploads/vii2nhjxitkmcoet6jbg.png" />
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dqwm4pdbz/image/upload/v1766700880/my-express-uploads/vii2nhjxitkmcoet6jbg.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EnglishExplorer — Signs &amp; Directions" />
    <meta property="og:description" content="Learn signs, symbols and simple directions" />
    <meta property="og:image" content="https://res.cloudinary.com/dqwm4pdbz/image/upload/v1766700880/my-express-uploads/vii2nhjxitkmcoet6jbg.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EnglishExplorer — Signs &amp; Directions" />
    <meta name="twitter:description" content="Learn signs, symbols and simple directions" />
    <style>
      :root {
        --bg: #faf7f2;
        --ink: #14213d;
        --muted: #60708d;
        --accent: #b45309;
        --accent2: #fcd9a8;
        --good: #19a974;
        --bad: #e05252;
        --mediocre: #f39c12;
        --panel: #fcfcfc;
        --shadow: 0 18px 50px rgba(20, 33, 61, 0.14);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; width: 100%; height: 100%; overflow: hidden;
        background: var(--bg); font-family: Arial, Helvetica, sans-serif;
        color: var(--ink); touch-action: manipulation;
      }
      button { font: inherit; border: 0; cursor: pointer; }
      #app {
        width: 100%; height: 100vh; height: 100dvh;
        position: relative; overflow: hidden;
      }
      .screen {
        position: absolute; inset: 0; background: var(--bg);
        display: none; align-items: flex-start; justify-content: center;
        padding: clamp(60px,8.5vh,80px) clamp(10px,2vw,24px) clamp(10px,2vh,24px);
      }
      .screen.active { display: flex; }
      .content {
        width: min(1200px,100%); max-height: 100%; position: relative;
        text-align: center; display: flex; flex-direction: column;
        align-items: center; justify-content: flex-start; gap: 1.4em;
        padding-bottom: clamp(60px,8vh,80px); overflow-y: auto;
        -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
        scrollbar-width: none;
      }
      .content::-webkit-scrollbar { display: none; }
      .banner {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        padding: 0.15em 0.8em;
        border-radius: 8px;
        font-size: clamp(0.9rem, 1.6vw, 1.3rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 0.1em;
      }
      .ribbon {
        font-size: clamp(1.4rem, 2.8vw, 2.2rem);
        font-weight: 800;
        color: var(--accent);
        margin: 0 0 0.4em 0;
        position: relative;
        display: inline-block;
        padding: 0 0.3em;
      }
      .ribbon::after {
        content: "";
        position: absolute;
        bottom: -4px;
        left: 10%;
        right: 10%;
        height: 3px;
        background: var(--accent2);
        border-radius: 2px;
      }
      .stage {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 1.4em; width: 100%;
      }
      .panel {
        position: relative; background: var(--panel); border-radius: 32px;
        padding: clamp(1.2rem,2.2vw,2.6rem); box-shadow: var(--shadow);
        width: 100%; max-width: 900px;
      }
      .topbar {
        position: absolute;
        top: 0; left: 0; right: 0;
        display: grid; grid-template-columns: 1fr 1fr;
        align-items: center; padding: 1vh 2vw;
        background: var(--accent); z-index: 20;
      }
      .barLeft, .barRight { display: flex; align-items: center; }
      .barLeft { gap: 0.6em; }
      .barRight { justify-content: flex-end; }
      .ctrl {
        height: 1.9rem; padding: 0 0.6em; border-radius: 999px;
        background: var(--panel); box-shadow: 0 5px 18px rgba(0,0,0,0.12);
        font-size: 0.95rem; display: inline-flex; align-items: center;
        justify-content: center; line-height: 1; border: 1px solid rgba(96,112,141,0.5);
      }
      .navCtrl { width: 1.9rem; padding: 0; background: var(--accent); color: var(--accent2); }
      #toast {
        position: absolute; left: 50%; top: 12%; transform: translateX(-50%);
        z-index: 100; background: var(--ink); color: white;
        padding: 0.8em 1.5em; border-radius: 999px; font-size: 1.4rem;
        opacity: 0; pointer-events: none; transition: 0.25s;
      }
      #toast.show { opacity: 1; }

      /* ===== VOCAB CARDS ===== */
      .vocabGrid {
        display: grid; grid-template-columns: repeat(auto-fill,minmax(120px,1fr));
        gap: clamp(8px,1.2vw,16px); width: 100%;
      }
      .vocabCard {
        display: flex; flex-direction: column; align-items: center; gap: 0.4em;
        background: var(--panel); border-radius: 18px; padding: 0.7em 0.6em;
        box-shadow: var(--shadow); border: 3px solid var(--accent2);
        cursor: pointer; transition: 0.15s transform; user-select: none;
        -webkit-user-select: none;
      }
      .vocabCard:active { transform: scale(0.95); }
      .vocabCard .lucide { font-size: 0; }
      .vocabCard svg { width: clamp(40px,6vw,64px); height: clamp(40px,6vw,64px); stroke-width: 3; }
      .vocabCard .word {
        font-size: clamp(0.8rem,1.2vw,1.15rem); font-weight: 800;
        color: var(--ink); text-transform: capitalize;
      }
      .vocabCard .hint {
        font-size: clamp(0.6rem,0.9vw,0.8rem); color: var(--muted); font-weight: 600;
      }

      /* ===== SLOT MACHINE GAME ===== */
      .slotGoal {
        display: flex; flex-direction: column; align-items: center; gap: 0.3em;
        margin-bottom: 0.4em;
      }
      .slotGoalWord {
        font-size: clamp(1.6rem,3.5vw,3rem); font-weight: 900;
        color: var(--accent); line-height: 1.2;
      }
      .slotGoalHint { font-size: clamp(0.9rem,1.5vw,1.3rem); color: var(--muted); font-weight: 700; }
      .slotMachine {
        display: flex; justify-content: center; align-items: flex-end;
        gap: clamp(6px,1vw,12px); flex-wrap: wrap; width: 100%;
        margin: 0.4em 0;
      }
      .reel {
        display: flex; flex-direction: column; align-items: center; gap: 0.3em;
      }
      .reelLabel {
        font-size: clamp(0.65rem,1vw,0.95rem); font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
      }
      .reelSlot {
        width: clamp(72px,13vw,116px); height: clamp(72px,13vw,116px);
        border-radius: 18px; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 0.15em;
        background: #14213d; color: #fff; border: 3px solid #2a3a5c;
        transition: 0.2s border-color, 0.2s box-shadow;
      }
      .reelSlot svg { width: clamp(42px,7vw,72px); height: clamp(42px,7vw,72px); }
      .reelSlot .reelWord {
        font-size: clamp(2.2rem, 4.5vw, 4rem); font-weight: 800; opacity: 0.85;
      }
      .reelSlot.slotActive {
        border-color: var(--mediocre);
        box-shadow: 0 0 0 4px rgba(243,156,18,0.35);
        animation: pvPulse 1.2s ease-in-out infinite;
      }
      .reelSlot.slotDone {
        border-color: var(--good);
        box-shadow: 0 0 0 3px rgba(25,169,116,0.3);
      }
      .reelSlot.slotWrong { border-color: var(--bad); animation: pvShake 0.4s ease; }
      @keyframes pvPulse {
        0%, 100% { box-shadow: 0 0 0 4px rgba(243,156,18,0.35); }
        50% { box-shadow: 0 0 0 8px rgba(243,156,18,0.15); }
      }
      @keyframes pvShake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
      }

      /* ===== LISTENING GAME ===== */
      .listenGrid {
        display: grid; grid-template-columns: 1fr 1fr;
        gap: clamp(8px,1.5vw,16px); width: 100%; max-width: 600px; margin: 0 auto;
      }
      .listenOption {
        min-height: clamp(70px,11vh,96px); border-radius: 22px;
        background: var(--panel); box-shadow: var(--shadow);
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 0.2em; padding: 0.6em 0.8em;
        transition: 0.15s transform; border: 3px solid transparent;
      }
      .listenOption svg { width: clamp(40px,6vw,60px); height: clamp(40px,6vw,60px); }
      .listenOption:active { transform: scale(0.95); }
      .listenOption:disabled { cursor: default; transform: none; }
      .listenOption.correct { background: #dff7ec; border-color: var(--good); }
      .listenOption.wrong { background: #fde8e8; border-color: var(--bad); }
      .hearBtn {
        margin: 0.4em auto; padding: 0.6em 1.6em; border-radius: 999px;
        background: var(--accent); color: var(--accent2); font-weight: 900;
        font-size: clamp(1.1rem,1.9vw,1.7rem); box-shadow: 0 6px 20px rgba(180,83,9,0.3);
        transition: 0.15s transform;
      }
      .hearBtn:active { transform: scale(0.95); }

      /* ===== RESULTS ===== */
      .resultsIcon { font-size: clamp(3rem,7vw,6rem); margin: 0.2em 0; }
      .resultsText { font-size: clamp(1.4rem,3vw,2.8rem); font-weight: 900; color: var(--ink); line-height: 1.2; }
      .resultsSub { font-size: clamp(1rem,1.8vw,1.6rem); color: var(--muted); font-weight: 700; }
      .resultsStars { display: flex; gap: clamp(6px,1vw,12px); justify-content: center; margin: 0.5em 0; }
      .resultsStar { font-size: clamp(2rem,4vw,3.5rem); transition: 0.3s transform; }
      .resultsStar.empty { opacity: 0.2; filter: grayscale(1); }
      .resultsStar.filled { animation: starPop 0.6s cubic-bezier(0.2,1.6,0.4,1) forwards; }
      @keyframes starPop {
        0% { transform: scale(0) rotate(-30deg); }
        60% { transform: scale(1.3) rotate(8deg); }
        100% { transform: scale(1) rotate(0); }
      }
      .playAgainBtn {
        margin-top: 1em; padding: 0.8em 2em; border-radius: 999px;
        background: var(--accent); color: var(--accent2); font-weight: 900;
        font-size: clamp(1.1rem,2vw,1.8rem); letter-spacing: 0.03em;
        box-shadow: 0 8px 24px rgba(180,83,9,0.3); transition: 0.15s transform;
      }
      .playAgainBtn:active { transform: scale(0.95); }

      /* ===== ROUND PIPS ===== */
      .roundPips { display: flex; gap: 0.5em; justify-content: center; margin-bottom: 0.8em; }
      .pip { width: 22px; height: 22px; border-radius: 50%; background: #eef1f7; box-shadow: inset 0 0 0 2px rgba(20,33,61,0.15); }
      .pip.pip-good { background: var(--good); box-shadow: 0 0 0 2px #fff, inset 0 0 0 2px #0f8a60; }
      .pip.pip-med { background: var(--mediocre); box-shadow: 0 0 0 2px #fff, inset 0 0 0 2px #c07800; }
      .pip.pip-bad { background: var(--bad); box-shadow: 0 0 0 2px #fff, inset 0 0 0 2px #b03a3a; }
      .pip.pip-current { box-shadow: 0 0 0 3px var(--accent2), inset 0 0 0 2px rgba(20,33,61,0.25); }

      /* ===== DIALOGUE PANEL ===== */
      .dialogue {
        width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 0.8em;
      }
      .dline {
        display: flex; align-items: flex-start; gap: 0.6em; max-width: 92%;
        padding: 0.7em 1em; border-radius: 18px; font-size: clamp(1rem,1.7vw,1.4rem);
        line-height: 1.5; text-align: left;
      }
      .dline.left { align-self: flex-start; background: var(--accent2); color: var(--ink); border-top-left-radius: 4px; }
      .dline.right { align-self: flex-end; background: #e6ecf6; color: var(--ink); border-top-right-radius: 4px; flex-direction: row-reverse; }
      .dline .who { font-weight: 900; margin-right: 0.4em; color: var(--accent); }
      .dline.right .who { margin-right: 0; margin-left: 0.4em; color: #2563eb; }
      .dline .lucide { display: inline-flex; align-items: center; margin-left: 0.5em; }
      .dline .lucide svg { width: 1em; height: 1em; vertical-align: -0.15em; }
      .dline.right .lucide { margin-left: 0; margin-right: 0.5em; }

      @media (max-aspect-ratio: 1/1) {
        .listenGrid { max-width: 95%; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toast"></div>

      <!-- TOP BAR -->
      <div class="topbar">
        <div class="barLeft">
          <button class="ctrl navCtrl" id="prevBtn" aria-label="Back" onclick="prev()">
            <span class="tag"></span>
          </button>
          <button class="ctrl" id="soundBtn" aria-label="Sound">
            <span class="tag"></span>
          </button>
        </div>
        <div class="barRight">
          <button class="ctrl navCtrl primary" id="nextBtn" aria-label="Next" onclick="next()">
            <span class="tag"></span>
          </button>
        </div>
      </div>

      <!-- ===== SCREEN 1: VOCABULARY ===== -->
      <section class="screen" id="vocabScreen">
        <div class="content">
          <span class="banner">WORDS</span>
          <h2 class="ribbon" id="vocabTitle">Tap each sign to hear it</h2>
          <div class="stage">
            <div class="panel">
              <div class="vocabGrid" id="vocabGrid"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== SCREEN 3: GAME 1 — SLOT MACHINE ===== -->
      <section class="screen" id="slotScreen">
        <div class="content">
          <span class="banner">GAME 1 · SLOT MACHINE</span>
          <h2 class="ribbon" id="slotTitle">Pull the Slot and Match!</h2>
          <div class="stage">
            <div class="panel">
              <div class="roundPips" id="slotPips"></div>
              <div class="slotGoal">
                <div class="slotGoalWord" id="slotGoalWord"></div>
                <div class="slotGoalHint" id="slotGoalHint"></div>
              </div>
              <div class="slotMachine" id="slotMachine"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== SCREEN 4: GAME 2 — LISTENING ===== -->
      <section class="screen" id="listenScreen">
        <div class="content">
          <span class="banner">GAME 2 · HEAR IT</span>
          <h2 class="ribbon" id="listenTitle">Hear and Understand</h2>
          <div class="stage">
            <div class="panel">
              <div class="roundPips" id="listenPips"></div>
              <button class="hearBtn" id="hearBtn">&#128266; LISTEN</button>
              <div class="listenGrid" id="listenGrid"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== SCREEN 5: RESULTS ===== -->
      <section class="screen" id="resultsScreen">
        <div class="content">
          <div class="stage">
            <div class="resultsIcon" id="resultsIcon"></div>
            <div class="resultsStars" id="resultsStars"></div>
            <div class="resultsText" id="resultsText"></div>
            <div class="resultsSub" id="resultsSub"></div>
            <button class="playAgainBtn" onclick="restartAll()">PLAY AGAIN</button>
          </div>
        </div>
      </section>
    </div>

    <script>
    /* =========================================================
       SIGNS & DIRECTIONS LESSON
       ========================================================= */

    /* ---- Lucide SVG library (approved exception) ---- */
    /* Icons are injected as inline SVG strings so we do not need the CDN. */

    function licon(name, sw){
      sw = sw || 3;
      var paths = {
        "arrow-up": '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
        "arrow-down": '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
        "arrow-up-down": '<path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/>',
        "arrow-left": '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
        "arrow-right": '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
        "ban": '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
        "x": '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
        "square": '<rect width="18" height="18" x="3" y="3" rx="0"/>',
        "triangle": '<path d="M13.73 4a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>',
        "circle": '<circle cx="12" cy="12" r="10"/>',
        "plus": '<path d="M5 12h14"/><path d="M12 5v14"/>',
        "minus": '<path d="M5 12h14"/>',
        "volume": '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>'
      };
      var p = paths[name] || '';
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
    }

    /* ---- Vocabulary: word -> icon ---- */
    var VOCAB = [
      { word: "Forwards", icon: "arrow-up", hint: "go ahead ↑" },
      { word: "Up", icon: "arrow-up", hint: "up ↑" },
      { word: "One Way", icon: "arrow-up", hint: "only this way" },
      { word: "Oncoming traffic", icon: "arrow-up-down", hint: "both ways" },
      { word: "Backwards", icon: "arrow-down", hint: "go back ↓" },
      { word: "Down", icon: "arrow-down", hint: "down ↓" },
      { word: "Left", icon: "arrow-left", hint: "to the left" },
      { word: "Right", icon: "arrow-right", hint: "to the right" },
      { word: "Wrong way", icon: "ban", hint: "never go here" },
      { word: "Cross", icon: "x", hint: "✕ symbol" },
      { word: "Times", icon: "x", hint: "2 × 3" },
      { word: "Square", icon: "square", hint: "shape □" },
      { word: "Triangle", icon: "triangle", hint: "shape △" },
      { word: "Circle", icon: "circle", hint: "shape ○" },
      { word: "Plus", icon: "plus", hint: "2 + 2" },
      { word: "Minus", icon: "minus", hint: "5 − 1" }
    ];

    /* ---- Game state ---- */
    var ROUNDS = 8;
    var SLOT_ROUNDS = 8;
    var LISTEN_ROUNDS = 8;

    var slotRounds = [];
    var slotIdx = 0;
    var slotResults = [];
    var slotBusy = false;

    var listenRounds = [];
    var listenIdx = 0;
    var listenResults = [];
    var listenBusy = false;

    var totalStars = 0;
    var maxStars = 2;

    /* ---- Utility ---- */
    function shuffle(arr){
      var a=arr.slice();
      for(var i=a.length-1;i>0;i--){
        var j=Math.floor(Math.random()*(i+1));
        var t=a[i]; a[i]=a[j]; a[j]=t;
      }
      return a;
    }
    function pick(arr,n){ return shuffle(arr).slice(0,n); }

    /* =========================================================
       GAME 1 — SLOT MACHINE
       A fruit machine with 3 reels. Only ONE reel carries the
       sign that matches the spoken goal; the other two are
       decoys: numbers, letters, or similar-looking icons (so the
       learner must truly read the sign, not just guess).
       ========================================================= */

    var SLOT_SYMBOLS = ["4","6","8","A","C","E","3","9","B","D"];
    var DECOY_ICONS = ["arrow-up-down","arrow-down","arrow-left","arrow-right","x","plus","minus","ban","square","triangle","circle"];

    function setupSlotRounds(){
      /* pick distinct words that map to distinct icons to keep the
         "pull the one matching reel" logic fair */
      var chosen=[];
      var usedIcon={};
      var pool=shuffle(VOCAB.slice());
      for(var i=0;i<pool.length && chosen.length<SLOT_ROUNDS;i++){
        var w=pool[i];
        if(usedIcon[w.icon]) continue;
        usedIcon[w.icon]=true;
        chosen.push(w);
      }
      slotRounds=chosen;
    }

    function slotStart(){
      if(slotIdx>=slotRounds.length){ finishSlotGame(); return; }
      var target=slotRounds[slotIdx];
      slotBusy=false;
      document.getElementById("slotTitle").textContent="Pull the Slot and Match!";
      document.getElementById("slotGoalWord").textContent=target.word;
      document.getElementById("slotGoalHint").textContent="Find the sign for “"+target.word+"”";
      renderSlotReels(target);
      setPips("slotPips",slotResults,slotIdx,SLOT_ROUNDS);
      /* The three reels spin like a fruit machine */
      spinReels();
    }

    function renderSlotReels(target){
      var machine=document.getElementById("slotMachine");
      machine.innerHTML="";
      /* one reel is the correct icon, the two others are decoys */
      var decoyIcons=DECOY_ICONS.filter(function(c){ return c!==target.icon; });
      var decoy=[];
      if(Math.random()<0.65) decoy.push({type:"sym",icon:"",text:SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)]});
      else decoy.push({type:"icon",icon:shuffle(decoyIcons).slice(0,1)[0],text:""});
      var secondType=Math.random()<0.65?"sym":"icon";
      if(secondType==="sym") decoy.push({type:"sym",icon:"",text:SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)]});
      else decoy.push({type:"icon",icon:shuffle(decoyIcons).slice(0,1)[0],text:""});
      if(decoy.length<2) decoy.push({type:"sym",icon:"",text:SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)]});
      var reels=shuffle([{type:"icon",icon:target.icon,text:""}].concat(decoy));
      while(reels.length<3) reels.push({type:"sym",icon:"",text:SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)]});
      for(var i=0;i<reels.length;i++){
        (function(i,r,target){
          var reel=document.createElement("div");
          reel.className="reel";
          reel.innerHTML='<div class="reelLabel">Slot '+(i+1)+'</div>'
            +'<div class="reelSlot" id="reel'+i+'"></div>';
          reel.setAttribute("data-type",r.type);
          reel.setAttribute("data-icon",r.icon||"");
          reel.setAttribute("data-sym",r.text||"");
          reel.style.cursor="pointer";
          reel.onclick=function(){ slotReelTap(i,target); };
          machine.appendChild(reel);
        })(i,reels[i],target);
      }
    }

    function spinReels(){
      /* quick random cycling to feel like a slot machine */
      var cycles=[0,0,0];
      var spins=Math.floor(Math.random()*3)+5;
      var symbols=["arrow-up","arrow-down","arrow-left","arrow-right","x","square","triangle","circle","plus","minus","ban","arrow-up-down","4","6","8","A","C","E"];
      if(spinTimer){ window.clearInterval(spinTimer); spinTimer=null; }
      spinTimer=window.setInterval(function(){
        var done=0;
        for(var i=0;i<3;i++){
          if(cycles[i]>=spins){ done++; continue; }
          cycles[i]++;
          var el=document.getElementById("reel"+i);
          if(!el) continue;
          var pick=symbols[Math.floor(Math.random()*symbols.length)];
          el.innerHTML=(/^[0-9A-Z]$/.test(pick))?pick:licon(pick,3);
        }
        if(done>=3){
          window.clearInterval(spinTimer);
          spinTimer=null;
          revealReels();
        }
      },110);
    }

    function settleReels(){
      var machine=document.getElementById("slotMachine");
      for(var i=0;i<3;i++){
        var el=machine.children[i];
        var type=el.getAttribute("data-type");
        var icon=el.getAttribute("data-icon");
        var sym=el.getAttribute("data-sym");
        var slot=el.querySelector(".reelSlot");
        if(!slot) continue;
        if(type==="icon") slot.innerHTML=licon(icon,3);
        else slot.innerHTML='<span class="reelWord">'+sym+'</span>';
      }
      document.getElementById("slotGoalHint").textContent="Tap the reel with the correct sign!";
    }

    function revealReels(){
      settleReels();
      var slotScr=document.getElementById("slotScreen");
      if(slotScr&&slotScr.classList.contains("active")){
        say("Find the sign for "+document.getElementById("slotGoalWord").textContent+".");
      }
    }

    function slotReelTap(reelIndex,target){
      if(slotBusy) return;
      slotBusy=true;
      if(spinTimer){ window.clearInterval(spinTimer); spinTimer=null; settleReels(); }
      var machine=document.getElementById("slotMachine");
      var reelEl=machine.children[reelIndex];
      var isCorrect=(reelEl.getAttribute("data-icon")===target.icon);
      var slot=reelEl.querySelector(".reelSlot");
      if(isCorrect){
        slot.classList.add("slotDone");
        slotResults.push("good");
        toast("CORRECT!");
        say("Correct! That's the "+target.word+" sign!",step);
        logIt("SlotMachine","Correct",target.word);
      } else {
        slot.classList.add("slotWrong");
        var correctIndex=-1;
        for(var i=0;i<3;i++){
          if(machine.children[i].getAttribute("data-icon")===target.icon) correctIndex=i;
        }
        if(correctIndex>=0){
          machine.children[correctIndex].querySelector(".reelSlot").classList.add("slotDone");
        }
        slotResults.push("bad");
        toast("It was the "+target.word+" sign.");
        say("It's the "+target.word+" sign.",step);
        logIt("SlotMachine","Wrong",target.word);
      }
      var fallback=window.setTimeout(step,4500);
      var t0=Date.now();
      function step(){
        window.clearTimeout(fallback);
        var wait=Math.max(0,600-(Date.now()-t0));
        window.setTimeout(advance,wait);
      }
      function advance(){
        var slotScr=document.getElementById("slotScreen");
        if(!slotScr||!slotScr.classList.contains("active")){ slotBusy=false; return; }
        slotBusy=false;
        slotIdx++;
        setPips("slotPips",slotResults,slotIdx,SLOT_ROUNDS);
        slotStart();
      }
    }

    function finishSlotGame(){
      var gCount=slotResults.filter(function(r){return r==="good";}).length;
      var bCount=slotResults.filter(function(r){return r==="bad";}).length;
      var stars=0;
      if(bCount===0 && gCount>=SLOT_ROUNDS-1) stars=1;
      else if(gCount>=SLOT_ROUNDS-2 && bCount<=2) stars=1;
      totalStars+=stars;
      document.getElementById("slotTitle").textContent="GAME 1 COMPLETE!";
      setPips("slotPips",slotResults,slotResults.length,SLOT_ROUNDS);
      var advanced=false;
      var fallback=null;
      function advance(){
        if(advanced) return;
        advanced=true;
        if(fallback) window.clearTimeout(fallback);
        var slotScr=document.getElementById("slotScreen");
        if(!slotScr||!slotScr.classList.contains("active")) return;
        showListenGame();
      }
      say("Game one complete! Well done!",advance);
      fallback=window.setTimeout(advance,5000);
    }

    /* =========================================================
       GAME 2 — LISTENING (hear & understand)
       You hear a word. Four icons are shown. Pick the one that
       matches what you heard. To be challenging, similar icons.
       ========================================================= */
    function setupListenRounds(){
      var chosen=[];
      var usedIcon={};
      var pool=shuffle(VOCAB.slice());
      for(var i=0;i<pool.length && chosen.length<LISTEN_ROUNDS;i++){
        var w=pool[i];
        if(usedIcon[w.icon]) continue;
        usedIcon[w.icon]=true;
        chosen.push(w);
      }
      listenRounds=chosen;
    }

    function otherIconsFor(target){
      /* icon names that are unique and not the target's icon */
      var unique=[];
      var seen={};
      for(var i=0;i<VOCAB.length;i++){
        var ic=VOCAB[i].icon;
        if(ic===target.icon) continue;
        if(seen[ic]) continue;
        seen[ic]=true;
        unique.push(ic);
      }
      return unique;
    }

    function getListenOptions(target){
      var opts=[target.icon];
      var pool=otherIconsFor(target);
      while(opts.length<4 && pool.length>0) opts.push(pool.shift());
      return shuffle(opts);
    }

    function showListenGame(){
      setupListenRounds();
      listenIdx=0; listenResults=[]; listenBusy=false;
      show(3);
    }

    function listenStart(){
      if(listenIdx>=listenRounds.length){ finishListenGame(); return; }
      cancelSpeech();
      var w=listenRounds[listenIdx];
      var round=listenIdx;
      document.getElementById("listenTitle").textContent="Hear and Understand";
      document.getElementById("hearBtn").style.display="inline-block";
      document.getElementById("listenGrid").innerHTML="";
      setPips("listenPips",listenResults,listenIdx,LISTEN_ROUNDS);
      buildListenOptions(w);
      /* auto play the word after a short beat */
      if(listenAutoTimer){ window.clearTimeout(listenAutoTimer); listenAutoTimer=null; }
      listenAutoTimer=window.setTimeout(function(){
        listenAutoTimer=null;
        var lScr=document.getElementById("listenScreen");
        if(round===listenIdx && lScr&&lScr.classList.contains("active")){
          hearWord(w);
        }
      },700);
    }

    function hearWord(w){
      say("Which sign means "+w.word+"?");
    }

    function buildListenOptions(w){
      var opts=getListenOptions(w);
      var grid=document.getElementById("listenGrid");
      grid.innerHTML="";
      for(var i=0;i<opts.length;i++){
        (function(icon){
          var btn=document.createElement("button");
          btn.className="listenOption";
          btn.setAttribute("data-icon",icon);
          btn.innerHTML=licon(icon,3);
          btn.onclick=function(){ listenAnswer(icon,w,btn); };
          grid.appendChild(btn);
        })(opts[i]);
      }
    }

    function listenAnswer(chosen,w,btn){
      if(listenBusy) return;
      listenBusy=true;
      if(listenAutoTimer){ window.clearTimeout(listenAutoTimer); listenAutoTimer=null; }
      var btns=document.querySelectorAll("#listenGrid .listenOption");
      for(var i=0;i<btns.length;i++) btns[i].disabled=true;
      if(chosen===w.icon){
        btn.classList.add("correct");
        listenResults.push("good");
        toast("CORRECT!");
        say("Correct!",step);
        logIt("Listening","Correct",w.word);
      } else {
        btn.classList.add("wrong");
        for(var j=0;j<btns.length;j++){
          if(btns[j].getAttribute("data-icon")===w.icon) btns[j].classList.add("correct");
        }
        listenResults.push("bad");
        toast("It's "+w.word+"!");
        say("It's "+w.word+"!",step);
        logIt("Listening","Wrong",w.word);
      }
      var fallback=window.setTimeout(step,4000);
      var t0=Date.now();
      function step(){
        window.clearTimeout(fallback);
        var wait=Math.max(0,400-(Date.now()-t0));
        window.setTimeout(advance,wait);
      }
      function advance(){
        listenBusy=false;
        var lScr=document.getElementById("listenScreen");
        if(!lScr||!lScr.classList.contains("active")) return;
        listenIdx++;
        listenStart();
      }
    }

    function finishListenGame(){
      var gCount=listenResults.filter(function(r){return r==="good";}).length;
      var bCount=listenResults.filter(function(r){return r==="bad";}).length;
      var stars=0;
      if(bCount===0 && gCount>=LISTEN_ROUNDS-1) stars=1;
      else if(gCount>=LISTEN_ROUNDS-2 && bCount<=2) stars=1;
      totalStars+=stars;
      document.getElementById("listenTitle").textContent="GAME 2 COMPLETE!";
      setPips("listenPips",listenResults,listenResults.length,LISTEN_ROUNDS);
      var advanced=false;
      var fallback=null;
      function advance(){
        if(advanced) return;
        advanced=true;
        if(fallback) window.clearTimeout(fallback);
        var lScr=document.getElementById("listenScreen");
        if(!lScr||!lScr.classList.contains("active")) return;
        showResults();
      }
      say("Game two complete! Well done!",advance);
      fallback=window.setTimeout(advance,5000);
    }

    /* =========================================================
       RESULTS
       ========================================================= */
    function showResults(){
      show(4);
      var icon=document.getElementById("resultsIcon");
      var text=document.getElementById("resultsText");
      var sub=document.getElementById("resultsSub");
      var starsEl=document.getElementById("resultsStars");
      starsEl.innerHTML="";
      if(totalStars>=2){
        icon.textContent="\uD83C\uDFC6";
        text.textContent="AMAZING! YOU KNOW YOUR SIGNS!";
        sub.textContent="You earned all the stars!";
        say("Amazing! You know your signs and directions!");
      } else if(totalStars>=1){
        icon.textContent="\u2B50";
        text.textContent="WELL DONE!";
        sub.textContent="You earned "+totalStars+"/"+maxStars+" stars. Try again for more!";
        say("Well done! Try again to earn more stars!");
      } else {
        icon.textContent="\uD83D\uDCAA";
        text.textContent="KEEP PRACTISING!";
        sub.textContent="Road signs and directions take practice. Try again!";
        say("Keep practising! You can do it!");
      }
      for(var i=0;i<maxStars;i++){
        var span=document.createElement("span");
        span.className="resultsStar "+(i<totalStars?"filled":"empty");
        span.textContent="\u2B50";
        span.style.animationDelay=(i*0.3)+"s";
        starsEl.appendChild(span);
      }
      if(totalStars>=2) setTimeout(function(){ celebrate("SIGNS CHAMPION!"); },800);
    }

    /* =========================================================
       PIPS
       ========================================================= */
    function buildPips(id,n){
      var el=document.getElementById(id);
      if(!el) return;
      el.innerHTML="";
      for(var i=0;i<n;i++){
        var s=document.createElement("span");
        s.className="pip";
        el.appendChild(s);
      }
    }
    function setPips(id,results,current,totalRounds){
      var el=document.getElementById(id);
      if(!el) return;
      var maxR=totalRounds||ROUNDS;
      if(el.children.length===0) buildPips(id,Math.max(results.length+1,current+1,maxR));
      for(var i=0;i<el.children.length;i++){
        var p=el.children[i];
        p.className="pip";
        if(i<results.length){
          p.classList.add(results[i]==="good"?"pip-good":results[i]==="mediocre"?"pip-med":"pip-bad");
        } else if(i===current){
          p.classList.add("pip-current");
        }
      }
    }

    /* =========================================================
       TOAST / CELEBRATE
       ========================================================= */
    function toast(t){
      var el=document.getElementById("toast");
      el.textContent=t; el.classList.add("show");
      setTimeout(function(){ el.classList.remove("show"); },1200);
    }
    function confettiBurst(){
      var r=document.createElement("div");
      r.style.position="fixed"; r.style.inset="0"; r.style.pointerEvents="none"; r.style.zIndex="50"; r.style.overflow="hidden";
      for(var i=0;i<24;i++){
        var s=document.createElement("span");
        s.style.position="absolute"; s.style.fontSize="2rem";
        s.textContent=["\u2B50","\u2728","\uD83C\uDF89","\uD83D\uDC4F"][i%4];
        s.style.left=Math.random()*100+"%";
        s.style.top="-5%";
        s.style.animation="fall 2.2s linear forwards";
        r.appendChild(s);
      }
      document.body.appendChild(r);
      setTimeout(function(){ if(r.parentNode) r.parentNode.removeChild(r); },2500);
    }
    function celebrate(t){ toast(t); confettiBurst(); }

    /* =========================================================
       RESTART
       ========================================================= */
    function restartAll(){
      totalStars=0;
      if(spinTimer){ window.clearInterval(spinTimer); spinTimer=null; }
      if(listenAutoTimer){ window.clearTimeout(listenAutoTimer); listenAutoTimer=null; }
      setupSlotRounds(); slotIdx=0; slotResults=[]; slotBusy=false;
      setupListenRounds(); listenIdx=0; listenResults=[]; listenBusy=false;
      show(0);
    }

    /* =========================================================
       SCREEN NAVIGATION (standard pattern)
       ========================================================= */
    var screens=Array.prototype.slice.call(document.querySelectorAll(".screen"));
    var countTotal=0;
    var activeIdx=[];
    var lastCounted=screens.length-1;
    for(var s=0;s<screens.length;s++){
      if(screens[s].hasAttribute("data-nocount")) continue;
      if(screens[s].hasAttribute("data-retired")) continue;
      countTotal++;
      lastCounted=s;
      activeIdx.push(s);
    }
    var idx=0;
    var soundOn=true;
    var synth=window.speechSynthesis||window.webkitSpeechSynthesis||window.mozSpeechSynthesis||null;
    var altVoice=null;

    function setVoice(){
      if(!synth) return;
      var voices=synth.getVoices();
      if(!voices||voices.length===0) return;
      var female=["samantha","google us english","natural","hazel","aria","zira","female","karen","moira"];
      /* score every English voice, prefer female/natural then en-GB */
      var scored=[];
      for(var i=0;i<voices.length;i++){
        var v=voices[i];
        if(!v||!v.lang) continue;
        if(v.lang.toLowerCase().indexOf("en")!==0) continue;
        var s=0;
        var nm=(v.name||"").toLowerCase();
        for(var f=0;f<female.length;f++){ if(nm.indexOf(female[f])>=0) s+=3; }
        if(v.lang.toLowerCase().indexOf("en-gb")===0) s+=1;
        scored.push({v:v,s:s});
      }
      if(scored.length===0) return;
      scored.sort(function(a,b){ return b.s-a.s; });
      altVoice=scored[0].v;
    }
    if(synth){
      setVoice();
      if(typeof synth.addEventListener==="function") synth.addEventListener("voiceschanged",setVoice);
      var voiceTimer=window.setInterval(function(){
        if(altVoice) window.clearInterval(voiceTimer);
        setVoice();
      },500);
      window.setTimeout(function(){ window.clearInterval(voiceTimer); },4000);
    }

    var ICON_ARROW_LEFT='<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>';
    var ICON_ARROW_RIGHT='<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
    var ICON_RESTART='<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>';
    var ICON_VOLUME_ON='<svg xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.2em"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';
    var ICON_VOLUME_OFF='<svg xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.2em"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>';

    var speakGen=0;
    var spinTimer=null;
    var listenAutoTimer=null;

    function cancelSpeech(){
      speakGen++;
      if(synth&&typeof synth.cancel==="function"){
        try{ synth.cancel(); }catch(e){}
      }
      if(window.tizen&&window.tizen.tts&&typeof window.tizen.tts.stop==="function"){
        try{ tizen.tts.stop(); }catch(e){}
      }
    }

    function say(text,doneCb){
      var gen=++speakGen;
      var finishDone=doneCb||function(){};
      var fired=false;
      function finish(){
        if(fired||gen!==speakGen) return;
        fired=true;
        try{ finishDone(); }catch(e){}
      }
      if(!soundOn){ finish(); return; }
      if(window.tizen&&window.tizen.tts){
        try{
          tizen.tts.speak(String(text),{
            locale:"en-US",rate:0.85,pitch:1.0,
            type:"TTS_TYPE_SCREEN_READER"
          },function(){ finish(); },function(){ finish(); });
          return;
        }catch(e){}
      }
      if(synth&&typeof SpeechSynthesisUtterance!=="undefined"){
        try{
          if(synth.speaking||synth.pending){ synth.cancel(); }
          var u=new SpeechSynthesisUtterance(text);
          u.lang="en-US"; u.rate=0.82; u.pitch=1.08;
          if(altVoice) u.voice=altVoice;
          u.onend=function(){ finish(); };
          u.onerror=function(){ finish(); };
          synth.speak(u);
          return;
        }catch(e){}
      }
      finish();
    }

    function show(i){
      idx=Math.max(0,Math.min(screens.length-1,i));
      for(var j=0;j<screens.length;j++){
        screens[j].classList.toggle("active",j===idx);
      }
      var shown=activeIdx.indexOf(idx)+1;
      if(shown<1) shown=countTotal;
      document.getElementById("prevBtn").innerHTML='<span class="tag">'+ICON_ARROW_LEFT+'</span>';
      document.getElementById("prevBtn").style.visibility="visible";
      document.getElementById("nextBtn").innerHTML='<span class="tag">'+(idx===lastCounted?ICON_RESTART:ICON_ARROW_RIGHT)+'</span>';
      document.getElementById("nextBtn").style.visibility="visible";
      cancelSpeech();
      if(idx===0){
        setTimeout(function(){
          if(idx===0){ renderVocab(); }
        },400);
      }
      if(idx===1){
        setTimeout(function(){
          if(idx===1){
            if(slotRounds.length===0){ setupSlotRounds(); slotIdx=0; slotResults=[]; slotBusy=false; }
            slotStart();
          }
        },400);
      }
      if(idx===2){
        setTimeout(function(){
          if(idx===2){
            if(listenRounds.length===0){ setupListenRounds(); listenIdx=0; listenResults=[]; listenBusy=false; }
            listenStart();
          }
        },400);
      }
    }

    function next(){
      if(idx===lastCounted) show(0);
      else {
        var nextActive=activeIdx.indexOf(idx)+1;
        show(activeIdx[nextActive]===undefined?0:activeIdx[nextActive]);
      }
    }
    function prev(){
      var prevActive=activeIdx.indexOf(idx)-1;
      show(prevActive<0?0:activeIdx[prevActive]);
    }

    /* =========================================================
       VOCAB RENDERING
       ========================================================= */
    function renderVocab(){
      var grid=document.getElementById("vocabGrid");
      grid.innerHTML="";
      for(var i=0;i<VOCAB.length;i++){
        (function(item){
          var card=document.createElement("div");
          card.className="vocabCard";
          card.innerHTML='<span class="lucide">'+licon(item.icon,3)+'</span>'
            +'<span class="word">'+item.word+'</span>'
            +'<span class="hint">'+item.hint+'</span>';
          card.onclick=function(){
            say(item.word);
          };
          grid.appendChild(card);
        })(VOCAB[i]);
      }
    }

    /* =========================================================
       LOG ACTIVITY
       ========================================================= */
    function logIt(section,action,details){
      if(typeof logActivity==="function"){
        try{ logActivity("Student_Default",window.location.pathname,section,action,details); }catch(e){}
      }
    }

    /* Sound toggle */
    var soundTag=document.getElementById("soundBtn").querySelector(".tag");
    soundTag.innerHTML=ICON_VOLUME_ON;
    document.getElementById("soundBtn").onclick=function(){
      soundOn=!soundOn;
      soundTag.innerHTML=soundOn?ICON_VOLUME_ON:ICON_VOLUME_OFF;
      cancelSpeech();
    };

    /* Keyboard */
    document.addEventListener("keydown",function(e){
      var k=e.key||"";
      var kc=e.keyCode||e.which||0;
      if(k==="ArrowRight"||kc===39||k===" "||kc===32){
        if(e.preventDefault) e.preventDefault();
        next();
      } else if(k==="ArrowLeft"||kc===37){
        prev();
      } else if(k==="Escape"||kc===27||kc===10009){
        show(0);
      } else if(kc===13||kc===29443||k==="Enter"){
        var el=document.activeElement;
        if(el&&el.tagName==="BUTTON"&&!el.disabled) el.click();
      }
    });

    /* Touch swipe */
    var touchStart=null;
    var appEl=document.getElementById("app");
    if(appEl&&"ontouchstart" in window){
      appEl.addEventListener("touchstart",function(e){
        var t=e.touches&&e.touches[0];
        if(!t) return;
        touchStart={x:t.clientX,y:t.clientY,t:Date.now()};
      },{passive:true});
      appEl.addEventListener("touchend",function(e){
        if(!touchStart) return;
        var t=e.changedTouches&&e.changedTouches[0];
        if(!t) return;
        var dx=t.clientX-touchStart.x;
        var dy=t.clientY-touchStart.y;
        var dt=Date.now()-touchStart.t;
        touchStart=null;
        if(dt>900) return;
        if(Math.abs(dx)<40&&Math.abs(dy)<40) return;
        if(Math.abs(dx)>Math.abs(dy)){
          if(dx<0) next(); else prev();
        }
      },{passive:true});
    }

    /* LISTEN button replays the current listening question */
    document.getElementById("hearBtn").onclick=function(){
      if(listenRounds.length>0 && listenIdx<listenRounds.length){
        if(listenAutoTimer){ window.clearTimeout(listenAutoTimer); listenAutoTimer=null; }
        hearWord(listenRounds[listenIdx]);
      }
    };

    /* =========================================================
       INIT
       ========================================================= */
    show(0);
    </script>
    <script src="../../tracker.js"></script>
  </body>
