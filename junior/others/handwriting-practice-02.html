<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Show Your Best Writing! — Writing Practice</title>
    <meta name="theme-color" content="#2B0603" />
    <meta name="description" content="EnglishExplorer — Handwriting word practice on help lines" />
    <meta property="og:title" content="Show Your Best Writing! — Writing Practice" />
    <meta property="og:description" content="Fill in the missing word on the help lines." />
    <meta property="og:image" content="https://res.cloudinary.com/dmkhsyfzf/image/upload/v1787858367/house-heart_dutvpy.png" />
    <meta name="twitter:title" content="Show Your Best Writing! — Writing Practice" />
    <meta name="twitter:description" content="Fill in the missing word on the help lines." />
    <meta name="twitter:image" content="https://res.cloudinary.com/dmkhsyfzf/image/upload/v1787858367/house-heart_dutvpy.png" />
    <style>
      :root {
        --bg: #faf7f2;
        --ink: #14213d;
        --muted: #60708d;
        --accent: #a63e32;
        --good: #2e9e4f;
        --line: #9aa7bd;
        --panel: #ffffff;
        --shadow: 0 18px 50px rgba(20, 33, 61, 0.14);
      }
      html.dark {
        --bg: #0f172a;
        --ink: #e2e8f0;
        --muted: #94a3b8;
        --panel: #1e293b;
        --line: #475569;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        font-family: "Segoe UI", Arial, Helvetica, sans-serif;
        color: var(--ink);
        touch-action: none;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      #themeToggle {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 10;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 2px solid transparent;
        background: var(--panel);
        color: var(--ink);
        box-shadow: var(--shadow);
        font-size: 1.25rem;
      }

      #app {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: clamp(8px, 2.5vh, 18px);
        gap: clamp(6px, 1.6vh, 12px);
      }

      .topbar {
        width: 100%;
        max-width: 980px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .topbar h1 {
        font-size: clamp(1.1rem, 3vw, 1.7rem);
        margin: 0;
        color: #c2410c;
        letter-spacing: 0.5px;
      }
      html.dark .topbar h1 {
        color: #fdba74;
      }
      .word-count {
        font-weight: 700;
        color: var(--muted);
        font-size: clamp(0.8rem, 2vw, 1rem);
      }

      .picture {
        width: min(38vh, 300px);
        max-width: 80vw;
        min-height: 90px;
        background: var(--panel);
        border-radius: 12px;
        box-shadow: var(--shadow);
        object-fit: cover;
      }

      /* ---- The word written on help lines ---- */
      .word-row {
        display: flex;
        gap: clamp(4px, 0.8vw, 10px);
        background: var(--panel);
        border-radius: 14px;
        padding: clamp(10px, 2.4vh, 22px) clamp(12px, 2vw, 28px);
        box-shadow: var(--shadow);
        flex-wrap: wrap;
        justify-content: center;
      }
      .chpad {
        position: relative;
        width: clamp(52px, 6.2vw, 84px);
        height: clamp(70px, 12vh, 104px);
        border-radius: 8px;
        background: #fff;
        overflow: hidden;
      }
      html.dark .chpad {
        background: #0b1120;
      }
      /* Dotted baseline / midline guides inside each pad */
      .chpad .guide {
        position: absolute;
        left: 0;
        right: 0;
        height: 0;
        border-top: 1.5px dashed var(--line);
        z-index: 1;
        pointer-events: none;
      }
      .chpad .guide.base {
        bottom: 22%;
      }
      .chpad .guide.mid {
        bottom: 58%;
      }
      .chpad .guide.top {
        top: 9%;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        z-index: 2;
        background: transparent;
      }

      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 2px;
      }
      button.act {
        font-size: clamp(0.85rem, 2.4vw, 1.05rem);
        font-weight: 800;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: clamp(9px, 1.8vh, 14px) clamp(14px, 2.4vw, 24px);
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.2s ease;
      }
      button.act:hover {
        filter: brightness(1.05);
      }
      button.act:active {
        transform: scale(0.96);
      }
      .btn-check {
        background: var(--good);
      }
      .btn-clear {
        background: var(--accent);
      }
      .btn-next {
        background: #3b82f6;
      }
      #nextBtn:disabled {
        background: #94a3b8;
        cursor: not-allowed;
        transform: none;
        filter: none;
        opacity: 0.6;
      }

      .verdict {
        min-height: clamp(1.3rem, 4vh, 2rem);
        font-size: clamp(1rem, 3vw, 1.3rem);
        font-weight: 800;
        margin: 0;
        text-align: center;
      }
      .verdict.ok {
        color: var(--good);
      }
      .verdict.almost {
        color: #f59e0b;
      }
      .verdict.part {
        color: var(--muted);
      }
      .verdict.fail {
        color: var(--accent);
      }
      .hint {
        color: var(--muted);
        font-size: clamp(0.75rem, 2vw, 0.92rem);
        text-align: center;
        margin: 0;
      }

      @media (orientation: portrait) {
        .picture {
          max-height: 22vh;
        }
      }
      .hidden {
        display: none !important;
      }

      /* Completion over a center screen (vertical space is tight) */
      #done {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        z-index: 50;
      }
      #done.show {
        display: flex;
      }
      .done-card {
        background: var(--panel);
        color: var(--ink);
        border-radius: 16px;
        padding: 26px 34px;
        text-align: center;
        box-shadow: var(--shadow);
        border-top: 6px solid var(--good);
        max-width: 90vw;
      }
      .done-card h2 {
        margin: 0 0 8px;
      }
      .done-card .confetti {
        font-size: 28px;
        letter-spacing: 6px;
        margin: 0 0 10px;
      }
      .done-card button {
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <button id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>

    <div id="app">
      <div class="topbar">
        <h1>Show Your Best Writing!</h1>
        <span class="word-count" id="countLabel"></span>
      </div>

      <img id="picture" class="picture hidden" alt="Word picture" />

      <p id="loadingMsg" class="hint">Loading words…</p>
      <p id="errorMsg" class="hint hidden"></p>

      <div class="word-row" id="wordRow"></div>

      <div class="controls">
        <button id="checkBtn" class="act btn-check" type="button">Check</button>
        <button id="clearBtn" class="act btn-clear" type="button">Clear</button>
        <button id="nextBtn" class="act btn-next" type="button">Next →</button>
      </div>

      <p id="verdict" class="verdict"></p>
      <p id="hintLine" class="hint"></p>
    </div>

    <div id="done">
      <div class="done-card">
        <div class="confetti">🎉 🎉 🎉</div>
        <h2>Amazing writing!</h2>
        <p id="doneMsg" class="hint"></p>
        <button id="againBtn" class="act btn-check" type="button">Play again</button>
      </div>
    </div>

    <script>
      // ---- Words are loaded from Airtable (table "HandWriting") ----
      var WORKER =
        "https://english-explorer-tracker.mkmueller-mission.workers.dev/airtable?table=HandWriting";

      var WORDS = []; // filled by fetchWords()

      // ---- Pen stroke shape signature per letter.
      // We cannot run OCR, so we compare the pupil's stroke(s) to a rough
      // letter template: how many strokes, where the pen starts, and the
      // overall vertical/horizontal spread (normalised). This gives a
      // friendly self-check — not a spelling guarantee.
      // signature: [minStrokes, minFootHeight, expectStart]
      var LETTER_SHAPES = {
        a: { strokes: 2, foot: 0.1 },
        b: { strokes: 2, foot: 0.1 },
        c: { strokes: 1, foot: 0.1 },
        d: { strokes: 2, foot: 0.1 },
        e: { strokes: 1, foot: 0.1 },
        n: { strokes: 1, foot: 0.1 },
        o: { strokes: 1, foot: 0.1 },
        i: { strokes: 2, foot: 0.1 },
        k: { strokes: 2, foot: 0.1 },
        l: { strokes: 1, foot: 0.1 },
        r: { strokes: 2, foot: 0.1 },
        t: { strokes: 2, foot: 0.1 },
        u: { strokes: 1, foot: 0.1 },
        y: { strokes: 1, foot: 0.1 },
        b2: { strokes: 2, foot: 0.1 }
      };

      var ASCENDERS = "bdfhkl";
      var DESCENDERS = "gjpqy";
      function letterType(ch) {
        if (ch !== ch.toLowerCase()) return "tall";
        if (ASCENDERS.indexOf(ch) >= 0) return "tall";
        if (DESCENDERS.indexOf(ch) >= 0) return "descender";
        return "short";
      }

      // ---- State ----
      var current = 0;
      var locked = false; // after Check, drawing is read-only until Next/Clear
      var passed = false; // the current word has passed its Check

      var $ = function (id) { return document.getElementById(id); };

      function setNextEnabled(enabled) {
        var b = $("nextBtn");
        b.disabled = !enabled;
        b.title = enabled ? "Go to the next word" : "Check your word first";
      }

      // Fisher–Yates shuffle
      function shuffle(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = arr[i];
          arr[i] = arr[j];
          arr[j] = t;
        }
        return arr;
      }

      // ---- Load words from Airtable ----
      function fetchWords() {
        $("errorMsg").classList.add("hidden");
        fetch(WORKER)
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (data) {
            var records = (data && data.records) || [];
            var words = [];
            records.forEach(function (rec) {
              var f = (rec && rec.fields) || {};
              var text = (f.Text || "").trim();
              if (!text) return;
              words.push({ w: text, img: f.Asset || "" });
            });
            if (!words.length) {
              showError("No words yet \u2014 add them in Airtable and try again.");
              return;
            }
            WORDS = shuffle(words);
            resetGame();
          })
          .catch(function (err) {
            showError("Couldn't load the words. Check your connection and try again.");
          });
      }
      function showError(msg) {
        $("loadingMsg").classList.add("hidden");
        $("errorMsg").textContent = msg;
        $("errorMsg").classList.remove("hidden");
      }
      function resetGame() {
        current = 0;
        $("loadingMsg").classList.add("hidden");
        $("countLabel").textContent = "1/" + WORDS.length;
        buildWord();
      }

      // Offscreen context reused for glyph width measurement (never drawn into
      // the visible pads). Width metrics work everywhere, incl. Tizen.
      var MEASURE = document.createElement("canvas").getContext("2d");
      var GHOST_FONT = "900 100px 'Segoe UI', Arial, sans-serif";

      // Fixed per-letter ascent/descent ratios (fractions of the font size),
      // taken from real 900-weight Segoe UI / Arial measurements. A cache of
      // maxi values so that on EVERY device the ghost letter's OWN ink stays
      // inside its handwriting zone: short letters (incl. the dot of "i" and
      // the tall stem of "t" in fonts like Arial) never rise above the middle
      // line. Tizen has no bounding-box metrics, so we never rely on them.
      var GLYPH_METRICS = (function () {
        var cap = 0.72, x = 0.53, x2 = 0.52, asc = 0.74, fAsc = 0.75, dot = 0.73, tee = 0.72;
        var T = {}, ch, i;
        for (i = 65; i <= 90; i++) {
          ch = String.fromCharCode(i);
          T[ch] = { a: cap, d: ch === "Q" ? 0.09 : 0.01 };
        }
        "acemnors".split("").forEach(function (c) { T[c] = { a: x, d: 0.01 }; });
        "uvwxz".split("").forEach(function (c) { T[c] = { a: x2, d: 0.01 }; });
        "bhdkl".split("").forEach(function (c) { T[c] = { a: asc, d: 0.01 }; });
        T.f = { a: fAsc, d: 0.01 };
        T.i = { a: dot, d: 0.01 };
        T.t = { a: tee, d: 0.01 };
        T.j = { a: dot, d: 0.24 };
        T.g = { a: x, d: 0.24 };
        T.p = { a: x, d: 0.24 };
        T.q = { a: x, d: 0.24 };
        T.y = { a: x2, d: 0.24 };
        return T;
      })();

      function ghostMetrics(ghost) {
        var m = GLYPH_METRICS[ghost];
        if (m) return m;
        var type = letterType(ghost);
        if (type === "tall") return { a: 0.72, d: 0.01 };
        if (type === "descender") return { a: 0.52, d: 0.24 };
        return { a: 0.52, d: 0.01 };
      }

      // Font size (CSS px) for one ghost letter, sized so the letter's own
      // ink fills its handwriting zone: tall letters span top line to
      // baseline, short letters span middle line to baseline (their highest
      // ink — "t" stem, "i" dot — stops exactly at the middle line).
      function ghostSize(ghost, cw, ch) {
        var type = letterType(ghost);
        var m = ghostMetrics(ghost);
        var topLine = ch * 0.09;
        var midLine = ch * 0.42;
        var baseline = ch * 0.78;
        var tailMax = ch * 0.97;
        var fs = (type === "tall") ? (baseline - topLine) / m.a : (baseline - midLine) / m.a;
        MEASURE.font = GHOST_FONT;
        var w100 = MEASURE.measureText(ghost).width;
        var fsMaxW = (cw * 0.88) * 100 / w100;
        if (fs > fsMaxW) fs = fsMaxW;
        if (type === "descender") {
          var tailLen = m.d * fs;
          if (tailLen > tailMax - baseline) fs = (tailMax - baseline) / m.d;
        }
        return { fs: fs, rA: m.a, rD: m.d, inkTop: baseline - m.a * fs, baseline: baseline };
      }

      // Faint traceable letter shown inside each blank pad before/while the
      // pupil writes. Painted on top of the cleared canvas on every redraw.
      // The capital first letter is TALL and spans from the top help line to
      // the baseline; lowercase letters are SHORTER and span from the middle
      // help line to the baseline (e.g. "Tree": a tall T, short r-e-e).
      function drawGhost(en) {
        var ctx = en.ctx;
        var cw = en.canvas.getBoundingClientRect().width;
        var ch = en.canvas.getBoundingClientRect().height;

        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        ctx.fillStyle = "rgba(160,170,190,0.45)";

        ctx.font = "900 " + en.fs + "px 'Segoe UI', Arial, sans-serif";
        ctx.fillText(en.ghost, cw / 2, ch * 0.78);
        ctx.restore();
      }

      // ---- Theme ----
      (function () {
        var d = document.documentElement;
        var theme = "system";
        try { var s = localStorage.getItem("handTheme"); if (s === "dark" || s === "light") theme = s; } catch (e) {}
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          var dark = theme === "dark" || (theme === "system" && mq.matches);
          d.classList.toggle("dark", dark);
          $("themeToggle").textContent = dark ? "☀️" : "🌙";
        }
        apply();
        if (mq.addEventListener) mq.addEventListener("change", apply);
        else if (mq.addListener) mq.addListener(apply);
        $("themeToggle").addEventListener("click", function () {
          theme = theme === "dark" ? "light" : "dark";
          try { localStorage.setItem("handTheme", theme); } catch (e) {}
          apply();
        });
      })();

      // ---- Build canvases for the current word ----
      var pads = []; // {canvas, ctx, strokes:[[{x,y},...],...], drawing}
      function buildWord() {
        var word = WORDS[current];
        var pic = $("picture");
        if (word.img) {
          pic.src = word.img;
          pic.alt = word.w;
          pic.classList.remove("hidden");
        } else {
          pic.removeAttribute("src");
          pic.alt = "";
          pic.classList.remove("hidden");
        }
        var row = $("wordRow");
        row.innerHTML = "";
        pads = [];
        locked = false;
        passed = false;
        setNextEnabled(false);
        $("verdict").textContent = "";
        $("verdict").className = "verdict";
        $("hintLine").textContent = "Trace the letters: “" + word.w.charAt(0).toUpperCase() + word.w.slice(1) + "”";
        $("countLabel").textContent = (current + 1) + "/" + WORDS.length;

        word.w.split("").forEach(function () {
          var pad = document.createElement("div");
          pad.className = "chpad";
          var g1 = document.createElement("div");
          g1.className = "guide base";
          var g2 = document.createElement("div");
          g2.className = "guide mid";
          var g0 = document.createElement("div");
          g0.className = "guide top";
          var canvas = document.createElement("canvas");
          pad.appendChild(g0);
          pad.appendChild(g2);
          pad.appendChild(g1);
          pad.appendChild(canvas);
          row.appendChild(pad);

          var ctx = canvas.getContext("2d");
          var entry = { canvas: canvas, ctx: ctx, strokes: [], drawing: false, lineWidth: 6 };
          // First letter is a capital, the rest lowercase (e.g. "Tree").
          entry.ghost =
            pads.length === 0
              ? word.w.charAt(0).toUpperCase()
              : word.w.charAt(pads.length);
          pads.push(entry);

          function size() {
            var r = canvas.getBoundingClientRect();
            var dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(r.width * dpr);
            canvas.height = Math.round(r.height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            redraw(entry); // re-apply the faint letter + any strokes
          }
          entry.size = size; // called after ghost sizes are computed below
          window.addEventListener("resize", size);

          function pos(e) {
            var r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
          }
          function down(e) {
            if (locked) return;
            e.preventDefault();
            var p = pos(e.touches ? e.touches[0] : e);
            entry.drawing = true;
            entry.strokes.push([p]);
            ctx.lineWidth = entry.lineWidth;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.strokeStyle = "#1d4ed8";
          }
          function move(e) {
            if (!entry.drawing || locked) return;
            e.preventDefault();
            var p = pos(e.touches ? e.touches[0] : e);
            var last = entry.strokes[entry.strokes.length - 1];
            last.push(p);
            redraw(entry);
          }
          function redraw(en) {
            en.ctx.clearRect(0, 0, en.canvas.width, en.canvas.height);
            drawGhost(en);
            en.strokes.forEach(function (st) {
              if (!st.length) return;
              en.ctx.beginPath();
              en.ctx.moveTo(st[0].x, st[0].y);
              for (var i = 1; i < st.length; i++) en.ctx.lineTo(st[i].x, st[i].y);
              en.ctx.stroke();
            });
          }
          function up() { entry.drawing = false; }

          canvas.addEventListener("pointerdown", function (e) { canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); down(e); });
          canvas.addEventListener("pointermove", move);
          canvas.addEventListener("pointerup", up);
          canvas.addEventListener("pointercancel", up);
        });
        // Precompute ghost font sizes: each letter sized by its own metrics
        // so ascenders match the capital height and the dot of 'i' stays in
        // the short-letter zone instead of overshooting.
        var _rect = pads[0].canvas.getBoundingClientRect();
        var _sizes = pads.map(function (en) {
          return ghostSize(en.ghost, _rect.width, _rect.height);
        });
        var _capTop = _sizes[0].inkTop;
        _sizes.forEach(function (s) {
          if (s.inkTop < _capTop) s.fs = (s.baseline - _capTop) / s.rA;
        });
        pads.forEach(function (en, i) {
          en.fs = _sizes[i].fs;
          en.size();
        });
      }

      // ---- Shape check for one letter pad ----
      function checkPad(en) {
        if (!en.strokes.length) return { drawn: false };
        var type = letterType(en.ghost);
        var box = en.canvas.getBoundingClientRect();
        var ch = box.height;
        var cw = box.width;
        var all = [];
        en.strokes.forEach(function (st) { all = all.concat(st); });
        var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        all.forEach(function (p) {
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
        });
        var w = maxX - minX, h = maxY - minY;
        var coverage = Math.min(1, (w * h) / (cw * ch));
        var hints = [];
        var zoneOk = true;
        if (type === "tall") {
          if (minY / ch > 0.50) { hints.push("Reach higher to the top line"); zoneOk = false; }
          if (maxY / ch < 0.68) { hints.push("Come down to the baseline"); zoneOk = false; }
        } else if (type === "short") {
          if (minY / ch < 0.32) { hints.push("Stay below the middle line"); zoneOk = false; }
          if (maxY / ch > 0.88) { hints.push("Don\u2019t go below the baseline"); zoneOk = false; }
          if (maxY / ch < 0.68) { hints.push("Reach down to the baseline"); zoneOk = false; }
        } else {
          if (minY / ch < 0.32) { hints.push("Start from the middle line"); zoneOk = false; }
          if (maxY / ch < 0.78) { hints.push("The tail should go below the baseline"); zoneOk = false; }
        }
        return { drawn: true, zoneOk: zoneOk, coverage: coverage, hints: hints, strokes: en.strokes.length };
      }

      // ---- Check the whole word ----
      function checkWord() {
        if (locked) return;
        locked = true;
        var word = WORDS[current];
        var letters = word.w.split("");
        var anyDrawn = false,
          okCount = 0,
          allHints = [];
        pads.forEach(function (en, i) {
          var r = checkPad(en);
          if (r.drawn) anyDrawn = true;
          var ok = r.drawn && r.zoneOk && r.coverage > 0.05 && r.coverage < 0.95 && r.strokes <= 6;
          if (ok) {
            okCount++;
          } else if (r.drawn && r.hints.length) {
            allHints.push({ letter: letters[i], hint: r.hints[0] });
          }
        });
        var v = $("verdict");
        var h = $("hintLine");
        if (!anyDrawn) {
          v.textContent = "Draw the word first, then check.";
          v.className = "verdict fail";
          h.textContent = "";
          locked = false;
          return;
        }
        if (okCount >= pads.length - 1) {
          passed = true;
          setNextEnabled(true);
          v.textContent = "\u201c" + word.w + "\u201d looks right!";
          v.className = "verdict ok";
          h.textContent = "";
        } else if (okCount >= pads.length - 2) {
          v.textContent = "Almost! One or two letters need care.";
          v.className = "verdict almost";
          h.textContent = allHints.length ? "\u201c" + allHints[0].letter + "\u201d: " + allHints[0].hint : "";
        } else {
          v.textContent = "Try again \u2014 check the guide lines.";
          v.className = "verdict fail";
          h.textContent = allHints.slice(0, 2).map(function (x) {
            return "\u201c" + x.letter + "\u201d: " + x.hint;
          }).join("   ");
        }
      }

      // ---- Clearing / navigation ----
      function clearAll() {
        locked = false;
        passed = false;
        setNextEnabled(false);
        pads.forEach(function (en) {
          en.strokes = [];
          en.ctx.clearRect(0, 0, en.canvas.width, en.canvas.height);
          drawGhost(en);
        });
        $("verdict").textContent = "";
        $("verdict").className = "verdict";
        $("hintLine").textContent = "";
      }
      function next() {
        if (!passed) return;
        if (current < WORDS.length - 1) {
          current++;
          buildWord();
        } else {
          doneAll();
        }
      }
      function doneAll() {
        $("doneMsg").textContent = "You wrote all " + WORDS.length + " words like a star!";
        $("done").classList.add("show");
      }

      $("checkBtn").addEventListener("click", checkWord);
      $("clearBtn").addEventListener("click", clearAll);
      $("nextBtn").addEventListener("click", next);
      $("againBtn").addEventListener("click", function () {
        $("done").classList.remove("show");
        resetGame();
      });

      fetchWords();
    </script>

    <script src="../../tracker.js"></script>
  </body>
</html>
