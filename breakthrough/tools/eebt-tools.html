        height: 2em;
      }
      .miniChip .miniImg.small {
        width: 1em;
        height: 1em;
      }
      .chipsGrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        max-width: 640px;
        margin: 0 auto;
      }
      .chipsGrid .miniChip {
        justify-content: center;
        width: 100%;
      }
      .gameArea {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.2em;
        width: 100%;
      }
      .gameVisual {
        width: min(300px, 60vw);
        height: min(240px, 46vh);
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--panel);
        border-radius: 28px;
        box-shadow: var(--shadow);
        border: 3px solid var(--accent2);
        overflow: hidden;
      }
      .gameVisual img {
        width: 62%;
        height: auto;
        object-fit: contain;
        transition: width 0.25s ease;
      }
      .gameVisual img.big {
        width: 76%;
        height: auto;
      }
      .gameVisual img.small {
        width: 38%;
        height: auto;
      }
      .ynCast {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: clamp(8px, 1.5vw, 20px);
        width: 100%;
      }
      .ynCastMember {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35em;
        flex: 0 0 auto;
        width: clamp(64px, 9vw, 130px);
      }
      .ynAvatar {
        width: clamp(48px, 7vw, 96px);
        height: clamp(48px, 7vw, 96px);
        object-fit: cover;
        border-radius: 50%;
        border: 3px solid var(--accent);
        background: #fff;
        box-shadow: var(--shadow);
      }
      .ynCastMember.onza .ynAvatar {
        border-color: #087443;
      }
      .ynCastMember.owner .ynAvatar {
        box-shadow: 0 0 0 4px var(--mediocre);
      }
      .ynName {
        font-weight: 900;
        font-size: clamp(0.95rem, 1.7vw, 1.3rem);
        color: var(--ink);
      }
      .ynToys {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 5px;
      }
      .ynToys img {
        width: clamp(40px, 4.5vw, 62px);
        height: auto;
        object-fit: contain;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(20, 33, 61, 0.12);
      }
      .gameVisual.ynVisual {
        width: min(260px, 52vw);
        height: min(210px, 40vh);
      }
      .toyEdu {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-end;
        gap: clamp(16px, 2.2vw, 30px);
        width: 100%;
      }
      .toyPair {
        display: flex;
        align-items: flex-end;
        gap: clamp(8px, 1.2vw, 16px);
      }
      .toySizeBtn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5em;
        background: #fff;
        border: 3px solid rgba(96, 112, 141, 0.35);
        border-radius: 18px;
        padding: 0.6em 0.9em;
        cursor: pointer;
        transition: 0.15s transform;
        box-shadow: var(--shadow);
        font-family: inherit;
        font-weight: 800;
        font-size: clamp(0.95rem, 1.6vw, 1.3rem);
        color: var(--ink);
      }
      .toySizeBtn:active {
        transform: scale(0.95);
      }
      .toySizeBtn img {
        width: clamp(52px, 6.5vw, 80px);
        height: auto;
        object-fit: contain;
      }
      .toySizeBtn img.small {
        width: clamp(34px, 4.5vw, 54px);
      }
      .toySizeBtn img.big {
        width: clamp(64px, 8vw, 100px);
      }
      .gameRow {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
        width: 100%;
        max-width: 640px;
      }
      .gameRow .choice {
        min-width: 170px;
      }
      .gameHint {
        font-size: clamp(1rem, 1.8vw, 1.6rem);
        color: var(--muted);
        font-weight: 800;
      }
      .roundPips {
        display: flex;
        gap: 0.5em;
        justify-content: center;
        margin-bottom: clamp(1.4em, 4vh, 2.4em);
      }
      .pip {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #eef1f7;
        box-shadow: inset 0 0 0 2px rgba(20, 33, 61, 0.15);
      }
      .pip.pip-good {
        background: var(--good);
        box-shadow:
          0 0 0 2px #fff,
          inset 0 0 0 2px #0f8a60;
      }
      .pip.pip-med {
        background: var(--mediocre);
        box-shadow:
          0 0 0 2px #fff,
          inset 0 0 0 2px #c07800;
      }
      .pip.pip-bad {
        background: var(--bad);
        box-shadow:
          0 0 0 2px #fff,
          inset 0 0 0 2px #b03a3a;
      }
      .pip.pip-current {
        box-shadow:
          0 0 0 3px var(--accent2),
          inset 0 0 0 2px rgba(20, 33, 61, 0.25);
      }
      @media (max-aspect-ratio: 1/1) {
        .toyGrid {
          --cols: 3;
        }
        .toyBtn .toyName {
          font-size: clamp(0.75rem, 3vw, 1rem);
        }
        .toyImg {
          width: clamp(60px, 18vw, 96px);
          height: clamp(60px, 18vw, 96px);
        }
      }
      .topbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1vh 2vw;
        background: var(--accent);
        z-index: 20;
      }
      .barLeft,
      .barRight {
        display: flex;
        align-items: center;
        gap: 0.6em;
      }
      .versionText {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-family: Verdana, "Trebuchet MS", sans-serif;
        font-size: clamp(0.95rem, 1.6vw, 1.25rem);
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--accent2);
        white-space: nowrap;
      }
      .ctrl {
        height: 1.9rem;
        padding: 0 0.6em;
        border-radius: 999px;
        background: var(--panel);
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
        font-size: 0.95rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        border: 1px solid rgba(96, 112, 141, 0.5);
        transition:
          transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1),
          box-shadow 0.45s cubic-bezier(0.22, 0.61, 0.36, 1),
          background-color 0.45s ease,
          color 0.45s ease;
      }
      @media (hover: hover) {
        .ctrl:hover {
          transform: translateY(-1px);
        }
        .clipcard:hover,
        .miniChip:hover {
          transform: translateY(-1px);
        }
      }
      .navCtrl {
        width: 1.9rem;
        padding: 0;
        background: var(--accent2);
        color: var(--accent);
        border: 2px solid transparent;
      }
      .navCtrl.primary {
        background: var(--accent);
        color: var(--accent2);
      }
      #soundBtn {
        width: 1.5rem;
        height: 1.5rem;
        border: 0;
      }
      #soundBtn.muted {
        background: var(--accent2);
        color: var(--accent);
      }
      #themeBtn {
        width: 1.5rem;
        height: 1.5rem;
        border: 0;
      }
      #themeBtn.dark {
        background: var(--accent2);
        color: var(--accent);
      }
      #toast {
        position: absolute;
        left: 50%;
        top: 12%;
        transform: translateX(-50%);
        z-index: 100;
        background: var(--ink);
        color: white;
        padding: 0.8em 1.5em;
        border-radius: 999px;
        font-size: 1.4rem;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
      }
      #toast.show {
        opacity: 1;
      }
      #inputModal {
        position: absolute;
        inset: 0;
        z-index: 90;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(20, 33, 61, 0.55);
      }
      #inputModal.show {
        display: flex;
      }
      .inputBox {
        width: min(86vw, 560px);
        background: var(--panel);
        border-radius: 24px;
        border: 2pt solid var(--accent2);
        box-shadow: var(--shadow);
        padding: 1.4em;
        display: flex;
        flex-direction: column;
        gap: 1em;
      }
      .inputBox h2 {
        margin: 0;
        font-size: clamp(1.2rem, 2.4vw, 1.8rem);
        text-align: center;
      }
      .inputBox textarea {
        width: 100%;
        min-height: 120px;
        font: inherit;
        font-size: clamp(1.1rem, 2vw, 1.6rem);
        color: var(--ink);
        background: #eef1f7;
        border: 2px solid #c3cbd9;
        border-radius: 14px;
        padding: 0.7em;
        resize: vertical;
      }
      .inputBox textarea:focus-visible {
        outline: 3px solid var(--accent2);
        outline-offset: 2px;
      }
      .inputBtns {
        display: flex;
        justify-content: center;
        gap: 1rem;
      }
      .inputBtns button {
        min-width: 120px;
        min-height: 56px;
        border-radius: 999px;
        font-size: clamp(1.1rem, 2vw, 1.6rem);
        font-weight: 900;
      }
      .inputBtns .okBtn {
        background: var(--accent);
        color: var(--accent2);
      }
      .inputBtns .cancelBtn {
        background: #eef1f7;
        color: var(--ink);
      }
      #reward {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 50;
      }
      .confetti {
        position: absolute;
        font-size: 2rem;
        animation: fall 2.2s linear forwards;
      }
      @keyframes fall {
        0% {
          transform: translateY(-10vh) rotate(0);
          opacity: 1;
        }
        100% {
          transform: translateY(110vh) rotate(720deg);
          opacity: 0;
        }
      }
      .rewardSlots {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: clamp(10px, 1.5vw, 20px);
        margin: 2vh auto;
        padding: 1em;
      }
      .slot {
        width: clamp(58px, 8vw, 110px);
        height: clamp(58px, 8vw, 110px);
        border-radius: 26px;
        background: #eef1f7;
        box-shadow: inset 0 0 0 3px rgba(20, 33, 61, 0.08);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(1.9rem, 4vw, 3.4rem);
        opacity: 0.3;
        transition: opacity 0.3s;
      }
      .slot.filled {
        opacity: 1;
        background: #fff7e0;
        box-shadow:
          0 12px 28px rgba(255, 180, 0, 0.4),
          inset 0 0 0 3px #f1c40f;
        animation: starPop 0.65s cubic-bezier(0.2, 1.6, 0.4, 1);
      }
      .slot.cup {
        font-size: clamp(2.4rem, 5.5vw, 4.2rem);
      }
      .slot.cup.filled {
        background: #fff0d9;
        box-shadow:
          0 16px 34px rgba(255, 150, 0, 0.5),
          inset 0 0 0 3px #ff9800;
      }
      @keyframes starPop {
        0% {
          transform: scale(0) rotate(-40deg);
        }
        60% {
          transform: scale(1.35) rotate(10deg);
        }
        100% {
          transform: scale(1) rotate(0);
        }
      }
      .rewardResult {
        font-size: clamp(1.4rem, 2.6vw, 2.6rem);
        font-weight: 900;
        min-height: 3em;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .rewardResult.good {
        color: var(--good);
      }
      .rewardResult.bad {
        color: var(--bad);
      }
      .rewardVideo {
        max-height: 46vh;
        margin-top: 1em;
      }
      .burst {
        position: absolute;
        font-size: 1.7rem;
        pointer-events: none;
        z-index: 60;
        animation: burstFly 1.1s ease-out forwards;
      }
      @keyframes burstFly {
        0% {
          transform: translate(0, 0) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(var(--bx), var(--by)) scale(0.25);
          opacity: 0;
        }
      }
      @media (max-aspect-ratio: 1/1) {
        .content,
        .stage {
          gap: 1.2em;
        }
        .cast {
          flex-direction: column;
          align-items: center;
          gap: 2vh;
        }
        .character {
          height: 30vh;
          max-width: 60vw;
        }
        .clipcard {
          font-size: clamp(1.2rem, 3.2vw, 1.8rem);
        }
      /* NOTE: Translate-box borders intentionally stay accent2 whether empty or filled
         (removed at user request). To restore the "filled" red border later, re-add:
         .translateBox.filled { border-color: var(--accent); } */
      .translateBox {
          width: min(84vw, 420px);
          min-height: 24vh;
        }
        .mediaWrap img,
        .mediaWrap video {
          max-height: 54vh;
        }
        .grid--4 {
          --cols: 3;
        }
        .grid-tabs {
          --cols: 2;
        }
        .lessonVideo {
          max-height: 42vh;
        }
      }
      :root[data-theme="dark"] {
        --bg: #161a24;
        --ink: #e8ecf4;
        --muted: #93a1b8;
        --panel: #1f2530;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
      }
      :root[data-theme="dark"] .lessonVideo,
      :root[data-theme="dark"] .clip,
      :root[data-theme="dark"] .word-btn,
      :root[data-theme="dark"] .miniChip,
      :root[data-theme="dark"] .slot,
      :root[data-theme="dark"] .toySizeBtn,
      :root[data-theme="dark"] .inputBox textarea,
      :root[data-theme="dark"] .inputBtns .cancelBtn {
        background: #232a36;
      }
      :root[data-theme="dark"] .clip {
        color: var(--accent2);
        border-color: var(--accent2);
      }
      :root[data-theme="dark"] .clip time {
        color: var(--accent2);
        opacity: 0.6;
      }
      :root[data-theme="dark"] .phraseAvatar,
      :root[data-theme="dark"] .phraseToy,
      :root[data-theme="dark"] .toyImg,
      :root[data-theme="dark"] .ynAvatar,
      :root[data-theme="dark"] .ynToys img {
        background: #232a36;
      }
      :root[data-theme="dark"] #toast {
        background: var(--panel);
        color: var(--ink);
      }
      :root[data-theme="dark"] .pip {
        background: #2a3240;
      }
      :root[data-theme="dark"] .clipcard {
        background: #232a36;
        color: var(--ink);
      }
      :root[data-theme="dark"] .topbar {
        background: #232a36;
        border-bottom: 2px solid var(--accent);
      }
      :root[data-theme="dark"] .ctrl.navCtrl.primary {
        background: #2a3240;
        color: var(--accent2);
        border-color: var(--accent);
      }
      :root[data-theme="dark"] #soundBtn,
      :root[data-theme="dark"] #themeBtn {
        border: 2px solid var(--accent);
      }
      :root[data-theme="dark"] .mediaThumbs .thumbClip {
        background: #2a3240;
        border-color: var(--accent);
      }
      :root[data-theme="dark"] .mediaWrap {
        background: #232a36;
      }
      :root[data-theme="dark"] .mediaWrap.empty {
        border: 2px solid var(--accent2);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toast"></div>
      <div id="reward"></div>

      <div id="inputModal">
        <div class="inputBox">
          <h2 id="inputTitle">Type or paste your input</h2>
          <textarea id="inputField" placeholder="Type here or paste from clipboard…"></textarea>
          <div class="inputBtns">
            <button class="cancelBtn" onclick="closeInputModal()">Cancel</button>
            <button class="okBtn" onclick="submitInputModal()">OK</button>
          </div>
        </div>
      </div>

      <div class="topbar">
        <div class="barLeft">
          <button class="ctrl navCtrl primary" id="prevBtn" onclick="prev()"></button>
          <button class="ctrl navCtrl primary" id="soundBtn" aria-label="Sound">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="1.2em"
              height="1.2em"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="vertical-align: -0.2em"
            >
              <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" />
              <path d="M16 9a5 5 0 0 1 0 6" />
              <path d="M19.364 18.364a9 9 0 0 0 0-12.728" />
            </svg>
          </button>
        </div>
        <div class="barRight">
          <button class="ctrl navCtrl primary" id="themeBtn" aria-label="Theme">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="1.2em"
              height="1.2em"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="vertical-align: -0.2em"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="m4.93 4.93 1.41 1.41" />
              <path d="M20 12h2" />
              <path d="m19.07 4.93-1.41 1.41" />
              <path d="M15.947 12.65a4 4 0 0 0-5.925-4.128" />
              <path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z" />
            </svg>
          </button>
          <button
            class="ctrl navCtrl primary"
            id="nextBtn"
            onclick="next()"
          ></button>
        </div>
        <span class="versionText">EEBTools V1.0</span>
      </div>

      <!-- 1: Media clipper (paste Cloudinary asset link) -->
      <section class="screen title-slide active" id="mediaScreen">
        <div class="content">
          <div class="stage">
            <button id="mediaBtn" class="clipcard" onclick="pasteMedia()">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="1.2em"
                height="1.2em"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="vertical-align: -0.2em"
              >
                <rect width="18" height="18" x="3" y="3" rx="2" />
                <path d="M7 3v18" />
                <path d="M3 7.5h4" />
                <path d="M3 12h18" />
                <path d="M3 16.5h4" />
                <path d="M17 3v18" />
                <path d="M17 7.5h4" />
                <path d="M17 16.5h4" />
              </svg>
              Media
            </button>
            <div id="mediaThumbs" class="mediaThumbs"></div>
            <div id="mediaWrap" class="mediaWrap empty">
              <span class="mediaPlaceholder">🎬</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 2: Translator (repeat) -->
      <section class="screen title-slide" id="translatorScreen">
        <div class="content">
          <div class="stage">
            <button
              id="translateBtn"
              class="clipcard"
              onclick="translateClipboard()"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="1.2em"
                height="1.2em"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="vertical-align: -0.2em"
              >
                <path d="m5 8 6 6" />
                <path d="m4 14 6-6 2-3" />
                <path d="M2 5h12" />
                <path d="M7 2h1" />
                <path d="m22 22-5-10-5 10" />
                <path d="M14 18h6" />
              </svg>
              Translate
            </button>
            <div class="panel">
              <div class="cast">
              <figure class="castMember">
                <div class="translateBox left" id="srcLangBox">
                  <span class="translatePlaceholder">ABC</span>
                </div>
                <button class="miniChip voiceChip" onclick="speakTranslate('en')">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="1.2em"
                    height="1.2em"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    style="vertical-align: -0.2em"
                  >
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                  </svg>
                  <span>English</span>
                </button>
              </figure>
              <figure class="castMember">
                <div class="translateBox left" id="zhLangBox">
                  <span class="translatePlaceholder">中文</span>
                </div>
                <button class="miniChip voiceChip" onclick="speakTranslate('zh')">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="1.2em"
                    height="1.2em"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    style="vertical-align: -0.2em"
                  >
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                  </svg>
                  <span>中文</span>
                </button>
              </figure>
              </div>
              <div class="clipList" id="clipList"></div>
              <button
                type="button"
                class="miniChip voiceChip downloadCsvBtn"
                onclick="downloadCsv()"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="1.2em"
                  height="1.2em"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  style="vertical-align: -0.2em"
                >
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                  <polyline points="7 10 12 15 17 10" />
                  <line x1="12" x2="12" y1="15" y2="3" />
                </svg>
                <span>Download CSV</span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      var screens = Array.prototype.slice.call(
        document.querySelectorAll(".screen"),
      );
      var activeIdx = [];
      for (var s = 0; s < screens.length; s++) activeIdx.push(s);
      var lastCounted = screens.length - 1;
      var idx = 0;
      var soundOn = true;
      var mediaHistory = [];
      var activeMediaIdx = -1;
      var synth =
        window.speechSynthesis ||
        window.webkitSpeechSynthesis ||
        window.mozSpeechSynthesis ||
        null;
      var altVoice = null;
      var altVoice2 = null;

      function setVoice() {
        if (!synth) return;
        var voices = synth.getVoices();
        if (!voices || voices.length === 0) return;
        var preferred = null;
        var fallback = null;
        for (var i = 0; i < voices.length; i++) {
          var v = voices[i];
          if (!v || !v.lang) continue;
          if (v.lang.toLowerCase().indexOf("en") !== 0) continue;
          if (!fallback) fallback = v;
          if (v.lang.toLowerCase().indexOf("en-gb") === 0) {
            preferred = v;
            break;
          }
          if (v.name && v.name.indexOf("Zira") >= 0) preferred = v;
        }
        altVoice = preferred || fallback;
        altVoice2 = null;
        for (var j = 0; j < voices.length; j++) {
          var w = voices[j];
          if (!w || !w.lang) continue;
          if (w.lang.toLowerCase().indexOf("en") !== 0) continue;
          if (w === altVoice) continue;
          altVoice2 = w;
          break;
        }
        if (!altVoice2) altVoice2 = altVoice;
      }
      if (synth) {
        setVoice();
        if (typeof synth.addEventListener === "function") {
          synth.addEventListener("voiceschanged", setVoice);
        }
        var voiceTimer = window.setInterval(function () {
          if (altVoice) {
            window.clearInterval(voiceTimer);
          }
          setVoice();
        }, 500);
        window.setTimeout(function () {
          window.clearInterval(voiceTimer);
        }, 4000);
      }

      var ICON_ARROW_LEFT =
        '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 12H8"/><path d="m12 8-4 4 4 4"/></svg>';
      var ICON_ARROW_RIGHT =
        '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="m12 16 4-4-4-4"/></svg>';
      var ICON_VOLUME_ON =
        '<svg xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -0.2em"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>';
      var ICON_VOLUME_OFF =
        '<svg xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -0.2em"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>';
      var ICON_CLIPBOARD_TYPE =
        '<svg xmlns="http://www.w3.org/2000/svg" width="1.1em" height="1.1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12v-1h6v1"/><path d="M11 17h2"/><path d="M12 11v6"/></svg>';

      function show(i) {
        idx = Math.max(0, Math.min(screens.length - 1, i));
        for (var j = 0; j < screens.length; j++) {
          screens[j].classList.toggle("active", j === idx);
        }
        document.getElementById("prevBtn").innerHTML = ICON_ARROW_LEFT;
        document.getElementById("nextBtn").innerHTML = ICON_ARROW_RIGHT;
        document.getElementById("nextBtn").style.visibility = "visible";
        cancelSpeech();
        var activeVideo = screens[idx].querySelector("video") || null;
        if (activeVideo) preloadVideo(activeVideo);
      }

      function preloadVideo(video) {
        if (!video) return;
        try {
          video.preload = "auto";
          video.setAttribute("preload", "auto");
          if (typeof video.load === "function") video.load();
          if (typeof fetch === "function" && video.src.indexOf("http") === 0) {
            fetch(video.src, { cache: "force-cache" }).catch(function () {});
          }
        } catch (e) {}
      }

      function next() {
        if (idx === lastCounted) show(0);
        else {
          var nextActive = activeIdx.indexOf(idx) + 1;
          show(activeIdx[nextActive] === undefined ? 0 : activeIdx[nextActive]);
        }
      }

      function prev() {
        var prevActive = activeIdx.indexOf(idx) - 1;
        show(prevActive < 0 ? lastCounted : activeIdx[prevActive]);
      }

      function cancelSpeech() {
        if (synth && typeof synth.cancel === "function") {
          try {
            synth.cancel();
          } catch (e) {}
        }
      }

      function say(text, voice) {
        if (!soundOn) return;
        if (window.tizen && window.tizen.tts) {
          try {
            tizen.tts.speak(String(text), {
              locale: "en-US",
              rate: 0.85,
              pitch: 1.0,
              type: "TTS_TYPE_SCREEN_READER",
            });
            return;
          } catch (e) {}
        }
        if (synth && typeof SpeechSynthesisUtterance !== "undefined") {
          cancelSpeech();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = "en-US";
          u.rate = 0.82;
          u.pitch = 1.08;
          if (voice) u.voice = voice;
          else if (altVoice) u.voice = altVoice;
          synth.speak(u);
        }
      }

      function sayOther(text) {
        say(text, altVoice2);
      }

      function toast(t) {
        var el = document.getElementById("toast");
        el.textContent = t;
        el.classList.add("show");
        setTimeout(function () {
          el.classList.remove("show");
        }, 1100);
      }

      var inputCallback = null;

      function openInputModal(title, cb) {
        inputCallback = cb || null;
        var t = document.getElementById("inputTitle");
        if (t) t.textContent = title;
        var f = document.getElementById("inputField");
        if (f) {
          f.value = "";
          f.focus();
        }
        document.getElementById("inputModal").classList.add("show");
      }

      function closeInputModal() {
        document.getElementById("inputModal").classList.remove("show");
        inputCallback = null;
      }

      function submitInputModal() {
        var f = document.getElementById("inputField");
        var val = f ? f.value.trim() : "";
        document.getElementById("inputModal").classList.remove("show");
        if (inputCallback) {
          var cb = inputCallback;
          inputCallback = null;
          cb(val);
        }
      }

      function translateClipboard() {
        var run = function (txt) {
          if (txt) doTranslate(txt);
        };
        if (
          navigator.clipboard &&
          typeof navigator.clipboard.readText === "function"
        ) {
          navigator.clipboard
            .readText()
            .then(function (txt) {
              txt = String(txt || "").trim();
              if (!txt) {
                openInputModal(
                  "Clipboard is empty. Type or paste the text to translate:",
                  run,
                );
                return;
              }
              run(txt);
            })
            .catch(function () {
              openInputModal(
                "Clipboard is empty. Type or paste the text to translate:",
                run,
              );
            });
        } else {
          openInputModal(
            "Clipboard is empty. Type or paste the text to translate:",
            run,
          );
        }
      }

      var lastSrcText = "";
      var lastZhText = "";

      function equalizeBoxes() {
        var a = document.getElementById("srcLangBox");
        var b = document.getElementById("zhLangBox");
        if (!a || !b) return;
        a.style.height = "";
        b.style.height = "";
        var h = Math.max(a.scrollHeight, b.scrollHeight);
        a.style.height = h + "px";
        b.style.height = h + "px";
      }

      function cleanEn(text) {
        var s = String(text || "");
        s = s.replace(/```[\s\S]*?```/g, " ");
        s = s.replace(/!\[([^\]]*)\]\([^)]*\)/g, "$1");
        s = s.replace(/\[([^\]]*)\]\([^)]*\)/g, "$1");
        s = s.replace(/`([^`]*)`/g, "$1");
        s = s.replace(/^\s*#{1,6}\s+/gm, "");
        s = s.replace(/^\s*>\s?/gm, "");
        s = s.replace(/^\s*([-*+])\s+/gm, "");
        s = s.replace(/~~([^~]+)~~/g, "$1");
        s = s.replace(/(\*\*|__)(.*?)\1/g, "$2");
        s = s.replace(/(\*|_)(.*?)\1/g, "$2");
        s = s.replace(/[*_#>`~]{1,}/g, "");
        s = s.replace(/\s+/g, " ");
        s = s.trim();
        if (s) s = s.charAt(0).toUpperCase() + s.slice(1);
        return s;
      }

      function doTranslate(text) {
        text = cleanEn(text);
        lastSrcText = text;
        var srcBox = document.getElementById("srcLangBox");
        var zhBox = document.getElementById("zhLangBox");
        if (srcBox) {
          srcBox.textContent = text;
          srcBox.classList.add("filled");
        }
        if (zhBox) {
          zhBox.textContent = "…";
          zhBox.classList.add("filled");
        }
        equalizeBoxes();
        var url =
          "https://translate.googleapis.com/translate_a/single" +
          "?client=gtx&sl=auto&tl=zh-CN&dt=t&q=" +
          encodeURIComponent(text);
        if (typeof fetch !== "function") {
          if (zhBox) zhBox.textContent = "Translation failed";
          equalizeBoxes();
          return;
        }
        fetch(url)
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            var translated = "";
            try {
              var segs = data[0];
              for (var i = 0; i < segs.length; i++) {
                translated += segs[i][0] || "";
              }
            } catch (e) {}
            if (!translated) translated = text;
            lastZhText = translated;
            if (zhBox) zhBox.textContent = translated;
            equalizeBoxes();
            addClip(text, translated);
          })
          .catch(function () {
            if (zhBox) zhBox.textContent = "Translation failed";
            equalizeBoxes();
          });
      }

      function speakTranslate(lang) {
        if (lang === "zh") speakChinese(lastZhText);
        else say(lastSrcText);
      }

      var clipList = document.getElementById("clipList");
      var lastClipKey = "";
      var clipHistory = [];

      function addClip(en, zh) {
        if (!clipList) return;
        var key = en + "|" + zh;
        if (key === lastClipKey) return;
        lastClipKey = key;
        var now = new Date();
        var time = now.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
        clipHistory.push({ time: time, en: en, zh: zh });
        var words = String(en).trim().split(/\s+/);
        var preview = words.slice(0, 6).join(" ");
        if (preview.length > 60) preview = preview.slice(0, 60) + "…";
        var b = document.createElement("button");
        b.className = "clip";
        b.type = "button";
        b.innerHTML = ICON_CLIPBOARD_TYPE;
        var tm = document.createElement("time");
        tm.textContent = time;
        var txt = document.createElement("span");
        txt.className = "clipText";
        txt.textContent = preview;
        b.appendChild(tm);
        b.appendChild(txt);
        b.onclick = function () {
          restoreClip(en, zh);
        };
        clipList.insertBefore(b, clipList.firstChild);
      }

      function csvCell(v) {
        v = String(v == null ? "" : v);
        return '"' + v.replace(/"/g, '""') + '"';
      }

      function downloadCsv() {
        if (!clipHistory.length) return;
        var rows = [];
        rows.push(
          [csvCell("time"), csvCell("english"), csvCell("chinese")].join(","),
        );
        for (var i = 0; i < clipHistory.length; i++) {
          var c = clipHistory[i];
          rows.push(
            [csvCell(c.time), csvCell(c.en), csvCell(c.zh)].join(","),
          );
        }
        var csv = "\uFEFF" + rows.join("\r\n");
        var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        var now = new Date();
        var dt = now.getFullYear().toString() +
          String(now.getMonth() + 1).padStart(2, "0") +
          String(now.getDate()).padStart(2, "0") + "_" +
          String(now.getHours()).padStart(2, "0") +
          String(now.getMinutes()).padStart(2, "0") +
          String(now.getSeconds()).padStart(2, "0");
        a.download = "vocasofdate_" + dt + ".csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
      }

      function restoreClip(en, zh) {
        en = cleanEn(en);
        lastSrcText = en;
        lastZhText = zh;
        var srcBox = document.getElementById("srcLangBox");
        var zhBox = document.getElementById("zhLangBox");
        if (srcBox) {
          srcBox.textContent = en;
          srcBox.classList.add("filled");
        }
        if (zhBox) {
          zhBox.textContent = zh;
          zhBox.classList.add("filled");
        }
        equalizeBoxes();
      }

      function extractUrl(text) {
        var m = String(text).match(/https?:\/\/[^\s"<>]+/);
        return m ? m[0] : null;
      }

      function pasteMedia() {
        var run = function (u) {
          if (u) injectMedia(u);
        };
        if (
          navigator.clipboard &&
          typeof navigator.clipboard.readText === "function"
        ) {
          navigator.clipboard
            .readText()
            .then(function (txt) {
              var u = extractUrl(String(txt || ""));
              if (!u) {
                openInputModal(
                  "Clipboard is empty. Type or paste the Cloudinary asset link:",
                  function (v) {
                    run(extractUrl(v));
                  },
                );
                return;
              }
              run(u);
            })
            .catch(function () {
              openInputModal(
                "Clipboard is empty. Type or paste the Cloudinary asset link:",
                function (v) {
                  run(extractUrl(v));
                },
              );
            });
        } else {
          openInputModal(
            "Clipboard is empty. Type or paste the Cloudinary asset link:",
            function (v) {
              run(extractUrl(v));
            },
          );
        }
      }

      function detectMediaType(url) {
        var lower = url.toLowerCase();
        if (
          /\/video\//.test(lower) ||
          /\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/.test(lower)
        )
          return "video";
        if (
          /\/audio\//.test(lower) ||
          /\.(mp3|wav|ogg|m4a|aac)(\?|#|$)/.test(lower)
        )
          return "audio";
        return "image";
      }

      function injectMedia(url) {
        for (var i = 0; i < mediaHistory.length; i++) {
          if (mediaHistory[i].url === url) {
            activeMediaIdx = i;
            renderMedia();
            renderMediaThumbs();
            toast("Already in session");
            return;
          }
        }
        var type = detectMediaType(url);
        mediaHistory.push({ url: url, type: type });
        activeMediaIdx = mediaHistory.length - 1;
        renderMedia();
        renderMediaThumbs();
        if (type === "audio") {
          requestArtwork();
        }
      }

      function renderMedia() {
        var wrap = document.getElementById("mediaWrap");
        if (!wrap) return;
        wrap.innerHTML = "";
        wrap.classList.remove("withArt");
        if (activeMediaIdx < 0 || !mediaHistory[activeMediaIdx]) {
          wrap.classList.add("empty");
          var ph = document.createElement("span");
          ph.className = "mediaPlaceholder";
          ph.textContent = "🎬";
          ph.style.cursor = "pointer";
          ph.addEventListener("click", function () {
            pasteMedia();
          });
          wrap.appendChild(ph);
          return;
        }
        wrap.classList.remove("empty");
        var entry = mediaHistory[activeMediaIdx];
        var el;
        if (entry.type === "video") {
          el = document.createElement("video");
          el.controls = true;
          el.preload = "auto";
          el.muted = false;
          el.playsInline = true;
          el.setAttribute("playsinline", "true");
          el.setAttribute("webkit-playsinline", "true");
          el.src = entry.url;
          el.style.cursor = "pointer";
          el.addEventListener("click", function (e) {
            if (e.target !== el) return;
            shrinkMedia();
          });
        } else if (entry.type === "audio") {
          el = document.createElement("audio");
          el.controls = true;
          el.preload = "auto";
          el.src = entry.url;
        } else {
          el = document.createElement("img");
          el.src = entry.url;
          el.alt = "media";
          el.style.cursor = "pointer";
          el.addEventListener("click", function () {
            shrinkMedia();
          });
        }
        wrap.appendChild(el);
        renderMediaThumbs();
      }

      var dragFromIdx = -1;
      var dragOverIdx = -1;

      function removeMedia(idx) {
        if (idx < 0 || idx >= mediaHistory.length) return;
        pauseActiveMedia();
        mediaHistory.splice(idx, 1);
        if (activeMediaIdx === idx) {
          activeMediaIdx = -1;
        } else if (activeMediaIdx > idx) {
          activeMediaIdx--;
        }
        renderMedia();
        renderMediaThumbs();
        toast("Removed");
      }

      function swapMedia(fromIdx, toIdx) {
        if (fromIdx === toIdx) return;
        if (fromIdx < 0 || fromIdx >= mediaHistory.length) return;
        if (toIdx < 0 || toIdx >= mediaHistory.length) return;
        var item = mediaHistory.splice(fromIdx, 1)[0];
        mediaHistory.splice(toIdx, 0, item);
        if (activeMediaIdx === fromIdx) {
          activeMediaIdx = toIdx;
        } else if (
          activeMediaIdx >= Math.min(fromIdx, toIdx) &&
          activeMediaIdx <= Math.max(fromIdx, toIdx)
        ) {
          activeMediaIdx += fromIdx < toIdx ? -1 : 1;
        }
        renderMediaThumbs();
      }

      function renderMediaThumbs() {
        var container = document.getElementById("mediaThumbs");
        if (!container) return;
        container.innerHTML = "";

        if (activeMediaIdx >= 0) {
          container.classList.remove("hasItems");
          return;
        }
        container.classList.add("hasItems");

        for (var i = 0; i < mediaHistory.length; i++) {
          (function (idx) {
            var entry = mediaHistory[idx];
            var btn = document.createElement("button");
            btn.className = "thumb";
            btn.type = "button";
            btn.draggable = true;

            var clip = document.createElement("div");
            clip.className = "thumbClip";
            if (entry.type === "image") {
              var img = document.createElement("img");
              img.src = entry.url;
              img.alt = "thumb";
              img.loading = "lazy";
              clip.appendChild(img);
            } else if (entry.type === "video") {
              var vid = document.createElement("video");
              vid.muted = true;
              vid.preload = "metadata";
              vid.src = entry.url;
              clip.appendChild(vid);
            } else {
              clip.textContent = "🎵";
            }
            btn.appendChild(clip);

            var closeBtn = document.createElement("button");
            closeBtn.className = "thumbClose";
            closeBtn.type = "button";
            closeBtn.innerHTML = "×";
            closeBtn.addEventListener("click", function (e) {
              e.stopPropagation();
              e.preventDefault();
              removeMedia(idx);
            });
            btn.appendChild(closeBtn);

            var didDrag = false;
            var touchStartPos = null;

            btn.addEventListener("dragstart", function (e) {
              dragFromIdx = idx;
              btn.classList.add("dragging");
              e.dataTransfer.effectAllowed = "move";
              e.dataTransfer.setData("text/plain", String(idx));
            });
            btn.addEventListener("dragend", function () {
              btn.classList.remove("dragging");
              dragFromIdx = -1;
              var overs = container.querySelectorAll(".dragOver");
              for (var k = 0; k < overs.length; k++) overs[k].classList.remove("dragOver");
            });
            btn.addEventListener("dragover", function (e) {
              e.preventDefault();
              e.dataTransfer.dropEffect = "move";
              btn.classList.add("dragOver");
            });
            btn.addEventListener("dragleave", function () {
              btn.classList.remove("dragOver");
            });
            btn.addEventListener("drop", function (e) {
              e.preventDefault();
              btn.classList.remove("dragOver");
              if (dragFromIdx >= 0 && dragFromIdx !== idx) {
                swapMedia(dragFromIdx, idx);
              }
              dragFromIdx = -1;
            });

            btn.addEventListener("touchstart", function (e) {
              var t = e.touches[0];
              if (t) touchStartPos = { x: t.clientX, y: t.clientY };
              dragFromIdx = idx;
              didDrag = false;
            }, { passive: true });
            btn.addEventListener("touchmove", function (e) {
              if (dragFromIdx < 0) return;
              e.preventDefault();
              var t = e.touches[0];
              if (!t) return;
              if (touchStartPos) {
                var dx = Math.abs(t.clientX - touchStartPos.x);
                var dy = Math.abs(t.clientY - touchStartPos.y);
                if (dx > 10 || dy > 10) didDrag = true;
              }
              var el = document.elementFromPoint(t.clientX, t.clientY);
              var over = el ? el.closest(".thumb") : null;
              var overs = container.querySelectorAll(".dragOver");
              for (var k = 0; k < overs.length; k++) overs[k].classList.remove("dragOver");
              if (over && over !== btn) {
                over.classList.add("dragOver");
                dragOverIdx = Array.prototype.indexOf.call(container.children, over);
              } else {
                dragOverIdx = -1;
              }
            }, { passive: false });
            btn.addEventListener("touchend", function () {
              if (dragFromIdx >= 0 && dragOverIdx >= 0 && dragFromIdx !== dragOverIdx) {
                swapMedia(dragFromIdx, dragOverIdx);
              }
              dragFromIdx = -1;
              dragOverIdx = -1;
              touchStartPos = null;
              var overs = container.querySelectorAll(".dragOver");
              for (var k = 0; k < overs.length; k++) overs[k].classList.remove("dragOver");
            });

            btn.addEventListener("click", function (e) {
              if (didDrag) {
                didDrag = false;
                e.preventDefault();
                return;
              }
              selectMedia(idx);
            });

            container.appendChild(btn);
          })(i);
        }

        if (mediaHistory.length > 0) {
          var dlBtn = document.createElement("button");
          dlBtn.className = "thumb";
          dlBtn.type = "button";
          dlBtn.style.color = "var(--muted)";
          dlBtn.style.fontSize = "1.2em";
          var dlClip = document.createElement("div");
          dlClip.className = "thumbClip";
          dlClip.innerHTML =
            '<svg xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>';
          dlBtn.appendChild(dlClip);
          dlBtn.addEventListener("click", function () {
            downloadMediaUrls();
          });
          container.appendChild(dlBtn);
        }
      }

      function downloadMediaUrls() {
        if (!mediaHistory.length) {
          toast("No media to download");
          return;
        }
        var lines = [];
        for (var i = 0; i < mediaHistory.length; i++) {
          lines.push(mediaHistory[i].url);
        }
        var content = lines.join("\r\n");
        var blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        var now = new Date();
        var dt =
          now.getFullYear().toString() +
          String(now.getMonth() + 1).padStart(2, "0") +
          String(now.getDate()).padStart(2, "0") +
          "_" +
          String(now.getHours()).padStart(2, "0") +
          String(now.getMinutes()).padStart(2, "0") +
          String(now.getSeconds()).padStart(2, "0");
        a.download = "media_session_" + dt + ".txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
        toast("Downloaded " + mediaHistory.length + " URL(s)");
      }

      function selectMedia(idx) {
        if (idx === activeMediaIdx) return;
        pauseActiveMedia();
        activeMediaIdx = idx;
        renderMedia();
        renderMediaThumbs();
      }

      function shrinkMedia() {
        pauseActiveMedia();
        activeMediaIdx = -1;
        renderMedia();
        renderMediaThumbs();
      }

      function pauseActiveMedia() {
        var wrap = document.getElementById("mediaWrap");
        if (!wrap) return;
        var vid = wrap.querySelector("video");
        if (vid) {
          try {
            vid.pause();
          } catch (e) {}
        }
        var aud = wrap.querySelector("audio");
        if (aud) {
          try {
            aud.pause();
          } catch (e) {}
        }
      }

      function requestArtwork() {
        openInputModal(
          "Audio added. Type or paste an image link to show with the audio:",
          function (v) {
            var u = extractUrl(String(v || ""));
            if (!u) return;
            var wrap = document.getElementById("mediaWrap");
            if (!wrap) return;
            var img = document.createElement("img");
            img.src = u;
            img.alt = "artwork";
            img.loading = "lazy";
            wrap.insertBefore(img, wrap.firstChild);
            wrap.classList.add("withArt");
          },
        );
      }

      function speakChinese(text) {
        if (!soundOn) return;
        if (window.tizen && window.tizen.tts) {
          try {
            tizen.tts.speak(String(text), {
              locale: "zh-CN",
              rate: 0.85,
              pitch: 1.0,
              type: "TTS_TYPE_SCREEN_READER",
            });
            return;
          } catch (e) {}
        }
        if (synth && typeof SpeechSynthesisUtterance !== "undefined") {
          cancelSpeech();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = "zh-CN";
          u.rate = 0.9;
          u.pitch = 1.0;
          var voices = synth.getVoices();
          for (var i = 0; i < voices.length; i++) {
            var v = voices[i];
            if (v && v.lang && v.lang.toLowerCase().indexOf("zh") === 0) {
              u.voice = v;
              break;
            }
          }
          synth.speak(u);
        }
      }

      document.getElementById("soundBtn").onclick = function () {
        soundOn = !soundOn;
        var sb = document.getElementById("soundBtn");
        sb.innerHTML = soundOn ? ICON_VOLUME_ON : ICON_VOLUME_OFF;
        sb.classList.toggle("muted", !soundOn);
        if (soundOn) {
          if (synth) synth.cancel();
        }
        cancelSpeech();
      };
      var themeBtn = document.getElementById("themeBtn");
      var themeDark = false;
      function applyTheme(dark) {
        themeDark = dark;
        if (themeBtn) themeBtn.classList.toggle("dark", dark);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      }
      try {
        var storedTheme = localStorage.getItem("eebt-theme");
        if (storedTheme === "dark") applyTheme(true);
        else if (storedTheme === "light") applyTheme(false);
        else if (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          applyTheme(true);
        }
      } catch (e) {}
      if (themeBtn) {
        themeBtn.onclick = function () {
          applyTheme(!themeDark);
          try {
            localStorage.setItem("eebt-theme", themeDark ? "dark" : "light");
          } catch (e) {}
        };
      }
      document.addEventListener("keydown", function (e) {
        var k = e.key || "";
        var kc = e.keyCode || e.which || 0;
        if (document.getElementById("inputModal").classList.contains("show")) {
          if (k === "Escape" || kc === 27 || kc === 10009) {
            closeInputModal();
            return;
          }
          if (kc === 13 || kc === 29443 || k === "Enter") {
            submitInputModal();
            return;
          }
          return;
        }
        if (k === "ArrowRight" || kc === 39 || k === " " || kc === 32) {
          if (e.preventDefault) e.preventDefault();
          next();
        } else if (k === "ArrowLeft" || kc === 37) {
          prev();
        } else if (k === "Escape" || kc === 27 || kc === 10009) {
          show(0);
        } else if (kc === 13 || kc === 29443 || k === "Enter") {
          var el = document.activeElement;
          if (el && el.tagName === "BUTTON" && !el.disabled) el.click();
        }
      });
      var touchStart = null;
      var appEl = document.getElementById("app");
      if (appEl && "ontouchstart" in window) {
        appEl.addEventListener(
          "touchstart",
          function (e) {
            var t = e.touches && e.touches[0];
            if (!t) return;
            touchStart = { x: t.clientX, y: t.clientY, t: Date.now() };
          },
          { passive: true },
        );
        appEl.addEventListener(
          "touchend",
          function (e) {
            if (!touchStart) return;
            var t = e.changedTouches && e.changedTouches[0];
            if (!t) return;
            var dx = t.clientX - touchStart.x;
            var dy = t.clientY - touchStart.y;
            var dt = Date.now() - touchStart.t;
            touchStart = null;
            if (dt > 900) return;
            if (Math.abs(dx) < 40 && Math.abs(dy) < 40) return;
            if (Math.abs(dx) > Math.abs(dy)) {
              if (dx < 0) next();
              else prev();
            }
          },
          { passive: true },
        );
      }
      window.addEventListener("resize", function () {
        if (lastSrcText) equalizeBoxes();
      });
      show(0);
      renderMediaThumbs();
    </script>
  </body>
</html>
