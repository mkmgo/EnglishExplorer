      function downloadMediaUrls() {
        if (!mediaHistory.length) {
          toast("No media to download");
          return;
        }
        var uncollected = [];
        var collections = {};
        var collectionOrder = [];
        for (var i = 0; i < mediaHistory.length; i++) {
          var item = mediaHistory[i];
          var serialized;
          if (item.type === "text") {
            serialized = "#Text:" + (item.text || "") + "@" + (item.x || 50) + "," + (item.y || 40) + "|" + (item.size || "m");
          } else {
            serialized = item.url;
          }
          if (!item.collection) {
            uncollected.push(serialized);
          } else {
            if (!collections[item.collection]) {
              collections[item.collection] = [];
              collectionOrder.push(item.collection);
            }
            collections[item.collection].push(serialized);
          }
        }
        var lines = [];
        for (var u = 0; u < uncollected.length; u++) {
          lines.push(uncollected[u]);
        }
        for (var c = 0; c < collectionOrder.length; c++) {
          lines.push("#Collection: " + collectionOrder[c]);
          var items = collections[collectionOrder[c]];
          for (var j = 0; j < items.length; j++) {
            lines.push(items[j]);
          }
        }
        var content = lines.join("\r\n");
        var blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        var now = new Date();
        var dt =
          now.getFullYear().toString() +
          String(now.getMonth() + 1).padStart(2, "0") +
          String(now.getDate()).padStart(2, "0") +
          "_" +
          String(now.getHours()).padStart(2, "0") +
          String(now.getMinutes()).padStart(2, "0") +
          String(now.getSeconds()).padStart(2, "0");
        a.download = "media_session_" + dt + ".txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
        toast("Downloaded " + mediaHistory.length + " URL(s)");
      }

      function loadMediaUrls(input) {
        var file = input.files && input.files[0];
        input.value = "";
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          var lines = String(reader.result || "").split(/\r\n|\n|\r/);
          var count = 0;
          var currentCollection = null;
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) continue;
            if (line.indexOf("#Collection: ") === 0) {
              currentCollection = line.substring("#Collection: ".length).trim() || null;
              continue;
            }
            if (line.indexOf("#Text:") === 0) {
              var tPart = line.substring(6);
              var tAt = tPart.indexOf("@");
              var tText = tAt >= 0 ? tPart.substring(0, tAt) : tPart;
              var tX = 50, tY = 40, tSize = "m";
              if (tAt >= 0) {
                var tRest = tPart.substring(tAt + 1);
                var tPipe = tRest.indexOf("|");
                var tPos = tPipe >= 0 ? tRest.substring(0, tPipe) : tRest;
                var tParts = tPos.split(",");
                if (tParts.length >= 2) { tX = parseFloat(tParts[0]) || 50; tY = parseFloat(tParts[1]) || 40; }
                if (tPipe >= 0) tSize = tRest.substring(tPipe + 1).trim() || "m";
              }
              textLabelIdCounter++;
              mediaHistory.push({
                type: "text", id: textLabelIdCounter, text: tText,
                x: Math.max(5, Math.min(95, tX)), y: Math.max(5, Math.min(95, tY)),
                size: tSize, url: null, collection: currentCollection
              });
              count++;
              continue;
            }
            var u = extractUrl(line);
            if (!u) continue;
            var dup = false;
            for (var j = 0; j < mediaHistory.length; j++) {
              if (mediaHistory[j].url === u) {
                dup = true;
                break;
              }
            }
            if (dup) continue;
            mediaHistory.push({ url: u, type: detectMediaType(u), collection: currentCollection });
            count++;
          }
          renderMediaThumbs();
          toast(count ? "Loaded " + count + " URL(s)" : "No URLs found");
        };
        reader.readAsText(file);
      }

      function selectMedia(idx) {
        if (idx === activeMediaIdx) return;
        pauseActiveMedia();
        activeMediaIdx = idx;
        var col = mediaHistory[idx] ? mediaHistory[idx].collection : null;
        viewingCollection = col || null;
        renderMedia();
        renderMediaThumbs();
      }

      function shrinkMedia() {
        pauseActiveMedia();
        activeMediaIdx = -1;
        viewingCollection = null;
        renderMedia();
        renderMediaThumbs();
      }

      var textLabelIdCounter = 0;
      var selectedTextLabelId = -1;

      function findBackgroundImage(idx) {
        for (var i = idx - 1; i >= 0; i--) {
          if (mediaHistory[i] && mediaHistory[i].type === "image") return mediaHistory[i];
        }
        return null;
      }

      function addTextItem(text) {
        textLabelIdCounter++;
        var item = {
          type: "text",
          id: textLabelIdCounter,
          text: text || "TEXT",
          x: 50,
          y: 40,
          size: "m",
          url: null,
          collection: null
        };
        mediaHistory.push(item);
        activeMediaIdx = mediaHistory.length - 1;
        selectedTextLabelId = -1;
        renderMedia();
        renderMediaThumbs();
      }

      function updateTextItem(idx, props) {
        if (idx < 0 || idx >= mediaHistory.length) return;
        var item = mediaHistory[idx];
        if (item.type !== "text") return;
        for (var k in props) {
          if (props.hasOwnProperty(k)) item[k] = props[k];
        }
      }

      function renderTextOverlay(container, bgImg, textEntry, isOverlay) {
        var wrap;
        if (!container.classList.contains("mediaWrap") && !container.classList.contains("ovContent")) {
          wrap = container;
        } else {
          wrap = container;
        }
        var layer = document.createElement("div");
        layer.className = "textLabelLayer";

        var lbl = document.createElement("div");
        lbl.className = "textLabel sz-" + (textEntry.size || "m");
        lbl.setAttribute("data-label-id", String(textEntry.id || 0));
        lbl.style.left = (textEntry.x || 50) + "%";
        lbl.style.top = (textEntry.y || 40) + "%";
        lbl.textContent = textEntry.text || "";

        var xBtn = document.createElement("button");
        xBtn.className = "labelX";
        xBtn.innerHTML = "\u00D7";
        xBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          e.preventDefault();
          var cId = textEntry.id;
          for (var i = 0; i < mediaHistory.length; i++) {
            if (mediaHistory[i].type === "text" && mediaHistory[i].id === cId) {
              mediaHistory.splice(i, 1);
              if (activeMediaIdx === i) activeMediaIdx = -1;
              else if (activeMediaIdx > i) activeMediaIdx--;
              selectedTextLabelId = -1;
              renderMedia();
              renderMediaThumbs();
              break;
            }
          }
        });
        lbl.appendChild(xBtn);

        lbl.addEventListener("click", function (e) {
          e.stopPropagation();
          selectTextLabel(textEntry.id);
        });
        lbl.addEventListener("dblclick", function (e) {
          e.stopPropagation();
          e.preventDefault();
          editTextLabel(textEntry.id);
        });
        setupLabelDrag(lbl, textEntry, wrap);

        layer.appendChild(lbl);
        wrap.appendChild(layer);

        if (selectedTextLabelId === textEntry.id) {
          lbl.classList.add("selected");
          var bar = document.createElement("div");
          bar.className = "textSizeBar show";
          bar.style.left = (textEntry.x || 50) + "%";
          bar.style.top = "calc(" + (textEntry.y || 40) + "% + " + (lbl.offsetHeight || 30) + "px + 6px)";
          ["s", "m", "b"].forEach(function (sz) {
            var chip = document.createElement("button");
            chip.className = "szChip" + (textEntry.size === sz ? " active" : "");
            chip.textContent = sz.toUpperCase();
            chip.addEventListener("click", function (e) {
              e.stopPropagation();
              updateTextItem(activeMediaIdx, { size: sz });
              selectedTextLabelId = textEntry.id;
              renderMedia();
            });
            bar.appendChild(chip);
          });
          wrap.appendChild(bar);
        }
      }

      function selectTextLabel(labelId) {
        selectedTextLabelId = selectedTextLabelId === labelId ? -1 : labelId;
        renderMedia();
      }

      function editTextLabel(labelId) {
        var item = null;
        for (var i = 0; i < mediaHistory.length; i++) {
          if (mediaHistory[i].type === "text" && mediaHistory[i].id === labelId) {
            item = mediaHistory[i];
            break;
          }
        }
        if (!item) return;
        openInputModal("Edit label text:", function (val) {
          if (!val) return;
          updateTextItem(activeMediaIdx, { text: val });
          renderMedia();
        });
        var field = document.getElementById("inputField");
        if (field) {
          field.value = item.text || "";
          field.select();
        }
      }

      function setupLabelDrag(lbl, textEntry, container) {
        var isDragging = false;
        var startPointerX = 0;
        var startPointerY = 0;
        var origX = 0;
        var origY = 0;

        function onPointerDown(e) {
          if (e.target.classList.contains("labelX")) return;
          if (e.pointerType === "mouse" && e.button !== 0) return;
          isDragging = false;
          startPointerX = e.clientX;
          startPointerY = e.clientY;
          origX = textEntry.x || 50;
          origY = textEntry.y || 40;
          lbl.setPointerCapture(e.pointerId);
          lbl.addEventListener("pointermove", onPointerMove);
          lbl.addEventListener("pointerup", onPointerUp);
          lbl.addEventListener("pointercancel", onPointerUp);
          e.preventDefault();
        }

        function onPointerMove(e) {
          var rect = container.getBoundingClientRect();
          if (!rect.width || !rect.height) return;
          var dx = e.clientX - startPointerX;
          var dy = e.clientY - startPointerY;
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDragging = true;
          if (!isDragging) return;
          lbl.classList.add("dragging");
          var dxPct = (dx / rect.width) * 100;
          var dyPct = (dy / rect.height) * 100;
          var nx = Math.max(5, Math.min(95, origX + dxPct));
          var ny = Math.max(5, Math.min(95, origY + dyPct));
          textEntry.x = nx;
          textEntry.y = ny;
          lbl.style.left = nx + "%";
          lbl.style.top = ny + "%";
          var sizeBar = container.querySelector(".textSizeBar");
          if (sizeBar) {
            sizeBar.style.left = nx + "%";
            sizeBar.style.top = "calc(" + ny + "% + " + (lbl.offsetHeight || 30) + "px + 6px)";
          }
        }

        function onPointerUp(e) {
          lbl.removeEventListener("pointermove", onPointerMove);
          lbl.removeEventListener("pointerup", onPointerUp);
          lbl.removeEventListener("pointercancel", onPointerUp);
          lbl.classList.remove("dragging");
          if (isDragging) {
            e.stopPropagation();
            e.preventDefault();
          }
          isDragging = false;
        }

        lbl.addEventListener("pointerdown", onPointerDown);
      }

      function renderLabels(wrap, entry, isOverlay) {
        if (!entry || entry.type !== "text") return;
        var bgImg = findBackgroundImage(activeMediaIdx);
        if (bgImg) {
          var imgFrame = document.createElement("div");
          imgFrame.style.cssText = "position:relative;display:inline-block;width:100%;line-height:0;";
          var img = document.createElement("img");
          img.src = bgImg.url;
          img.alt = "background";
          img.style.cssText = "width:100%;display:block;border-radius:20px;";
          imgFrame.appendChild(img);
          renderTextOverlay(imgFrame, bgImg, entry, isOverlay);
          wrap.insertBefore(imgFrame, wrap.firstChild);
        } else {
          var ph = document.createElement("div");
          ph.style.cssText = "text-align:center;color:var(--muted);font-size:clamp(1rem,1.8vw,1.5rem);padding:2em 1em;";
          ph.textContent = "Add an image before this label to use it as an overlay.";
          wrap.appendChild(ph);
          renderTextOverlay(wrap, null, entry, isOverlay);
        }
        var addBtn = document.createElement("button");
        addBtn.className = "addTextBtn";
        addBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1.1em" height="1.1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg> Add Text';
        addBtn.addEventListener("click", function () {
          openInputModal("Enter label text:", function (val) {
            if (!val) return;
            textLabelIdCounter++;
            var newItem = {
              type: "text", id: textLabelIdCounter, text: val, x: 50, y: 40, size: "m",
              url: null, collection: entry.collection || null
            };
            var insertIdx = activeMediaIdx + 1;
            mediaHistory.splice(insertIdx, 0, newItem);
            activeMediaIdx = insertIdx;
            selectedTextLabelId = -1;
            renderMedia();
            renderMediaThumbs();
          });
        });
        wrap.appendChild(addBtn);
      }

      function openMediaOverlay(mediaUrl) {
        var wrap = document.getElementById("mediaWrap");
        var ov = document.getElementById("mediaOverlay");
        var ovContent = document.getElementById("ovContent");
        if (!wrap || !ov || !ovContent) return;
        ovContent.innerHTML = "";

        if (!mediaUrl && activeMediaIdx >= 0 && mediaHistory[activeMediaIdx] && mediaHistory[activeMediaIdx].type === "text") {
          var textEntry = mediaHistory[activeMediaIdx];
          var bgImg = findBackgroundImage(activeMediaIdx);
          var imgFrame = document.createElement("div");
          imgFrame.style.cssText = "position:relative;display:inline-block;max-width:94vw;max-height:88vh;line-height:0;";
          if (bgImg) {
            var bgEl = document.createElement("img");
            bgEl.src = bgImg.url;
            bgEl.alt = "background";
            bgEl.style.cssText = "max-width:94vw;max-height:88vh;object-fit:contain;border-radius:12px;display:block;";
            imgFrame.appendChild(bgEl);
          }
          renderTextOverlay(imgFrame, bgImg, textEntry, true);
          ovContent.style.position = "relative";
          ovContent.style.display = "flex";
          ovContent.style.alignItems = "center";
          ovContent.style.justifyContent = "center";
          ovContent.appendChild(imgFrame);
          ov.classList.add("show");
          return;
        }

        var url = mediaUrl;
        var type = "image";
        if (!url) {
          var el = wrap.querySelector("img, video, audio");
          if (!el) return;
          url = el.src;
          if (el.tagName === "VIDEO") type = "video";
          else if (el.tagName === "AUDIO") type = "audio";
          else type = "image";
        } else {
          if (/\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(url) || /\/video\//i.test(url)) type = "video";
          else if (/\.(mp3|wav|ogg|m4a|aac)(\?|#|$)/i.test(url) || /\/audio\//i.test(url)) type = "audio";
        }
        if (type === "image") {
          var img = document.createElement("img");
          img.src = url;
          img.alt = "media";
          ovContent.appendChild(img);
        } else if (type === "video") {
          var vid = document.createElement("video");
          vid.controls = true;
          vid.preload = "auto";
          vid.src = url;
          ovContent.appendChild(vid);
        } else if (type === "audio") {
          if (!mediaUrl) {
            var artImg = wrap.querySelector("img");
            if (artImg) {
              var art = document.createElement("img");
              art.src = artImg.src;
              art.alt = "artwork";
              ovContent.appendChild(art);
            }
          }
          var aud = document.createElement("audio");
          aud.controls = true;
          aud.preload = "auto";
          aud.src = url;
          ovContent.appendChild(aud);
        }
        ov.classList.add("show");
      }

      function closeMediaOverlay() {
        var ov = document.getElementById("mediaOverlay");
        var ovContent = document.getElementById("ovContent");
        if (ov) ov.classList.remove("show");
        if (ovContent) {
          ovContent.innerHTML = "";
          ovContent.style.position = "";
          ovContent.style.display = "";
          ovContent.style.alignItems = "";
          ovContent.style.justifyContent = "";
        }
        if (activeMediaIdx >= 0 && mediaHistory[activeMediaIdx] && mediaHistory[activeMediaIdx].type === "text") {
          renderMedia();
        }
      }

      function pauseActiveMedia() {
        var wrap = document.getElementById("mediaWrap");
        if (!wrap) return;
        var vid = wrap.querySelector("video");
        if (vid) {
          try {
            vid.pause();
          } catch (e) {}
        }
        var aud = wrap.querySelector("audio");
        if (aud) {
          try {
            aud.pause();
          } catch (e) {}
        }
      }

      function requestArtwork() {
        openInputModal(
          "Audio added. Type or paste an image link to show with the audio:",
          function (v) {
            var u = extractUrl(String(v || ""));
            if (!u) return;
            var wrap = document.getElementById("mediaWrap");
            if (!wrap) return;
            var img = document.createElement("img");
            img.src = u;
            img.alt = "artwork";
            img.loading = "lazy";
            wrap.insertBefore(img, wrap.firstChild);
            wrap.classList.add("withArt");
          },
        );
      }

      function speakChinese(text) {
        if (!soundOn) return;
        if (window.tizen && window.tizen.tts) {
          try {
            tizen.tts.speak(String(text), {
              locale: "zh-CN",
              rate: 0.85,
              pitch: 1.0,
              type: "TTS_TYPE_SCREEN_READER",
            });
            return;
          } catch (e) {}
        }
        if (synth && typeof SpeechSynthesisUtterance !== "undefined") {
          cancelSpeech();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = "zh-CN";
          u.rate = 0.9;
          u.pitch = 1.0;
          var voices = synth.getVoices();
          for (var i = 0; i < voices.length; i++) {
            var v = voices[i];
            if (v && v.lang && v.lang.toLowerCase().indexOf("zh") === 0) {
              u.voice = v;
              break;
            }
          }
          synth.speak(u);
        }
      }

      document.getElementById("soundBtn").onclick = function () {
        soundOn = !soundOn;
        var sb = document.getElementById("soundBtn");
        sb.innerHTML = soundOn ? ICON_VOLUME_ON : ICON_VOLUME_OFF;
        sb.classList.toggle("muted", !soundOn);
        if (soundOn) {
          if (synth) synth.cancel();
        }
        cancelSpeech();
      };
      (function () {
        var ov = document.getElementById("mediaOverlay");
        if (ov) {
          ov.addEventListener("click", function (e) {
            if (e.target === ov || e.target.id === "ovContent") {
              closeMediaOverlay();
            }
          });
        }
      })();
      var themeBtn = document.getElementById("themeBtn");
      var themeDark = false;
      function applyTheme(dark) {
        themeDark = dark;
        if (themeBtn) themeBtn.classList.toggle("dark", dark);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      }
      try {
        var storedTheme = localStorage.getItem("eebt-theme");
        if (storedTheme === "dark") applyTheme(true);
        else if (storedTheme === "light") applyTheme(false);
        else if (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          applyTheme(true);
        }
      } catch (e) {}
      if (themeBtn) {
        themeBtn.onclick = function () {
          applyTheme(!themeDark);
          try {
            localStorage.setItem("eebt-theme", themeDark ? "dark" : "light");
          } catch (e) {}
        };
      }
      document.addEventListener("keydown", function (e) {
        var k = e.key || "";
        var kc = e.keyCode || e.which || 0;
        if (document.getElementById("inputModal").classList.contains("show")) {
          if (k === "Escape" || kc === 27 || kc === 10009) {
            closeInputModal();
            return;
          }
          if (kc === 13 || kc === 29443 || k === "Enter") {
            submitInputModal();
            return;
          }
          return;
        }
        if (document.getElementById("mediaOverlay").classList.contains("show")) {
          if (k === "Escape" || kc === 27 || kc === 10009) {
            closeMediaOverlay();
            return;
          }
          return;
        }
        if (k === "ArrowRight" || kc === 39 || k === " " || kc === 32) {
          if (e.preventDefault) e.preventDefault();
          next();
        } else if (k === "ArrowLeft" || kc === 37) {
          prev();
        } else if (k === "Escape" || kc === 27 || kc === 10009) {
          show(0);
        } else if (kc === 13 || kc === 29443 || k === "Enter") {
          var el = document.activeElement;
          if (el && el.tagName === "BUTTON" && !el.disabled) el.click();
        }
      });
      var touchStart = null;
      var appEl = document.getElementById("app");
      if (appEl && "ontouchstart" in window) {
        appEl.addEventListener(
          "touchstart",
          function (e) {
            var t = e.touches && e.touches[0];
            if (!t) return;
            touchStart = { x: t.clientX, y: t.clientY, t: Date.now() };
          },
          { passive: true },
        );
        appEl.addEventListener(
          "touchend",
          function (e) {
            if (!touchStart) return;
            var t = e.changedTouches && e.changedTouches[0];
            if (!t) return;
            var dx = t.clientX - touchStart.x;
            var dy = t.clientY - touchStart.y;
            var dt = Date.now() - touchStart.t;
            touchStart = null;
            if (dt > 900) return;
            if (Math.abs(dx) < 40 && Math.abs(dy) < 40) return;
            if (Math.abs(dx) > Math.abs(dy)) {
              if (dx < 0) next();
              else prev();
            }
          },
          { passive: true },
        );
      }
      window.addEventListener("resize", function () {
        if (lastSrcText) equalizeBoxes();
      });
      var csvFileInput = document.getElementById("csvFileInput");
      if (csvFileInput) {
        csvFileInput.addEventListener("change", function () {
          loadCsv(csvFileInput);
        });
      }
      var mediaFileInput = document.getElementById("mediaFileInput");
      if (mediaFileInput) {
        mediaFileInput.addEventListener("change", function () {
          loadMediaUrls(mediaFileInput);
        });
      }
      show(0);
      renderMediaThumbs();
    </script>
  <script src="../../config.js"></script>
  <script src="../../tracker.js"></script>
  </body>
</html>
