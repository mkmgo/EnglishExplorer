      }

      function renderClipList() {
        clipList.innerHTML = "";
        for (var i = 0; i < clipHistory.length; i++) {
          var c = clipHistory[i];
          appendClipRow(c.time, c.en, c.zh);
        }
        updateClipMoveButtons();
      }

      function updateClipMoveButtons() {
        var rows = clipList.children;
        for (var i = 0; i < rows.length; i++) {
          var up = rows[i].querySelector(".clipMove.up");
          var down = rows[i].querySelector(".clipMove.down");
          if (up) up.disabled = i === 0;
          if (down) down.disabled = i === rows.length - 1;
        }
      }

      function moveClipRow(row, dir) {
        var rows = clipList.children;
        var idx = -1;
        for (var i = 0; i < rows.length; i++) {
          if (rows[i] === row) {
            idx = i;
            break;
          }
        }
        if (idx < 0) return;
        var newIdx = idx + dir;
        if (newIdx < 0 || newIdx >= rows.length) return;
        var tmp = clipHistory[idx];
        clipHistory[idx] = clipHistory[newIdx];
        clipHistory[newIdx] = tmp;
        if (dir < 0) {
          clipList.insertBefore(row, rows[newIdx]);
        } else {
          clipList.insertBefore(row, rows[newIdx].nextSibling);
        }
        updateClipMoveButtons();
        row.style.transition = "none";
        row.style.transform = dir < 0 ? "translateY(-4px)" : "translateY(4px)";
        row.offsetHeight;
        row.style.transition = "0.2s transform ease-out";
        row.style.transform = "";
        saveWords();
        toast(dir < 0 ? "Moved up" : "Moved down");
      }

      function deleteClipRow(row) {
        var rows = clipList.children;
        var idx = -1;
        for (var i = 0; i < rows.length; i++) {
          if (rows[i] === row) {
            idx = i;
            break;
          }
        }
if (idx < 0) return;
        clipHistory.splice(idx, 1);
        saveWords();
        row.style.transition = "0.2s opacity ease-out, 0.2s transform ease-out";
        row.style.opacity = "0";
        row.style.transform = "translateX(20px)";
        row.style.maxHeight = row.offsetHeight + "px";
        row.offsetHeight;
        row.style.maxHeight = "0";
        row.style.paddingTop = "0";
        row.style.paddingBottom = "0";
        row.style.marginTop = "0";
        row.style.marginBottom = "-0.5em";
        setTimeout(function () {
          if (row.parentNode) row.parentNode.removeChild(row);
          updateClipMoveButtons();
        }, 210);
        toast("Deleted");
      }

      function addClip(en, zh) {
        if (!clipList) return;
        var key = en + "|" + zh;
        if (key === lastClipKey) return;
        lastClipKey = key;
        var now = new Date();
        var time = now.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
        clipHistory.push({ time: time, en: en, zh: zh });
        renderClipList();
        saveWords();
      }

      function saveWords() {
        try {
          localStorage.setItem("spotlight-words", JSON.stringify(clipHistory));
        } catch (e) {}
      }

      function restoreWords() {
        try {
          var raw = localStorage.getItem("spotlight-words");
          if (!raw) return;
          var arr = JSON.parse(raw);
          if (!Array.isArray(arr)) return;
          clipHistory = arr;
          renderClipList();
        } catch (e) {}
      }

      function clearWords() {
        clipHistory = [];
        lastClipKey = "";
        renderClipList();
        saveWords();
        toast("Word list cleared");
      }

      function csvCell(v) {
        v = String(v == null ? "" : v);
        return '"' + v.replace(/"/g, '""') + '"';
      }

      function downloadCsv() {
        if (!clipHistory.length) return;
        var rows = [];
        rows.push(
          [csvCell("time"), csvCell("english"), csvCell("chinese")].join(","),
        );
        for (var i = 0; i < clipHistory.length; i++) {
          var c = clipHistory[i];
          rows.push(
            [csvCell(c.time), csvCell(c.en), csvCell(c.zh)].join(","),
          );
        }
        var csv = "\uFEFF" + rows.join("\r\n");
        var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        var now = new Date();
        var dt = now.getFullYear().toString() +
          String(now.getMonth() + 1).padStart(2, "0") +
          String(now.getDate()).padStart(2, "0") + "_" +
          String(now.getHours()).padStart(2, "0") +
          String(now.getMinutes()).padStart(2, "0") +
          String(now.getSeconds()).padStart(2, "0");
        a.download = "vocasofdate_" + dt + ".csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
      }

      function parseCsv(text) {
        var rows = [];
        var row = [];
        var cur = "";
        var inQ = false;
        for (var i = 0; i < text.length; i++) {
          var ch = text.charAt(i);
          if (inQ) {
            if (ch === '"') {
              if (text.charAt(i + 1) === '"') {
                cur += '"';
                i++;
              } else {
                inQ = false;
              }
            } else {
              cur += ch;
            }
          } else if (ch === '"') {
            inQ = true;
          } else if (ch === ",") {
            row.push(cur);
            cur = "";
          } else if (ch === "\n") {
            row.push(cur);
            rows.push(row);
            row = [];
            cur = "";
          } else if (ch !== "\r") {
            cur += ch;
          }
        }
        if (cur !== "" || row.length) {
          row.push(cur);
          rows.push(row);
        }
        return rows;
      }

      function decodeCsvFile(file, cb) {
        if (typeof TextDecoder === "undefined" || !window.Uint8Array) {
          var fr = new FileReader();
          fr.onload = function () {
            cb(String(fr.result || ""));
          };
          fr.readAsText(file);
          return;
        }
        var reader = new FileReader();
        reader.onload = function () {
          var u8 = new Uint8Array(reader.result || 0);
          var label = null;
          if (u8.length >= 2 && u8[0] === 0xff && u8[1] === 0xfe)
            label = "utf-16le";
          else if (u8.length >= 2 && u8[0] === 0xfe && u8[1] === 0xff)
            label = "utf-16be";
          if (!label) {
            try {
              new TextDecoder("utf-8", { fatal: true }).decode(u8);
              label = "utf-8";
            } catch (e) {
              label = "gb18030";
            }
          }
          var text = "";
          try {
            text = new TextDecoder(label).decode(u8);
          } catch (e) {}
          if (!text && u8.length) {
            try {
              text = new TextDecoder("utf-8").decode(u8);
            } catch (e2) {}
          }
          cb(String(text).replace(/^[\uFEFF\uFFFE]/, ""));
        };
        reader.readAsArrayBuffer(file);
      }

      function loadCsv(input) {
        var file = input.files && input.files[0];
        input.value = "";
        if (!file) return;
        decodeCsvFile(file, function (text) {
          var rows = parseCsv(text);
          var count = 0;
          var garbled = 0;
          var skipped = 0;
          for (var i = 0; i < rows.length; i++) {
            var cells = rows[i];
            while (cells.length < 3) cells.push("");
            var t = cells[0].trim();
            var en = cells[1].trim();
            var zh = cells[2].trim();
            if (t.toLowerCase() === "time" && en.toLowerCase() === "english")
              continue;
            if (!en && !zh) continue;
            var dup = false;
            for (var j = 0; j < clipHistory.length; j++) {
              if (clipHistory[j].en === en && clipHistory[j].zh === zh) {
                dup = true;
                break;
              }
            }
            if (dup) {
              skipped++;
              continue;
            }
            if (en.indexOf("\uFFFD") >= 0 || zh.indexOf("\uFFFD") >= 0)
              garbled++;
            clipHistory.push({ time: t, en: en, zh: zh });
            appendClipRow(t, en, zh);
            count++;
          }
          updateClipMoveButtons();
          saveWords();
          var msg;
          if (count && skipped) {
            msg = "Loaded " + count + " word(s), " + skipped + " duplicate(s) skipped";
          } else if (count) {
            msg = "Loaded " + count + " word(s)";
          } else if (skipped) {
            msg = "All " + skipped + " entries already loaded \u2014 use Clear to start fresh";
          } else {
            msg = "No new words found";
          }
          if (garbled)
            msg += " \u2014 " + garbled + " garbled, re-save CSV as UTF-8";
          toast(msg);
        });
      }

      function restoreClip(en, zh) {
        translateSeq++;
        en = cleanEn(en);
        lastSrcText = en;
        lastZhText = zh;
        var srcBox = document.getElementById("srcLangBox");
        var zhBox = document.getElementById("zhLangBox");
        if (srcBox) {
          srcBox.textContent = en;
          srcBox.classList.add("filled");
        }
        if (zhBox) {
          zhBox.textContent = zh;
          zhBox.classList.add("filled");
        }
        equalizeBoxes();
      }

      function extractUrl(text) {
        var m = String(text).match(/https?:\/\/[^\s"<>]+/);
        return m ? m[0] : null;
      }

      function pasteMedia() {
        var run = function (txt) {
          if (!txt) return;
          var urls = extractAllUrls(txt);
          if (urls.length > 1) {
            injectMediaBatch(urls);
          } else if (urls.length === 1) {
            injectMedia(urls[0]);
          }
        };
        if (
          navigator.clipboard &&
          typeof navigator.clipboard.readText === "function"
        ) {
          navigator.clipboard
            .readText()
            .then(function (txt) {
              var urls = extractAllUrls(String(txt || ""));
              if (urls.length === 0) {
                openInputModal(
                  "Clipboard is empty. Paste one or more Cloudinary asset links (one per line):",
                  run,
                );
                return;
              }
              run(txt);
            })
            .catch(function () {
              openInputModal(
                "Clipboard is empty. Paste one or more Cloudinary asset links (one per line):",
                run,
              );
            });
        } else {
          openInputModal(
            "Paste one or more Cloudinary asset links (one per line):",
            run,
          );
        }
      }

      function detectMediaType(url) {
        var lower = url.toLowerCase();
        if (
          /\/video\//.test(lower) ||
          /\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/.test(lower)
        )
          return "video";
        if (
          /\/audio\//.test(lower) ||
          /\.(mp3|wav|ogg|m4a|aac)(\?|#|$)/.test(lower)
        )
          return "audio";
        return "image";
      }

      function extractAllUrls(text) {
        var lines = String(text || "").split(/\r?\n/);
        var urls = [];
        for (var i = 0; i < lines.length; i++) {
          var u = extractUrl(lines[i]);
          if (u) urls.push(u);
        }
        return urls;
      }

      function injectMedia(url) {
        for (var i = 0; i < mediaHistory.length; i++) {
          if (mediaHistory[i].url === url) {
            activeMediaIdx = i;
            renderMedia();
            renderMediaThumbs();
            toast("Already in session");
            return;
          }
        }
        var type = detectMediaType(url);
        mediaHistory.push({ url: url, type: type, collection: null });
        activeMediaIdx = mediaHistory.length - 1;
        renderMedia();
        renderMediaThumbs();
        if (type === "audio") {
          requestArtwork();
        }
      }

      function injectMediaBatch(urls) {
        var added = 0;
        var startIdx = mediaHistory.length;
        for (var i = 0; i < urls.length; i++) {
          var dup = false;
          for (var j = 0; j < mediaHistory.length; j++) {
            if (mediaHistory[j].url === urls[i]) { dup = true; break; }
          }
          if (dup) continue;
          var type = detectMediaType(urls[i]);
          mediaHistory.push({ url: urls[i], type: type, collection: null });
          added++;
        }
        if (added === 0) {
          toast("All already in session");
          return;
        }
        activeMediaIdx = mediaHistory.length - 1;
        viewingCollection = null;
        renderMedia();
        renderMediaThumbs();
        openInputModal("Name this collection (" + added + " items):", function (title) {
          if (!title) return;
          for (var k = startIdx; k < mediaHistory.length; k++) {
            mediaHistory[k].collection = title;
          }
          renderMediaThumbs();
          renderCollectionLabel();
          toast('Collection: "' + title + '"');
        });
      }

      function renderMedia() {
        var wrap = document.getElementById("mediaWrap");
        if (!wrap) return;
        wrap.innerHTML = "";
        wrap.classList.remove("withArt");
        if (activeMediaIdx < 0 || !mediaHistory[activeMediaIdx]) {
          wrap.classList.add("empty");
          var ph = document.createElement("span");
          ph.className = "mediaPlaceholder";
          ph.textContent = "🎬";
          ph.style.cursor = "pointer";
          ph.addEventListener("click", function () {
            pasteMedia();
          });
          wrap.appendChild(ph);
          return;
        }
        wrap.classList.remove("empty");

        if (viewingCollection) {
          renderCollectionView(wrap, viewingCollection);
          renderMediaThumbs();
          renderCollectionLabel();
          return;
        }

        var entry = mediaHistory[activeMediaIdx];
        var el;
        if (entry.type === "video") {
          el = document.createElement("video");
          el.controls = true;
          el.preload = "auto";
          el.muted = false;
          el.playsInline = true;
          el.setAttribute("playsinline", "true");
          el.setAttribute("webkit-playsinline", "true");
          el.src = entry.url;
          el.style.cursor = "pointer";
          el.addEventListener("click", function (e) {
            if (e.target !== el) return;
            shrinkMedia();
          });
        } else if (entry.type === "audio") {
          el = document.createElement("audio");
          el.controls = true;
          el.preload = "auto";
          el.src = entry.url;
        } else {
          el = document.createElement("img");
          el.src = entry.url;
          el.alt = "media";
          el.style.cursor = "pointer";
          el.addEventListener("click", function () {
            shrinkMedia();
          });
        }
        wrap.appendChild(el);
        var enlargeBtn = document.createElement("button");
        enlargeBtn.className = "mediaEnlargeBtn";
        enlargeBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1.4em" height="1.4em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M11 8v6"/><path d="M8 11h6"/></svg>';
        enlargeBtn.addEventListener("click", function () {
          openMediaOverlay();
        });
        wrap.appendChild(enlargeBtn);
        renderMediaThumbs();
        renderCollectionLabel();
      }

      function renderCollectionLabel() {
        var label = document.getElementById("collectionLabel");
        if (!label) return;
        if (viewingCollection || activeMediaIdx < 0 || !mediaHistory[activeMediaIdx]) {
          label.style.display = "none";
          return;
        }
        var col = mediaHistory[activeMediaIdx].collection;
        if (col) {
          label.textContent = col;
          label.style.display = "";
        } else {
          label.style.display = "none";
        }
      }

      function renderCollectionView(wrap, title) {
        wrap.classList.add("withArt", "collectionView");

        var h = document.createElement("div");
        h.className = "collectionViewTitle";
        h.textContent = title;
        wrap.appendChild(h);

        var grid = document.createElement("div");
        grid.className = "collectionViewGrid";

        for (var i = 0; i < mediaHistory.length; i++) {
          if (mediaHistory[i].collection !== title) continue;
          (function (itemIdx) {
            var item = mediaHistory[itemIdx];
            var cell = document.createElement("div");
            cell.className = "collectionViewCell";

            if (item.type === "image") {
              var img = document.createElement("img");
              img.src = item.url;
              img.alt = "media";
              img.loading = "lazy";
              img.style.cursor = "pointer";
              img.addEventListener("click", function () {
                openCollectionOverlay(title);
              });
              cell.appendChild(img);
            } else if (item.type === "video") {
              var vid = document.createElement("video");
              vid.controls = true;
              vid.preload = "metadata";
              vid.src = item.url;
              cell.appendChild(vid);
            } else {
              var aud = document.createElement("audio");
              aud.controls = true;
              aud.preload = "metadata";
              aud.src = item.url;
              cell.appendChild(aud);
            }

            grid.appendChild(cell);
          })(i);
        }

        wrap.appendChild(grid);

        var closeBtn = document.createElement("button");
        closeBtn.className = "collectionViewClose";
        closeBtn.type = "button";
        closeBtn.setAttribute("aria-label", "Close collection");
        closeBtn.innerHTML = "&times;";
        closeBtn.addEventListener("click", function () {
          shrinkMedia();
        });
        wrap.appendChild(closeBtn);

        var enlargeBtn = document.createElement("button");
        enlargeBtn.className = "mediaEnlargeBtn";
        enlargeBtn.type = "button";
        enlargeBtn.setAttribute("aria-label", "Enlarge collection");
        enlargeBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1.4em" height="1.4em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M11 8v6"/><path d="M8 11h6"/></svg>';
        enlargeBtn.addEventListener("click", function () {
          openCollectionOverlay(title);
        });
        wrap.appendChild(enlargeBtn);
      }

      var dragFromIdx = -1;
      var dragOverIdx = -1;

      function removeMedia(idx) {
        if (idx < 0 || idx >= mediaHistory.length) return;
        pauseActiveMedia();
        mediaHistory.splice(idx, 1);
        if (activeMediaIdx === idx) {
          activeMediaIdx = -1;
        } else if (activeMediaIdx > idx) {
          activeMediaIdx--;
        }
        renderMedia();
        renderMediaThumbs();
        toast("Removed");
      }

      function handleMediaDrop(fromIdx, toIdx) {
        if (fromIdx === toIdx) return;
        if (fromIdx < 0 || fromIdx >= mediaHistory.length) return;
        if (toIdx < 0 || toIdx >= mediaHistory.length) return;
        var fromItem = mediaHistory[fromIdx];
        var toItem = mediaHistory[toIdx];
        if (fromItem.collection && fromItem.collection === toItem.collection) {
          toast("Same collection");
          return;
        }
        var prefill = toItem.collection || fromItem.collection || "";
        var promptText = prefill
          ? 'Add to collection "' + prefill + '" or enter new title:'
          : "Enter Collection Title:";
        openInputModal(promptText, function (title) {
          if (!title) return;
          assignCollection(fromIdx, toIdx, title);
        });
        var field = document.getElementById("inputField");
        if (field && prefill) {
          field.value = prefill;
          field.select();
        }
      }

      function assignCollection(fromIdx, toIdx, title) {
        var fromCol = mediaHistory[fromIdx].collection;
        var toCol = mediaHistory[toIdx].collection;
        for (var i = 0; i < mediaHistory.length; i++) {
          if (i === fromIdx || i === toIdx) {
            mediaHistory[i].collection = title;
          } else if (
            (fromCol && mediaHistory[i].collection === fromCol) ||
            (toCol && mediaHistory[i].collection === toCol)
          ) {
            mediaHistory[i].collection = title;
          }
        }
        renderMediaThumbs();
        renderCollectionLabel();
        toast('Collection: "' + title + '"');
      }

      function createThumbButton(idx) {
        var entry = mediaHistory[idx];
        var btn = document.createElement("button");
        btn.className = "thumb";
        btn.type = "button";
        btn.draggable = true;
        btn.setAttribute("data-media-idx", String(idx));

        var clip = document.createElement("div");
        clip.className = "thumbClip";
        if (entry.type === "image") {
          var img = document.createElement("img");
          img.src = entry.url;
          img.alt = "thumb";
          img.loading = "lazy";
          clip.appendChild(img);
        } else if (entry.type === "video") {
          var vid = document.createElement("video");
          vid.muted = true;
          vid.preload = "metadata";
          vid.src = entry.url;
          clip.appendChild(vid);
        } else {
          clip.textContent = "\uD3C3";
        }
        btn.appendChild(clip);

        var closeBtn = document.createElement("button");
        closeBtn.className = "thumbClose";
        closeBtn.type = "button";
        closeBtn.innerHTML = "\u00D7";
        closeBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          e.preventDefault();
          removeMedia(idx);
        });
        btn.appendChild(closeBtn);

        var didDrag = false;
        var touchStartPos = null;

        btn.addEventListener("dragstart", function (e) {
          dragFromIdx = idx;
          btn.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", String(idx));
        });
        btn.addEventListener("dragend", function () {
          btn.classList.remove("dragging");
          dragFromIdx = -1;
          var c = document.getElementById("mediaThumbs");
          if (c) {
            var overs = c.querySelectorAll(".dragOver");
            for (var k = 0; k < overs.length; k++) overs[k].classList.remove("dragOver");
          }
        });
        btn.addEventListener("dragover", function (e) {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          btn.classList.add("dragOver");
        });
        btn.addEventListener("dragleave", function () {
          btn.classList.remove("dragOver");
        });
        btn.addEventListener("drop", function (e) {
          e.preventDefault();
          btn.classList.remove("dragOver");
          if (dragFromIdx >= 0 && dragFromIdx !== idx) {
            handleMediaDrop(dragFromIdx, idx);
          }
          dragFromIdx = -1;
        });

        btn.addEventListener("touchstart", function (e) {
          var t = e.touches[0];
          if (t) touchStartPos = { x: t.clientX, y: t.clientY };
          dragFromIdx = idx;
          didDrag = false;
        }, { passive: true });
        btn.addEventListener("touchmove", function (e) {
          if (dragFromIdx < 0) return;
          e.preventDefault();
          var t = e.touches[0];
          if (!t) return;
          if (touchStartPos) {
            var dx = Math.abs(t.clientX - touchStartPos.x);
            var dy = Math.abs(t.clientY - touchStartPos.y);
            if (dx > 10 || dy > 10) didDrag = true;
          }
          var el = document.elementFromPoint(t.clientX, t.clientY);

          if (over && over !== btn) {
            over.classList.add("dragOver");
            dragOverIdx = parseInt(over.getAttribute("data-media-idx"), 10);
          } else {
            dragOverIdx = -1;
          }
        }, { passive: false });
        btn.addEventListener("touchend", function () {
          if (dragFromIdx >= 0 && dragOverIdx >= 0 && dragFromIdx !== dragOverIdx) {
            handleMediaDrop(dragFromIdx, dragOverIdx);
          }
          dragFromIdx = -1;
          dragOverIdx = -1;
          touchStartPos = null;
          var c = document.getElementById("mediaThumbs");
          if (c) {
            var overs = c.querySelectorAll(".dragOver");
            for (var k = 0; k < overs.length; k++) overs[k].classList.remove("dragOver");
          }
        });

        btn.addEventListener("click", function (e) {
          if (didDrag) {
            didDrag = false;
            e.preventDefault();
            return;
          }
          selectMedia(idx);
        });

        return btn;

      function downloadMediaUrls() {
        if (!mediaHistory.length) {
          toast("No media to download");
          return;
        }
        var uncollected = [];
        var collections = {};
        var collectionOrder = [];
        for (var i = 0; i < mediaHistory.length; i++) {
          var item = mediaHistory[i];
          var serialized = item.url;
          if (!item.collection) {
            uncollected.push(serialized);
          } else {
            if (!collections[item.collection]) {
              collections[item.collection] = [];
              collectionOrder.push(item.collection);
            }
            collections[item.collection].push(serialized);
          }
        }
        var lines = [];
        for (var u = 0; u < uncollected.length; u++) {
          lines.push(uncollected[u]);
        }
        for (var c = 0; c < collectionOrder.length; c++) {
          lines.push("#Collection: " + collectionOrder[c]);
          var items = collections[collectionOrder[c]];
          for (var j = 0; j < items.length; j++) {
            lines.push(items[j]);
          }
        }
        var content = lines.join("\r\n");
        var blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        var now = new Date();
        var dt =
          now.getFullYear().toString() +
          String(now.getMonth() + 1).padStart(2, "0") +
          String(now.getDate()).padStart(2, "0") +
          "_" +
          String(now.getHours()).padStart(2, "0") +
          String(now.getMinutes()).padStart(2, "0") +
          String(now.getSeconds()).padStart(2, "0");
        a.download = "media_session_" + dt + ".txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
        toast("Downloaded " + mediaHistory.length + " URL(s)");
      }

      function loadMediaUrls(input) {
        var file = input.files && input.files[0];
        input.value = "";
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          var lines = String(reader.result || "").split(/\r\n|\n|\r/);
          var count = 0;
          var currentCollection = null;
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) continue;
            if (line.indexOf("#Collection: ") === 0) {
              currentCollection = line.substring("#Collection: ".length).trim() || null;
              continue;
            }
            var u = extractUrl(line);
            if (!u) continue;
            var dup = false;
            for (var j = 0; j < mediaHistory.length; j++) {
              if (mediaHistory[j].url === u) {
                dup = true;
                break;
              }
            }
            if (dup) continue;
            mediaHistory.push({ url: u, type: detectMediaType(u), collection: currentCollection });
            count++;
          }
          renderMediaThumbs();
          toast(count ? "Loaded " + count + " URL(s)" : "No URLs found");
        };
        reader.readAsText(file);
      }

      function mdResolveMedia(ref) {

      function appendWordSpan(parent, txt) {
        var parts = String(txt).split(/(\s+)/);
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          if (!p) continue;
          if (/^\s+$/.test(p)) {
            parent.appendChild(document.createTextNode(p));
          } else {
            var w = document.createElement("span");
            w.className = "mdWord";
            w.textContent = p;
            w.setAttribute("data-word", p);
            parent.appendChild(w);
          }
        }
      }

      function mdInline(raw, skipWords) {
        var s = String(raw);
        var out = [];
        var re =
          /(\[([^\]]*)\]\(([^)]+)\)|`([^`]*)`|\*\*([^*]+)\*\*|_([^_]+)_|\*([^*]+)\*)/g;
        var last = 0;
        var m;
        while ((m = re.exec(s))) {
          if (m.index > last) out.push(s.slice(last, m.index));
          if (m[1] && m[1].indexOf("[") === 0) {
            var a = document.createElement("a");
            a.className = "mdLink";
            a.textContent = m[2];
            a.href = m[3];
            a.target = "_blank";
            a.rel = "noopener";
            a.setAttribute("data-text", m[2]);
            out.push(a);
          } else if (m[4] !== undefined) {
            var code = document.createElement("code");
            code.textContent = m[4];
            out.push(code);
          } else {
            var txt = m[5] !== undefined ? m[5] : m[6] !== undefined ? m[6] : m[7];
            var em = document.createElement(m[5] !== undefined ? "strong" : "em");
            appendWordSpan(em, txt);
            out.push(em);
          }
          last = re.lastIndex;
        }
        if (last < s.length) out.push(s.slice(last));
        return out;
      }

      function mdFillText(el, raw, skipWords) {
        var nodes = mdInline(raw, skipWords);
        for (var i = 0; i < nodes.length; i++) {
          var n = nodes[i];
          if (typeof n === "string") {
            if (skipWords) el.appendChild(document.createTextNode(n));
            else appendWordSpan(el, n);
          } else {
            el.appendChild(n);
          }
        }
      }

          img.className = "mdMedia";
          img.src = item.url;

          img.setAttribute("data-media", item.url);

      function parseMd(src) {
        var lines = String(src).split(/\r?\n/);
        var blocks = [];
        var para = [];
        var list = null;
        var ordered = false;
        var pre = false;
        var preBuf = [];
        var tableBuf = null;

        function flushPara() {
          if (para.length) { blocks.push({ t: "p", text: para.join("\n") }); para = []; }
        }
        function flushList() {
          if (list) { blocks.push({ t: "list", items: list, ordered: ordered }); list = null; }
        }
        function isTableRow(line) {
          var t = String(line || "").trim();
          return t.charAt(0) === "|" && t.indexOf("|") >= 0;
        }
        function parseTableRow(line) {
          var t = String(line || "").trim();
          if (t.charAt(0) === "|") t = t.slice(1);
          if (t.charAt(t.length - 1) === "|") t = t.slice(0, -1);
          return t.split("|").map(function (c) { return c.trim(); });
        }
        function isTableSep(cells) {
          if (!cells.length) return false;
          for (var i = 0; i < cells.length; i++) {
            if (!/^:?-+:?$/.test(cells[i])) return false;
          }
          return true;
        }
        function tableAligns(cells) {
          var align = [];
          for (var i = 0; i < cells.length; i++) {
            var c = cells[i];
            if (c.charAt(0) === ":" && c.charAt(c.length - 1) === ":") align.push("center");
            else if (c.charAt(c.length - 1) === ":") align.push("right");
            else align.push("left");
          }
          return align;
        }
        function flushTable() {
          if (!tableBuf || !tableBuf.length) return;
          if (tableBuf.length >= 2 && isTableSep(parseTableRow(tableBuf[1]))) {
            var header = parseTableRow(tableBuf[0]);
            var rows = [];
            for (var i = 2; i < tableBuf.length; i++) rows.push(parseTableRow(tableBuf[i]));
            blocks.push({
              t: "table",
              header: header,
              rows: rows,
              align: tableAligns(parseTableRow(tableBuf[1]))
            });
          } else {
            para.push(tableBuf.join(" "));
          }
          tableBuf = null;
        }

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (/^\s*```/.test(line)) {
            flushPara();
            flushList();
            flushTable();
            if (pre) { blocks.push({ t: "pre", text: preBuf.join("\n") }); preBuf = []; pre = false; }
            else pre = true;
            continue;
          }
          if (pre) { preBuf.push(line); continue; }
          var trimmed = line.trim();
          if (!trimmed) { flushPara(); flushList(); flushTable(); continue; }
          var mt = trimmed.match(/^\{\{media:([^}]+)\}\}$/);
          if (!mt) {
            var bareRef = trimmed.match(/^\{\{([^^{}]+)\}\}$/);
            if (bareRef && mdResolveMedia(bareRef[1].trim())) mt = bareRef;
          }
          if (!mt) mt = trimmed.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
          if (mt) {
            flushPara();
            flushList();
            flushTable();
            blocks.push({ t: "media", ref: (mt[1] || mt[2]).trim() });
            continue;
          }
          if (isTableRow(trimmed)) {
            flushPara();
            flushList();
            if (!tableBuf) tableBuf = [];
            tableBuf.push(trimmed);
            continue;
          }
          flushTable();
          var h = trimmed.match(/^(#{1,6})\s+(.*)$/);
          if (h) { flushPara(); flushList(); blocks.push({ t: "h", level: h[1].length, text: h[2] }); continue; }
          var bq = trimmed.match(/^>\s?(.*)$/);
          if (bq) { flushPara(); flushList(); blocks.push({ t: "bq", text: bq[1] }); continue; }
          var ol = trimmed.match(/^\d+\.\s+(.*)$/);
          var ul = trimmed.match(/^[-*+]\s+(.*)$/);
          if (ol || ul) {
            flushPara();
            if (!list) { list = []; ordered = !!ol; }
            list.push(ol ? ol[1] : ul[1]);
            continue;
          }
          flushList();
          para.push(trimmed);
        }
        flushPara();
        flushList();
        flushTable();
        if (pre) blocks.push({ t: "pre", text: preBuf.join("\n") });
        return blocks;
      }

      function mdStripInline(raw) {
        var s = String(raw);
        s = s.replace(/`([^`]*)`/g, "$1");
        s = s.replace(/\[([^\]]*)\]\([^)]*\)/g, "$1");
        s = s.replace(/(\*\*|__)(.*?)\1/g, "$2");
        s = s.replace(/(\*|_)(.*?)\1/g, "$2");
        return s.trim();
      }

      function mdRender() {
        var input = document.getElementById("mdSourceInput");
        var out = document.getElementById("mdOutput");
        if (!input || !out) return;
        if (mdSel) { mdSel.classList.remove("sel"); mdSel = null; }
        mdSelText = null;
        var src = input.value;
        try {
          localStorage.setItem("spotlight-md-src", src);
        } catch (e) {}
        out.innerHTML = "";
        var blocks = parseMd(src);

        for (var b = 0; b < blocks.length; b++) {
          var blk = blocks[b];
          var el;
          if (blk.t === "media") { out.appendChild(mdBuildMedia(blk.ref)); continue; }
          else if (blk.t === "h") { el = document.createElement("h" + blk.level); mdFillText(el, blk.text, false); }
          else if (blk.t === "bq") { el = document.createElement("blockquote"); mdFillText(el, blk.text, false); }
          else if (blk.t === "pre") { el = document.createElement("pre"); var c = document.createElement("code"); c.textContent = blk.text; el.appendChild(c); }
          else if (blk.t === "list") {
            el = document.createElement(blk.ordered ? "ol" : "ul");
            for (var li = 0; li < blk.items.length; li++) {
              var it = document.createElement("li");
              mdFillText(it, blk.items[li], false);
              el.appendChild(it);
            }
          }
          else if (blk.t === "table") {
            el = document.createElement("table");
            el.className = "mdCanvasTable";
            var align = blk.align || [];
            if (blk.header.length) {
              var thead = document.createElement("thead");
              var hr = document.createElement("tr");
              for (var hc = 0; hc < blk.header.length; hc++) {
                var th = document.createElement("th");
                th.style.textAlign = align[hc] || "left";
                mdFillText(th, blk.header[hc], false);
                hr.appendChild(th);
              }
              thead.appendChild(hr);
              el.appendChild(thead);
            }
            var tbody = document.createElement("tbody");
            for (var r = 0; r < blk.rows.length; r++) {
              var tr = document.createElement("tr");
              for (var celli = 0; celli < blk.rows[r].length; celli++) {
                var td = document.createElement("td");
                td.style.textAlign = align[celli] || "left";
                mdFillText(td, blk.rows[r][celli], false);
                tr.appendChild(td);
              }
              tbody.appendChild(tr);
            }
            el.appendChild(tbody);
          }
          else { el = document.createElement("p"); mdFillText(el, blk.text, false); }
          out.appendChild(el);
        }
        updateMdHint();
      }

      function generateProtocol() {
        if (!clipHistory.length) {
          toast("Add words in the translator first");
          return;
        }
        var input = document.getElementById("mdSourceInput");
        var src = input ? input.value : "";
        var blocks = parseMd(src);
        var firstH1 = "";
        for (var fi = 0; fi < blocks.length; fi++) {
          if (blocks[fi].t === "h" && blocks[fi].level === 1) {
            firstH1 = mdStripInline(blocks[fi].text);
            break;
          }
        }
        openInputModal(
          "Story title for today's protocol:" + (firstH1 ? "\n(detected: " + firstH1 + ")" : ""),
          function (title) {
            if (!title && firstH1) title = firstH1;
            if (!title) { toast("Title required"); return; }
            buildProtocolHtml(title, blocks);
          }
        );
        var field = document.getElementById("inputField");
        if (field && firstH1) {
          field.value = firstH1;
          field.select();
        }
      }

      function mdEscapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function updateMdHint() {
        var h = document.getElementById("mdHint");
        if (!h) return;
        h.textContent = mdSelText
          ? 'Selected: "' + mdSelText + '"  ·  Translate sends it to the translator'
          : "Tap a word to hear & select it · Translate sends it to the translator";
      }

      function mdSelect(text) {
        mdSelText = String(text || "").trim();
        updateMdHint();
      }

      function mdSay() {
        if (mdSelText) { sayOther(mdSelText); return; }
        var out = document.getElementById("mdOutput");
        if (out && out.textContent) sayOther(out.textContent);
      }

      function mdTranslate() {
        var text = mdSelText
          ? mdSelText
          : (function () {
              var out = document.getElementById("mdOutput");
              if (out && out.textContent) {
                return out.textContent.split(/\s+/).slice(0, 12).join(" ");
              }
              return "";
            })();
        var clean = cleanEn(text);
        if (!clean) { toast("Nothing to translate"); return; }
        doTranslate(clean);
        show(1);
        toast("Translate: " + clean);
      }

      function mdClear() {
        var input = document.getElementById("mdSourceInput");
        if (!input) return;
        input.value = "";
        try { localStorage.removeItem("spotlight-md-src"); } catch (e) {}
        mdRender();
        toast("Cleared");
      }

      function mdSave() {
        var input = document.getElementById("mdSourceInput");
        if (!input) return;
        var bundle = {
          type: "spotlight-presentation",
          md: "" + (input.value || ""),
          media: mediaHistory.map(function (it) {
            return {
              url: it.url,
              type: it.type,
              collection: it.collection || null
            };
          })
        };
        var blob = new Blob([JSON.stringify(bundle, null, 2)], {
          type: "application/json;charset=utf-8"
        });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        var now = new Date();
        var dt =
          now.getFullYear().toString() +
          String(now.getMonth() + 1).padStart(2, "0") +
          String(now.getDate()).padStart(2, "0") +
          "_" +
          String(now.getHours()).padStart(2, "0") +
          String(now.getMinutes()).padStart(2, "0") +
          String(now.getSeconds()).padStart(2, "0");
        a.download = "presentation_" + dt + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
        toast("Saved presentation (" + (mediaHistory.length || 0) + " media)");
      }

      function mdLoad(input) {
        var file = input.files && input.files[0];
        input.value = "";
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          var text = String(reader.result || "");
          if (/^\uFEFF/.test(text)) text = text.slice(1);
          var bundle = null;
          try {
            bundle = JSON.parse(text);
          } catch (e) {}
          if (bundle && (bundle.type === "spotlight-presentation" || bundle.media)) {
            if (bundle.md != null) {
              var el = document.getElementById("mdSourceInput");
              if (el) {
                el.value = bundle.md;
                try {
                  el.dispatchEvent(new Event("input"));
                } catch (e2) {
                  mdRender();
                }
              }
            }
            if (Array.isArray(bundle.media)) {
              mediaHistory = bundle.media
                .filter(function (m) { return m && typeof m.url === "string"; })
                .map(function (m) {
                  return {
                    url: m.url,
                    type: m.type === "video" || m.type === "audio" ? m.type : "image",
                    collection: m.collection || null
                  };
                });
              activeMediaIdx = -1;
              viewingCollection = null;
              renderMediaThumbs();
              renderMedia();
            }
            toast("Loaded presentation (" + (bundle.media ? bundle.media.length : 0) + " media)");
          } else {
            var el2 = document.getElementById("mdSourceInput");
            if (el2) {
              el2.value = text;
              try {
                el2.dispatchEvent(new Event("input"));
              } catch (e3) {
                mdRender();
              }
            }
            toast("Loaded " + file.name + " (markdown)");
          }
        };
        reader.readAsText(file);
      }

      function mdInit() {
        var input = document.getElementById("mdSourceInput");
        var out = document.getElementById("mdOutput");
        if (!input || !out) return;
        try {
          localStorage.removeItem("eebt-md-src");
          var saved = localStorage.getItem("spotlight-md-src");
          if (saved && saved !== input.value) input.value = saved;
        } catch (e) {}
        mdRender();
        input.addEventListener("input", function () {
          clearTimeout(mdRenderTimer);
          mdRenderTimer = setTimeout(mdRender, 280);
          updateMdSuggest();
        });
        input.addEventListener("keydown", function (e) {
          if (!mdSuggestOpen()) return;
          if (e.key === "ArrowDown") { e.preventDefault(); mdSuggestMove(1); }
          else if (e.key === "ArrowUp") { e.preventDefault(); mdSuggestMove(-1); }
          else if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); mdSuggestPick(); }
          else if (e.key === "Escape") { hideMdSuggest(); }
        });
        out.addEventListener("click", function (e) {
          var t = e.target;
          var media = t.closest ? t.closest(".mdMedia") : null;
          if (media) {
            var u = media.getAttribute("data-media");
            if (u) openMediaOverlay(u);
            return;
          }
          var w = t.closest ? t.closest(".mdWord") : null;
          if (w) {
            if (mdSel && mdSel !== w) mdSel.classList.remove("sel");
            w.classList.add("sel");
            mdSel = w;
            var word = w.getAttribute("data-word") || w.textContent;
            mdSelect(word);
            say(word);
            return;
          }
          var l = t.closest ? t.closest(".mdLink") : null;
          if (l) {
            e.preventDefault();
            var lt = l.getAttribute("data-text") || l.textContent;
            mdSelect(lt);
            say(lt);
          }
        });
      }

      var mdSuggestRows = [];
      var mdSuggestIdx = -1;

      function mdSuggestOpen() {
        var p = document.getElementById("mdSuggest");
        return !!p && p.classList.contains("show");
      }

      function mediaRefName(item) {
        if (item && item.collection) return item.collection;
        var s = String(item && item.url ? item.url : "").split("?")[0].split("#")[0];
        var seg = s.split("/").pop() || "";
        seg = seg.replace(/\.[a-zA-Z0-9]{2,5}$/i, "");
        return seg || (item ? item.url : "");
      }

      function buildMediaRefs() {
        var seen = {};
        var out = [];
        for (var i = 0; i < mediaHistory.length; i++) {
          var it = mediaHistory[i];
          var name = mediaRefName(it);
          var key = name.toLowerCase();
          var ref = key in seen ? it.url : name;
          seen[key] = true;
          out.push({ item: it, name: ref, label: name });
        }
        return out;
      }

      function caretMirrorPos(textarea) {
        try {
          var doc = textarea.ownerDocument;
          var cs = getComputedStyle(textarea);
          var mirror = doc.createElement("div");
          mirror.style.cssText =
            "position:absolute;visibility:hidden;white-space:pre-wrap;" +
            "word-wrap:break-word;top:0;left:0;height:auto;";
          mirror.style.fontFamily = cs.fontFamily;
          mirror.style.fontSize = cs.fontSize;
          mirror.style.fontStyle = cs.fontStyle;
          mirror.style.fontWeight = cs.fontWeight;
          mirror.style.letterSpacing = cs.letterSpacing;
          mirror.style.lineHeight = cs.lineHeight;
          mirror.style.textTransform = cs.textTransform;
          mirror.style.textAlign = cs.textAlign;
          mirror.style.textIndent = cs.textIndent;
          mirror.style.padding = cs.padding;
          mirror.style.borderWidth = cs.borderWidth;
          mirror.style.boxSizing = cs.boxSizing;
          mirror.style.width = cs.width;
          if (textarea.scrollHeight > textarea.clientHeight) mirror.style.overflowY = "scroll";
          mirror.textContent = textarea.value.substring(0, textarea.selectionStart);
          var span = doc.createElement("span");
          span.textContent = "\u200b";
          mirror.appendChild(span);
          doc.body.appendChild(mirror);
          var coords = {
            top: span.offsetTop - textarea.scrollTop,
            left: span.offsetLeft,
            height: (parseFloat(cs.fontSize) || 16) * 1.4
          };
          doc.body.removeChild(mirror);
          return coords;
        } catch (e) {
          return null;
        }
      }

      function updateMdSuggest() {
        var input = document.getElementById("mdSourceInput");
        var panel = document.getElementById("mdSuggest");
        if (!input || !panel) return;
        var start = input.selectionStart;
        var before = input.value.slice(0, start);
        var m = before.match(/\{\{([^{}]*)$/);
        if (!m) { hideMdSuggest(); return; }
        var needle = (m[1] || "").replace(/^media:/, "").toLowerCase();
        var all = buildMediaRefs();
        var matches = [];
        for (var i = 0; i < all.length; i++) {
          var hay = all[i].label.toLowerCase() + " " + all[i].item.url.toLowerCase();
          if (hay.indexOf(needle) >= 0) matches.push(all[i]);
        }
        panel.innerHTML = "";
        if (!matches.length) {
          var em = document.createElement("div");
          em.className = "mdSuggestEmpty";
          em.textContent = mediaHistory.length
            ? 'No loaded media matches "' + (m[1] || "") + '"'
            : "No media loaded yet - add it on screen 1 (Media clipper) first";
          panel.appendChild(em);
          positionMdSuggest(panel);
          return;
        }
        for (var j = 0; j < matches.length && j < 8; j++) {
          var it = matches[j];
          var r = document.createElement("button");
          r.type = "button";
          r.className = "mdSuggestRow";
          r.setAttribute("data-name", it.name);
          if (it.item.type === "image") {
            var img = document.createElement("img");
            img.className = "mdSuggestThumb";
            img.src = it.item.url;
            img.alt = "";
            r.appendChild(img);
          } else {
            var ic = document.createElement("span");
            ic.className = "mdSuggestIcon";
            ic.textContent = it.item.type === "video" ? "\u25b6" : "\u266a";
            r.appendChild(ic);
          }
          var lb = document.createElement("span");
          lb.className = "mdSuggestLabel";
          lb.textContent = it.label;
          r.appendChild(lb);
          r.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
          r.addEventListener("click", function (ev) {
            insertMdSuggestion(ev.currentTarget.getAttribute("data-name"));
          });
          panel.appendChild(r);
        }
        mdSuggestRows = matches.slice(0, 8);
        mdSuggestIdx = -1;
        positionMdSuggest(panel);
      }

      function positionMdSuggest(panel) {
        var input = document.getElementById("mdSourceInput");
        if (!input) return;
        panel.classList.add("show");
        var rect = input.getBoundingClientRect();
        var cp = caretMirrorPos(input);
        var pW = Math.min(320, Math.max(220, panel.offsetWidth || 260));
        var pH = Math.min(0.42 * window.innerHeight, panel.offsetHeight || 200);
        var left, top;
        if (cp && rect.width > 0) {
          var cs = getComputedStyle(input);
          var pl = parseFloat(cs.paddingLeft) || 0;
          left = rect.left + cp.left + pl;
          top = rect.top + cp.top + cp.height + 6;
          if (left + pW > window.innerWidth - 8) left = window.innerWidth - pW - 8;
          if (left < 8) left = 8;
          if (top + pH > window.innerHeight - 8) top = rect.top + cp.top - pH - 6;
          if (top < 8) top = 8;
        } else {
          left = (window.innerWidth - pW) / 2;
          top = rect.top > 0 ? Math.max(8, rect.top - pH - 8) : 80;
        }
        panel.style.maxWidth = pW + "px";
        panel.style.left = left + "px";
        panel.style.top = top + "px";
        panel.scrollTop = 0;
      }

      function mdSuggestMove(d) {
        var panel = document.getElementById("mdSuggest");
        if (!panel || !mdSuggestRows.length) return;
        var rows = panel.querySelectorAll(".mdSuggestRow");
        if (!rows.length) return;
        if (mdSuggestIdx >= 0 && rows[mdSuggestIdx]) rows[mdSuggestIdx].classList.remove("sel");
        mdSuggestIdx = (mdSuggestIdx + d + rows.length) % rows.length;
        rows[mdSuggestIdx].classList.add("sel");
        try { rows[mdSuggestIdx].scrollIntoView({ block: "nearest" }); } catch (e) {}
      }

      function mdSuggestPick() {
        var panel = document.getElementById("mdSuggest");
        if (!panel) return;
        if (mdSuggestIdx >= 0) {
          var rows = panel.querySelectorAll(".mdSuggestRow");
          if (rows[mdSuggestIdx]) insertMdSuggestion(rows[mdSuggestIdx].getAttribute("data-name"));
        } else if (mdSuggestRows.length) {
          insertMdSuggestion(mdSuggestRows[0].name);
        }
      }

      function insertMdSuggestion(name) {
        var input = document.getElementById("mdSourceInput");
        if (!input || !name) return;
        var start = input.selectionStart;
        var before = input.value.slice(0, start);
        var m = before.match(/\{\{([^{}]*)$/);
        if (!m) { hideMdSuggest(); return; }
        var openAt = start - m[0].length;
        var after = input.value.slice(start);
        var close = after.indexOf("}}");
        var end = close >= 0 ? start + close + 2 : start;
        input.value =
          input.value.slice(0, openAt) + "{{" + name + "}}" + input.value.slice(end);
        hideMdSuggest();
        mdRender();
        input.focus();
        var pos = openAt + name.length + 4;
        try { input.setSelectionRange(pos, pos); } catch (e) {}
        toast("Media: " + name);
      }

      function hideMdSuggest() {
        var p = document.getElementById("mdSuggest");
        if (p) p.classList.remove("show");
        mdSuggestRows = [];
        mdSuggestIdx = -1;
      }

      document.addEventListener("mousedown", function (e) {
        var p = document.getElementById("mdSuggest");
        var input = document.getElementById("mdSourceInput");
        if (!p || !p.classList.contains("show")) return;
        if (e.target === input || (p.contains && p.contains(e.target))) return;
        hideMdSuggest();
      });
      window.addEventListener("resize", hideMdSuggest);
      window.addEventListener("scroll", hideMdSuggest, true);

      mdInit();
    </script>
  <script src="../../tracker.js"></script>
  </body>
