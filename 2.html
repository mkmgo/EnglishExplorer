<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>English Explorer — Kids Lesson</title>
    <meta name="description" content="English Explorer Interactive Lesson" />
    <link
      rel="icon"
      type="image/png"
      href="https://res.cloudinary.com/dp455m4rk/image/upload/v1785849408/sam_favipreview_v2i7l2.png"
    />
    <style>
      :root {
        --bg: #f5f7fb;
        --ink: #14213d;
        --muted: #60708d;
        --accent: #2878f0;
        --card: #ffffff;
        --shadow: 0 18px 50px rgba(20, 33, 61, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        touch-action: manipulation;
      }
      button {
        font: inherit;
        border: 0;
        cursor: pointer;
      }
      #app {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        position: relative;
        overflow: hidden;
      }
      .screen {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: clamp(10px, 2vh, 24px) clamp(10px, 2vw, 24px);
      }
      .screen.active {
        display: flex;
      }
      .content {
        width: min(1200px, 100%);
        max-height: 100%;
        position: relative;
        text-align: center;
      }
      h1 {
        font-size: clamp(2.5rem, 6vw, 6rem);
        margin: 0.15em 0;
        font-weight: 900;
        letter-spacing: -0.03em;
      }
      h2 {
        font-size: clamp(1.6rem, 3.5vw, 3.5rem);
        margin: 0.2em 0;
      }
      p {
        font-size: clamp(1.2rem, 2vw, 2rem);
      }
      .small {
        font-size: clamp(0.9rem, 1.4vw, 1.4rem);
        color: var(--muted);
      }
      .title-slide { background: #fff3cd; }
      .lesson-nav {
        display: flex;
        gap: 0.6em;
        justify-content: center;
        align-items: center;
        margin: 1em auto 0.5em;
      }
      .lesson-link {
        min-width: 52px;
        padding: 0.45em 1em;
        border-radius: 999px;
        background: white;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        font-size: clamp(1rem, 1.6vw, 1.4rem);
        font-weight: 800;
        color: var(--ink);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .lesson-link.active { background: var(--accent); color: white; }
      .card {
        background: var(--card);
        border-radius: 32px;
        padding: clamp(1.2rem, 2.2vw, 2.6rem);
        box-shadow: var(--shadow);
      }
      .emoji {
        font-size: clamp(3.5rem, 8vw, 8rem);
      }
      .row {
        display: flex;
        gap: 2vw;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 1em;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 15px;
        width: 100%;
        max-width: 900px;
        margin: 1em auto 0;
      }
      .choice {
        min-width: 130px;
        min-height: 75px;
        border-radius: 24px;
        background: white;
        box-shadow: var(--shadow);
        font-size: clamp(1.2rem, 2vw, 2rem);
        font-weight: 900;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.5em 1em;
      }
      .choice:active {
        transform: scale(0.95);
      }
      .yes { background: #dff7ec; color: #087443; }
      .no { background: #ffe4e4; color: #a52222; }
      
      /* Color Tiles */
      .color-btn {
        color: white;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      }
      .c-red { background: #e05252; }
      .c-blue { background: #2878f0; }
      .c-yellow { background: #f1c40f; color: #14213d; text-shadow: none; }
      .c-green { background: #19a974; }

      .topbar {
        position: absolute;
        top: 2vh;
        left: 3vw;
        right: 3vw;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 20;
      }
      .progress {
        font-size: 1.1rem;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.85);
        padding: 0.5em 1em;
        border-radius: 999px;
        font-weight: bold;
      }
      .controls { display: flex; gap: 0.7em; }
      .ctrl {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: white;
        box-shadow: 0 5px 18px rgba(0,0,0,0.12);
        font-size: 1.3rem;
      }
      .nav {
        position: absolute;
        bottom: 2vh;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 1em;
        z-index: 30;
      }
      .nav button {
        padding: 0.8em 1.5em;
        border-radius: 999px;
        background: white;
        box-shadow: 0 8px 22px rgba(0,0,0,0.12);
        font-weight: 700;
        font-size: 1.1rem;
      }
      .nav .primary { background: var(--accent); color: white; }
      .pulse { animation: pulse 1s ease-in-out infinite; }
      .nameInput {
        font-size: clamp(1.8rem, 3.5vw, 3.5rem);
        padding: 0.3em 0.5em;
        border: 4px solid #d8e0ee;
        border-radius: 20px;
        text-align: center;
        width: min(600px, 80vw);
      }
      #toast {
        position: absolute;
        left: 50%;
        top: 12%;
        transform: translateX(-50%);
        z-index: 100;
        background: #14213d;
        color: white;
        padding: 0.8em 1.5em;
        border-radius: 999px;
        font-size: 1.4rem;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
      }
      #toast.show { opacity: 1; }
      #reward {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 50;
      }
      .confetti {
        position: absolute;
        font-size: 2rem;
        animation: fall 2.2s linear forwards;
      }
      @keyframes pulse { 50% { transform: scale(1.04); } }
      @keyframes fall {
        0% { transform: translateY(-10vh) rotate(0); opacity: 1; }
        100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toast"></div>
      <div id="reward"></div>

      <div class="topbar">
        <div class="progress" id="progress">1 / 13</div>
        <div class="controls">
          <button class="ctrl" id="soundBtn" aria-label="Sound">🔊</button>
          <button class="ctrl" id="homeBtn" aria-label="Home">⌂</button>
        </div>
      </div>

      <!-- 1: Welcome -->
      <section class="screen title-slide active">
        <div class="content card">
          <div class="small">ENGLISH EXPLORER</div>
          <h1>English Explorer</h1>
          <h2>Lesson 3</h2>
          <div class="lesson-nav">
            <a class="lesson-link" href="1.html" aria-label="Lesson 1">1</a>
            <a class="lesson-link active" href="2.html" aria-label="Lesson 2">2</a>
            <a class="lesson-link" href="3.html" aria-label="Lesson 3">3</a>
          </div>
          <button class="choice pulse" style="background: var(--accent); color: white; margin-top: 1em;" onclick="next()">
            ▶ START LESSON 3
          </button>
        </div>
      </section>

      <!-- 2: Greetings (Hello & Goodbye) -->
      <section class="screen">
        <div class="content card">
          <div class="emoji">👋🏼</div>
          <h1>GREETINGS</h1>
          <div class="row">
            <button class="choice" onclick="say('Hello!'); reward('HELLO!');">👋🏼 HELLO</button>
            <button class="choice" onclick="say('Goodbye!'); reward('GOODBYE!');">👋🏼 GOODBYE</button>
          </div>
        </div>
      </section>

      <!-- 3: Personal Identity (My Name Is... / I Am...) -->
      <section class="screen">
        <div class="content card">
          <div class="emoji">🦊</div>
          <h2>MY NAME & AGE</h2>
          <input id="nameInput" class="nameInput" maxlength="18" placeholder="Type name" value="Sam" />
          <div class="row">
            <button class="choice yes" onclick="setName()">✨ MY NAME IS...</button>
            <button class="choice" onclick="say('I am seven!'); reward('I AM 7!');">🎂 I AM 7!</button>
          </div>
        </div>
      </section>

      <!-- 4: Commands (Stand Up, Sit Down, Look, Listen) -->
      <section class="screen">
        <div class="content card">
          <h1>LISTEN & DO!</h1>
          <div class="grid">
            <button class="choice" onclick="say('Stand up!'); reward('STAND UP!');">🧍 STAND UP</button>
            <button class="choice" onclick="say('Sit down!'); reward('SIT DOWN!');">🪑 SIT DOWN</button>
            <button class="choice" onclick="say('Look!'); reward('LOOK!');">👀 LOOK</button>
            <button class="choice" onclick="say('Listen!'); reward('LISTEN!');">👂 LISTEN</button>
          </div>
        </div>
      </section>

      <!-- 5: Yes / No Quiz -->
      <section class="screen">
        <div class="content card">
          <h1>YES or NO?</h1>
          <div class="emoji">⚽</div>
          <h2>IS IT A BALL?</h2>
          <div class="row">
            <button class="choice yes" onclick="say('Yes, it is a ball!'); reward('YES! ⚽');">YES ✅</button>
            <button class="choice no" onclick="say('No, try again!'); reward('TRY AGAIN');">NO ❌</button>
          </div>
        </div>
      </section>

      <!-- 6: Colors Question -->
      <section class="screen">
        <div class="content card">
          <div class="emoji">🎨</div>
          <h1>WHAT COLOUR IS IT?</h1>
          <button class="choice" onclick="say('What colour is it?'); reward('WHAT COLOUR?');">🔊 HEAR QUESTION</button>
        </div>
      </section>

      <!-- 7: Colors (Red, Blue, Yellow, Green) -->
      <section class="screen">
        <div class="content card">
          <h1>COLOURS</h1>
          <div class="grid">
            <button class="choice color-btn c-red" onclick="say('Red'); reward('RED!');">RED</button>
            <button class="choice color-btn c-blue" onclick="say('Blue'); reward('BLUE!');">BLUE</button>
            <button class="choice color-btn c-yellow" onclick="say('Yellow'); reward('YELLOW!');">YELLOW</button>
            <button class="choice color-btn c-green" onclick="say('Green'); reward('GREEN!');">GREEN</button>
          </div>
        </div>
      </section>

      <!-- 8: Numbers 1 to 7 -->
      <section class="screen">
        <div class="content card">
          <h1>NUMBERS 1 – 7</h1>
          <div class="grid">
            <button class="choice" onclick="say('One'); reward('1');">1</button>
            <button class="choice" onclick="say('Two'); reward('2');">2</button>
            <button class="choice" onclick="say('Three'); reward('3');">3</button>
            <button class="choice" onclick="say('Four'); reward('4');">4</button>
            <button class="choice" onclick="say('Five'); reward('5');">5</button>
            <button class="choice" onclick="say('Six'); reward('6');">6</button>
            <button class="choice" onclick="say('Seven'); reward('7');">7</button>
          </div>
        </div>
      </section>

      <!-- 9: Numbers 8, 9, 10 -->
      <section class="screen">
        <div class="content card">
          <h1>NUMBERS 8 – 10</h1>
          <div class="grid">
            <button class="choice" onclick="say('Eight'); reward('8');">8</button>
            <button class="choice" onclick="say('Nine'); reward('9');">9</button>
            <button class="choice" onclick="say('Ten'); reward('10');">10</button>
          </div>
        </div>
      </section>

      <!-- 10: Alphabet A to F -->
      <section class="screen">
        <div class="content card">
          <h1>LETTERS A – F</h1>
          <div class="grid">
            <button class="choice" onclick="say('A'); reward('A');">A</button>
            <button class="choice" onclick="say('B'); reward('B');">B</button>
            <button class="choice" onclick="say('C'); reward('C');">C</button>
            <button class="choice" onclick="say('D'); reward('D');">D</button>
            <button class="choice" onclick="say('E'); reward('E');">E</button>
            <button class="choice" onclick="say('F'); reward('F');">F</button>
          </div>
        </div>
      </section>

      <!-- 11: Alphabet G, H, I -->
      <section class="screen">
        <div class="content card">
          <h1>LETTERS G – I</h1>
          <div class="grid">
            <button class="choice" onclick="say('G'); reward('G');">G</button>
            <button class="choice" onclick="say('H'); reward('H');">H</button>
            <button class="choice" onclick="say('I'); reward('I');">I</button>
          </div>
        </div>
      </section>

      <!-- 12: Body Parts -->
      <section class="screen">
        <div class="content card">
          <h1>MY BODY PARTS</h1>
          <div class="grid">
            <button class="choice" onclick="say('Head'); reward('HEAD!');">🗣️ HEAD</button>
            <button class="choice" onclick="say('Eyes'); reward('EYES!');">👁️ EYES</button>
            <button class="choice" onclick="say('Nose'); reward('NOSE!');">👃 NOSE</button>
            <button class="choice" onclick="say('Mouth'); reward('MOUTH!');">👄 MOUTH</button>
            <button class="choice" onclick="say('Ears'); reward('EARS!');">👂 EARS</button>
            <button class="choice" onclick="say('Hands'); reward('HANDS!');">🙌 HANDS</button>
          </div>
        </div>
      </section>

      <!-- 13: Final Trophy -->
      <section class="screen">
        <div class="content card">
          <div class="emoji">⭐</div>
          <h1>ENGLISH STAR!</h1>
          <h2>GREAT JOB TODAY!</h2>
          <button class="choice" style="background: #ffeaa7; color: #8a4b00; margin-top: 0.5em;" onclick="say('Goodbye and well done!'); reward('GOODBYE!');">
            👋🏼 GOODBYE!
          </button>
        </div>
      </section>

      <!-- Navigation Bar -->
      <div class="nav">
        <button id="prevBtn" onclick="prev()">‹ BACK</button>
        <button class="primary" id="nextBtn" onclick="next()">NEXT ›</button>
      </div>
    </div>

    <script>
      var screens = Array.prototype.slice.call(document.querySelectorAll('.screen'));
      var idx = 0;
      var soundOn = true;
      var childName = "Sam";
      var progress = document.getElementById('progress');
      var synth = window.speechSynthesis || window.webkitSpeechSynthesis || null;

      function show(i) {
        idx = Math.max(0, Math.min(screens.length - 1, i));
        for (var j = 0; j < screens.length; j++) {
          screens[j].classList.toggle('active', j === idx);
        }
        progress.textContent = (idx + 1) + " / " + screens.length;
        document.getElementById('prevBtn').style.visibility = idx === 0 ? 'hidden' : 'visible';
        document.getElementById('nextBtn').textContent = (idx === screens.length - 1) ? 'RESTART ↻' : 'NEXT ›';
      }

      function next() {
        if (idx === screens.length - 1) show(0);
        else show(idx + 1);
      }

      function prev() {
        show(idx - 1);
      }

      function say(text) {
        if (!soundOn) return;
        // Native Tizen Web API Speech Engine Support
        if (window.tizen && window.tizen.tts) {
          try {
            tizen.tts.speak(String(text), {
              locale: 'en-US',
              rate: 0.85,
              pitch: 1.0
            });
            return;
          } catch (e) {}
        }
        // Standard Web Speech API
        if (synth && typeof SpeechSynthesisUtterance !== 'undefined') {
          if (synth.speaking) synth.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US';
          u.rate = 0.85;
          synth.speak(u);
        }
      }

      function setName() {
        childName = (document.getElementById('nameInput').value || '').trim();
        if (!childName) childName = "Explorer";
        say("My name is " + childName + ".");
        reward("MY NAME IS " + childName.toUpperCase() + "!");
      }

      function toast(t) {
        var el = document.getElementById('toast');
        el.textContent = t;
        el.classList.add('show');
        setTimeout(function() { el.classList.remove('show'); }, 1200);
      }

      function reward(t) {
        toast(t);
        var r = document.getElementById('reward');
        r.innerHTML = '';
        for (var i = 0; i < 20; i++) {
          var s = document.createElement('span');
          s.className = 'confetti';
          s.textContent = ['⭐', '✨', '🎉', '👏'][i % 4];
          s.style.left = (Math.random() * 100) + '%';
          s.style.top = '-5%';
          s.style.animationDelay = (Math.random() * 0.4) + 's';
          r.appendChild(s);
        }
        setTimeout(function() { r.innerHTML = ''; }, 2200);
      }

      document.getElementById('soundBtn').onclick = function() {
        soundOn = !soundOn;
        this.textContent = soundOn ? "🔊" : "🔇";
      };

      document.getElementById('homeBtn').onclick = function() { show(0); };

      document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight' || e.key === ' ') next();
        if (e.key === 'ArrowLeft') prev();
        if (e.key === 'Escape') show(0);
      });

      show(0);
    </script>
  </body>
</html>
